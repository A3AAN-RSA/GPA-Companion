async function repairOldAttachments(){
  const statusEl = document.getElementById('repairStatus');
  state.activityMaterials = state.activityMaterials || {};
  const keys = Object.keys(state.activityMaterials);
  let total = 0, fixed = 0, failed = 0;
  keys.forEach(k => { (state.activityMaterials[k]||[]).forEach(a => { if(!a.libId) total++; }); });
  if(total===0){ if(statusEl) statusEl.textContent = 'Nothing to repair — every attachment already has a library link.'; return; }
  let done = 0;
  for(const k of keys){
    const list = state.activityMaterials[k] || [];
    for(const a of list){
      if(a.libId) continue;
      done++;
      if(statusEl) statusEl.textContent = `Repairing ${done} of ${total}…`;
      try{
        const rawSrc = resolveAttachedSrc(a);
        const finalSrc = await resolveAndNormalizePicture(rawSrc, a.gender||null);
        const newLibId = uid();
        state.photoLibrary.push({id:newLibId, label:a.code||'', category:null, dataUrl:finalSrc, gender:a.gender||undefined});
        a.file = null;
        a.libId = newLibId;
        a.source = 'library';
        fixed++;
      }catch(e){ failed++; }
    }
  }
  await saveData();
  if(statusEl) statusEl.textContent = `Done — repaired ${fixed}, ${failed} failed, out of ${total} total. These should now appear in Solo Practice.`;
}
async function saveAttachmentEdit(attKey, idx){
  const a = (state.activityMaterials[attKey]||[])[idx];
  if(!a) return;
  const attId = attKey+'|'+idx;
  const labelEl = document.getElementById('attEditLabel-'+attId);
  const label = labelEl ? labelEl.value.trim() : (a.code||'');
  const newGender = editingAttachmentGender || null;
  const genderChanged = newGender !== (a.gender||null);
  a.code = label;
  a.gender = newGender;
  if(genderChanged){
    const rawSrc = resolveAttachedSrc(a);
    const finalSrc = await resolveAndNormalizePicture(rawSrc, newGender);
    if(a.libId && a.source==='library'){
      const p = state.photoLibrary.find(p=>p.id===a.libId);
      if(p){ p.dataUrl = finalSrc; p.label = label; p.gender = newGender||undefined; }
    } else if(a.libId && a.source==='busy'){
      const p = state.busyPictures.find(p=>p.id===a.libId);
      if(p){ p.dataUrl = finalSrc; p.label = label; }
    } else if(a.libId && a.source==='lexicarry'){
      const p = state.lexicarryPictures.find(p=>p.id===a.libId);
      if(p){ p.dataUrl = finalSrc; p.label = label; }
    } else {
      // graphics-pack-sourced (or no libId) — convert to an editable library copy
      const newLibId = uid();
      state.photoLibrary.push({id:newLibId, label, category:null, dataUrl:finalSrc, gender:newGender||undefined});
      a.file = null;
      a.libId = newLibId;
      a.source = 'library';
    }
    // Propagate to any word(s) already recorded against this exact picture, so a gender
    // change made here is reflected everywhere that picture and its words are used.
    if(a.libId){
      state.words.filter(w=>w.sourceLibId===a.libId).forEach(w=>{ w.photo = finalSrc; w.gender = newGender; });
    }
  }
  await saveData();
  editingAttachmentId = null;
  editingAttachmentGender = null;
  if(activeTab==='assign') renderAssign(document.getElementById('content'));
  else renderMeetings(document.getElementById('content'));
}

async function addAndMaybeRecord(prefix, shouldRecord){

  const displayType = document.getElementById(prefix+'DisplayType').value;
  const fileInput = document.getElementById(prefix+'Photo');
  const id = uid();
  const entry = {
    id, text, meetingPlan,
    stepIndex: (presetStepIndex!=null && presetStepIndex!==undefined) ? presetStepIndex : null,
    stepName: presetStepName || null,
    entryType: entryTypeEl ? entryTypeEl.value : 'word',
    category: categoryEl ? (categoryEl.value.trim() || null) : null,
    isPower: powerEl.value==='yes',
    iceberg:9,
    dateAdded:new Date().toISOString().slice(0,10),
    lastReview:null,
    photo:null,
    displayType,
    hasAudio:false,
  };
  const rerender = ()=>{ if(activeTab==='words') renderWords(document.getElementById('content')); else renderMeetings(document.getElementById('content')); };
  const finish = async ()=>{
    const gender = wordFormGender[prefix] || null;
    if(gender && entry.photo){
      entry.photo = await applyGenderLabelToPhoto(entry.photo, gender);
    }
    state.words.push(entry);
    await saveData();
    delete graphicsSelection[prefix];
    delete wordFormGender[prefix];
    if(shouldRecord){
      startWordRecording(id, prefix+'Status', rerender);
    } else {
      rerender();
    }
  };
  if(displayType==='graphics' && graphicsSelection[prefix]){
    entry.photo = 'graphics/' + graphicsSelection[prefix].file;
    finish();
    return;
  }
  if(displayType==='library' && librarySelection[prefix]){
    const libItem = state.photoLibrary.find(p=>p.id===librarySelection[prefix]);
    if(libItem){
      entry.photo = libItem.dataUrl;
      delete librarySelection[prefix];
      finish();
      return;
    }
  }
  if(displayType==='reference' && referenceSelection[prefix]!=null){
    const items = referenceImagesForForm(prefix);
    const item = items[referenceSelection[prefix]];
    if(item){
      entry.photo = item.src;
      delete referenceSelection[prefix];
      finish();
      return;
    }
  }
  if(displayType==='busy' && busySelection[prefix]){
    const busyItem = state.busyPictures.find(p=>p.id===busySelection[prefix]);
    if(busyItem){
      entry.photo = busyItem.dataUrl;
      delete busySelection[prefix];
      finish();
      return;
    }
  }
  if(fileInput && fileInput.files && fileInput.files[0]){
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onerror = ()=>{
        console.error('Photo failed to load/decode — saving entry without photo.');
        finish();
      };
      img.onload = ()=>{
        const canvas = document.createElement('canvas');
        const maxW = 500;
        const scale = Math.min(1, maxW/img.width);
        canvas.width = img.width*scale; canvas.height = img.height*scale;
        canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
        entry.photo = canvas.toDataURL('image/jpeg', 0.7);
        finish();
      };
      img.src = reader.result;
    };
    reader.onerror = ()=>{ console.error('File read failed — saving entry without photo.'); finish(); };
    reader.readAsDataURL(fileInput.files[0]);
  } else { finish(); }
}

function toggleStep(planN, stepIdx){

  const arr = state.stepProgress[planN] || [];

function autoUpdateMeetingStatus(planN){
  // Checking off steps now drives the meeting's status automatically, rather than requiring a
  // separate, easy-to-forget manual dropdown. This only ever moves status forward (none -> progress
  // -> done) — it never downgrades a "done" a person already reached, whether that came from
  // finishing every step or from explicitly setting the dropdown themselves.
  const mp = MEETING_PLANS.find(m=>m.n===planN);
  if(!mp || !mp.detailed) return;
  const detail = MEETING_DETAILS[planN];
  if(!detail) return;
  const totalSteps = detail.steps.length;
  const checked = (state.stepProgress[planN]||[]).filter(Boolean).length;
  const current = state.meetingComplete[planN];
  if(current==='done') return;
  if(totalSteps>0 && checked>=totalSteps){
    state.meetingComplete[planN] = 'done';
  } else if(checked>0){
    state.meetingComplete[planN] = 'progress';
  } else if(current==='progress'){
    state.meetingComplete[planN] = 'none';
  }
}

function meetingCategory(mp){
  const t = (mp.topics+' '+mp.title).toLowerCase();
  if(/color|size|shape|length/.test(t)) return 'attribute';
  if(/number|quantity|money|buy|sell/.test(t)) return 'number';
  if(/room|house|neighbo(u)?rhood|geographical|countryside|places/.test(t)) return 'place';
  if(/family|body|emotion|people|nation|countr(y|ies)/.test(t)) return 'people';
  if(/verb|action|wash|cut|cook|open|close|push|climb|fly|swim|drive|touch|look|give|take|throw|show|listen|read|want|have|see|like|rest|work|cough|sneeze|bend|break|fold/.test(t)) return 'action';
  return 'object';
}
function suggestedMaterials(mp){
  const cat = meetingCategory(mp);
  if(cat==='people'){
    return {status:'not-applicable'};
  }
  const profileText = ((state.profile.profession||'')+' '+(state.profile.interests||'')).toLowerCase();
  if(!profileText.trim()) return {status:'no-profile'};
  const matched = Object.entries(OBJECT_BANKS).filter(([k,b])=> b.match.some(m=>profileText.includes(m)));
  if(matched.length===0) return {status:'no-match'};
  let items = [];
  matched.forEach(([k,b])=>{
    const sub = cat==='action' ? (b.actions||b.objects) : cat==='place' ? (b.places||b.objects) : b.objects;
    items = items.concat(sub);
  });
  return {status:'ok', items:[...new Set(items)].slice(0,6)};
}

}

async function movePictureBetweenCollections(id, fromCollection, toCollection){
  const fromArr = fromCollection==='library' ? state.photoLibrary : state.lexicarryPictures;
  const toArr = toCollection==='library' ? state.photoLibrary : state.lexicarryPictures;
  const idx = fromArr.findIndex(p=>p.id===id);
  if(idx<0) return;
  const [item] = fromArr.splice(idx,1);
  toArr.push(item);
  // Anything already attached to an activity (or otherwise resolved) via this id needs its
  // "source" updated too, or it would stop resolving correctly after the move.
  if(state.activityMaterials){
    Object.keys(state.activityMaterials).forEach(k=>{
      state.activityMaterials[k].forEach(a=>{ if(a.libId===id) a.source = toCollection; });
    });
  }
  await saveData();
  renderLibraryTabBody();
}

let libBatchStaged = [];
function handleBatchFileSelect(){
  const fileInput = document.getElementById('libTabUpload');
  if(!fileInput || !fileInput.files || fileInput.files.length===0) return;
  const files = Array.from(fileInput.files);
  Promise.all(files.map(file => new Promise((resolve)=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onerror = ()=> resolve(null);
      img.onload = ()=>{
        const canvas = document.createElement('canvas');
        const maxW = 500;
        const scale = Math.min(1, maxW/img.width);
        canvas.width = img.width*scale; canvas.height = img.height*scale;
        canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
        resolve({tempId: uid(), dataUrl: canvas.toDataURL('image/jpeg', 0.85), label:'', category:''});
      };
      img.src = reader.result;
    };
    reader.onerror = ()=>resolve(null);
    reader.readAsDataURL(file);
  }))).then(results=>{
    libBatchStaged = libBatchStaged.concat(results.filter(Boolean));
    renderLibraryTabMine(document.getElementById('libraryTabBody'));
  });
}

let activeRecorder = null;
async function convertToMp3(input){
  let arrayBuffer;
  if(typeof input === 'string'){
    const res = await fetch(input);
    arrayBuffer = await res.arrayBuffer();
  } else {
    arrayBuffer = await input.arrayBuffer();
  }
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
  audioCtx.close();
  const sampleRate = audioBuffer.sampleRate;
  const samples = audioBuffer.getChannelData(0);
  const int16Samples = new Int16Array(samples.length);
  for(let i=0;i<samples.length;i++){
    let s = Math.max(-1, Math.min(1, samples[i]));
    int16Samples[i] = s<0 ? s*0x8000 : s*0x7FFF;
  }
  const mp3encoder = new lamejs.Mp3Encoder(1, sampleRate, 64);
  const mp3Chunks = [];
  const blockSize = 1152;
  for(let i=0;i<int16Samples.length;i+=blockSize){
    const chunk = int16Samples.subarray(i, i+blockSize);
    const buf = mp3encoder.encodeBuffer(chunk);
    if(buf.length>0) mp3Chunks.push(buf);
  }
  const finalBuf = mp3encoder.flush();
  if(finalBuf.length>0) mp3Chunks.push(finalBuf);
  const mp3Blob = new Blob(mp3Chunks, {type:'audio/mp3'});
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onloadend = ()=> resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(mp3Blob);
  });
}
async function convertAllRecordingsToMp3(){
  const statusEl = document.getElementById('mp3ConvertStatus');
  const list = await window.storage.list('wordaudio:', false);
  const keys = list.keys;
  let done = 0, skipped = 0, failed = 0;
  for(const key of keys){
    if(statusEl) statusEl.textContent = `Converting ${done+skipped+failed+1} of ${keys.length}…`;
    try{
      const res = await window.storage.get(key, false);
      if(!res || !res.value) { skipped++; continue; }
      const parsed = JSON.parse(res.value);
      if(!parsed.dataUrl) { skipped++; continue; }
      if(parsed.dataUrl.startsWith('data:audio/mp3') || parsed.dataUrl.startsWith('data:audio/mpeg')){ skipped++; continue; }
      const mp3DataUrl = await convertToMp3(parsed.dataUrl);
      await window.storage.set(key, JSON.stringify({dataUrl:mp3DataUrl}), false);
      done++;
    }catch(e){ failed++; console.error('Failed to convert', key, e); }
  }
  if(statusEl) statusEl.textContent = `Done — converted ${done}, already MP3 ${skipped}, failed ${failed} (out of ${keys.length} total).`;
}
let recordingInFlight = false;
async function startWordRecording(wordId, targetElId, onDone, storageKey){
  if(recordingInFlight) return;
  const elId = targetElId || ('wAudio-'+wordId);
  const el = document.getElementById(elId);
  if(!el) return;
  if(activeRecorder && activeRecorder.state==='recording'){ activeRecorder.stop(); }
  recordingInFlight = true;
  try{
    const stream = await navigator.mediaDevices.getUserMedia({audio:{channelCount:1}});
    let chunks = [];
    const rec = new MediaRecorder(stream, {audioBitsPerSecond:32000});
    activeRecorder = rec;
    recordingInFlight = false;
    el.innerHTML = '<span class="meta">Recording…</span> <button class="ghost" onclick="stopActiveRecording()">Stop</button>';
    rec.ondataavailable = e=>chunks.push(e.data);
    rec.onstop = async ()=>{
      stream.getTracks().forEach(t=>t.stop());
      if(activeRecorder===rec) activeRecorder = null;
      const blob = new Blob(chunks, {type:'audio/webm'});
      el.innerHTML = '<span class="meta">Converting…</span>';
      try{
        const mp3DataUrl = await convertToMp3(blob);
        const key = storageKey || ('wordaudio:'+wordId);
        await window.storage.set(key, JSON.stringify({dataUrl:mp3DataUrl}), false);
        if(!storageKey){
          const w = state.words.find(w=>w.id===wordId);
          if(w) w.hasAudio = true;
        }
        await saveData();
        if(onDone){ onDone(); }
        else { const freshEl = document.getElementById(elId); if(freshEl) freshEl.innerHTML = `<audio controls src="${mp3DataUrl}"></audio>`; }
      }catch(e){ const freshEl=document.getElementById(elId); if(freshEl) freshEl.innerHTML = '<span class="meta">Save failed.</span>'; }
    };
    rec.start();
    setTimeout(()=>{ if(rec.state==='recording') rec.stop(); }, 180000);
  }catch(e){
    recordingInFlight = false;
    el.innerHTML = '<span class="meta">Microphone unavailable.</span>';
  }
}
function stopActiveRecording(){

let reviewActive = false, reviewSelected = null, reviewCurrent = null, reviewRevealed = false, reviewStats = {seen:0, known:0};
function groupWordsForDisplay(wordsList){
  const map = {};
  wordsList.forEach(w=>{
    let topLabel, subLabel;
    if(w.meetingPlan){
      const mp = MEETING_PLANS.find(m=>m.n===Number(w.meetingPlan));
      topLabel = mp ? `Meeting Plan ${mp.n}: ${mp.title}` : `Meeting Plan ${w.meetingPlan}`;
      const detail = MEETING_DETAILS[Number(w.meetingPlan)];
      const step = (detail && w.stepIndex!=null) ? detail.steps[Number(w.stepIndex)] : null;
      subLabel = (step && step.game) || w.stepName || 'General';
    } else {
      topLabel = 'Other / Extra';
      subLabel = w.category || 'Uncategorized';
    }
    map[topLabel] = map[topLabel] || {};
    map[topLabel][subLabel] = map[topLabel][subLabel] || [];
    map[topLabel][subLabel].push(w);
  });
  const topLabels = Object.keys(map).sort((a,b)=>{
    if(a==='Other / Extra') return 1;
    if(b==='Other / Extra') return -1;
    return a.localeCompare(b, undefined, {numeric:true});
  });
  return topLabels.map(topLabel => ({
    topLabel,
    subs: Object.keys(map[topLabel]).sort().map(subLabel => ({subLabel, words: map[topLabel][subLabel]}))
  }));
}

    groups.forEach(g=>{

function reviewPool(){
  return state.words.filter(w=> w.hasAudio && reviewSelected.has(w.id));

function pickNextReviewWord(){
  const pool = reviewPool();
  if(pool.length===0){ reviewCurrent = null; return; }
  const weight = w => w.iceberg;
  let candidates = pool;
  if(pool.length>1 && reviewCurrent){ candidates = pool.filter(w=>w.id!==reviewCurrent.id); if(candidates.length===0) candidates = pool; }
  const total = candidates.reduce((a,w)=>a+weight(w),0);
  let r = Math.random()*total;
  for(const w of candidates){ r -= weight(w); if(r<=0){ reviewCurrent = w; reviewRevealed=false; return; } }
  reviewCurrent = candidates[candidates.length-1]; reviewRevealed=false;
}
async function answerReview(knewIt){
  reviewRevealed = true;
  reviewStats.seen++;
  if(knewIt) reviewStats.known++;
  const w = state.words.find(w=>w.id===reviewCurrent.id);
  if(w){
    w.iceberg = knewIt ? Math.max(w.iceberg-1, 1) : Math.min(w.iceberg+1, 9);
    w.lastReview = new Date().toISOString().slice(0,10);
    w.reviewCount = (w.reviewCount||0) + 1;
    if(!knewIt){ w.reviewMissCount = (w.reviewMissCount||0) + 1; w.suggestionDismissed = false; }
  }
  saveData();
  renderReview(document.getElementById('content'), false);
  await playRandomAnswerSound(knewIt ? 'know' : 'dontknow');
  if(reviewCurrent) loadPlayerInto('reviewPlayer', 'word', reviewCurrent.id, true);

// ---------- Grid Review ----------
let gridReviewActive = false, gridReviewPool = [], gridReviewGrid = [], gridReviewCurrent = null,
    gridReviewWrongAttempt = false, gridReviewRoundsSince = {}, gridReviewStats = {seen:0, known:0}, gridReviewNotEnough = false, gridReviewFeedback = null,
    gridReviewMode = 'all', gridReviewIntroduced = [], gridReviewRemaining = [], gridReviewPhase = 'quiz';
function startGridReview(){
  const pool = state.words.filter(w=> w.hasAudio && w.photo && reviewSelected.has(w.id));
  if(pool.length<2){
    gridReviewNotEnough = true;
    reviewSelected = null;
    renderReview(document.getElementById('content'));
    return;
  }
  gridReviewNotEnough = false;
  gridReviewPool = pool;
  gridReviewRoundsSince = {};
  gridReviewGrid = [];
  gridReviewActive = true;
  gridReviewStats = {seen:0, known:0};
  reviewSessionStart = Date.now();
  if(gridReviewMode==='rrd'){
    gridReviewIntroduced = [];
    gridReviewRemaining = shuffleArray(pool.map(w=>w.id));
    gridReviewPhase = 'intro';
    gridReviewCurrent = null;
    gridReviewIntroduceNext();
  } else {
    gridReviewIntroduced = pool.map(w=>w.id);
    gridReviewRemaining = [];
    gridReviewPhase = 'quiz';
    rebuildGridReviewGrid(null);
    pickGridReviewWord();
    renderReview(document.getElementById('content'));
  }
}
function gridReviewIntroduceNext(){
  if(gridReviewRemaining.length===0) return;
  const idx = Math.floor(Math.random()*gridReviewRemaining.length);
  const nextId = gridReviewRemaining.splice(idx,1)[0];
  gridReviewIntroduced.push(nextId);
  gridReviewPhase = 'intro';
  gridReviewFeedback = null;
  gridReviewWrongAttempt = false;
  rebuildGridReviewGrid(nextId);
  gridReviewCurrent = gridReviewPool.find(w=>w.id===nextId);
  renderReview(document.getElementById('content'));
}
function gridReviewStartQuiz(){
  if(gridReviewIntroduced.length===0) return;
  gridReviewPhase = 'quiz';
  rebuildGridReviewGrid(null);
  pickGridReviewWord();
  renderReview(document.getElementById('content'));
}
function rebuildGridReviewGrid(forceIncludeId){
  const ids = gridReviewIntroduced.slice();
  ids.forEach(id=>{
    if(gridReviewGrid.includes(id)) gridReviewRoundsSince[id] = 0;
    else gridReviewRoundsSince[id] = (gridReviewRoundsSince[id]||0) + 1;
  });
  let grid = [];
  let candidates = ids.slice();
  if(forceIncludeId){
    grid.push(forceIncludeId);
    candidates = candidates.filter(id=>id!==forceIncludeId);
  }
  const slots = Math.min(LIVE_GRID_MAX, ids.length) - grid.length;
  if(slots>0 && candidates.length>0){
    const weights = candidates.map(id=>(gridReviewRoundsSince[id]||0)+1);
    grid = grid.concat(weightedSampleWithoutReplacement(candidates, weights, Math.min(slots, candidates.length)));
  }
  gridReviewGrid = shuffleArray(grid);
}
function pickGridReviewWord(){
  const gridWords = gridReviewGrid.map(id=>gridReviewPool.find(w=>w.id===id)).filter(Boolean);
  if(gridWords.length===0){ gridReviewCurrent = null; return; }
  gridReviewCurrent = gridWords[Math.floor(Math.random()*gridWords.length)];
  gridReviewWrongAttempt = false;
}
function handleGridPick(wordId){
  if(!gridReviewCurrent || gridReviewPhase!=='quiz') return;
  gridReviewFeedback = null;
  if(wordId === gridReviewCurrent.id){
    gridReviewStats.seen++;
    const knewIt = !gridReviewWrongAttempt;
    if(knewIt) gridReviewStats.known++;
    const w = state.words.find(w=>w.id===wordId);
    if(w){
      w.iceberg = knewIt ? Math.max(w.iceberg-1, 1) : Math.min(w.iceberg+1, 9);
      w.lastReview = new Date().toISOString().slice(0,10);
      w.reviewCount = (w.reviewCount||0) + 1;
      if(!knewIt){ w.reviewMissCount = (w.reviewMissCount||0) + 1; w.suggestionDismissed = false; }
    }
    saveData();
    rebuildGridReviewGrid(null);
    pickGridReviewWord();
    gridReviewFeedback = 'correct';
    renderReview(document.getElementById('content'), false);
    playRandomAnswerSound('yes').then(()=>{
      if(gridReviewCurrent) loadPlayerInto('gridReviewPlayer', 'word', gridReviewCurrent.id, true);
    });
  } else {
    gridReviewWrongAttempt = true;
    renderReview(document.getElementById('content'), false);
    playRandomAnswerSound('no').then(()=>{
      if(gridReviewCurrent) loadPlayerInto('gridReviewPlayer', 'word', gridReviewCurrent.id, true);
    });
  }
}
function endGridReview(){
  stopAllReviewAudio();
  if(reviewSessionStart){
    const minutes = (Date.now()-reviewSessionStart)/60000;
    if(minutes>0.1){
      state.revisionMinutes = (state.revisionMinutes||0) + minutes;
      saveData();
    }
    lastReviewSummary = {minutes: minutes.toFixed(1), seen: gridReviewStats.seen, known: gridReviewStats.known};
    reviewSessionStart = null;
  }
  gridReviewActive = false; gridReviewCurrent = null; gridReviewPool = []; gridReviewGrid = [];
  gridReviewIntroduced = []; gridReviewRemaining = []; reviewSelected = null;
  renderReview(document.getElementById('content'));
}

      ${gridWords.map(w=>`<div ${isIntro?'':`onclick="handleGridPick('${w.id}')"`} style="cursor:${isIntro?'default':'pointer'};aspect-ratio:1;overflow:hidden;border-radius:6px;border:2px solid ${isIntro && w.id===gridReviewCurrent.id?'var(--teal)':'var(--paper-line)'};background:#fff;"><img src="${w.photo}" style="width:100%;height:100%;object-fit:contain;"></div>`).join('')}

  if(autoplay!==false) loadPlayerInto('gridReviewPlayer', 'word', gridReviewCurrent.id, true);

let answerSoundCache = {};
async function preloadAnswerSounds(){
  const cache = {};
  const cats = Object.keys(state.answerSounds || {});
  for(const cat of cats){
    const list = state.answerSounds[cat] || [];
    cache[cat] = [];
    for(const s of list){
      try{
        const res = await window.storage.get('wordaudio:'+s.id, false);
        if(res && res.value) cache[cat].push({dataUrl: JSON.parse(res.value).dataUrl});
      }catch(e){}
    }
  }
  answerSoundCache = cache;
}
function playRandomAnswerSound(category){
  return new Promise((resolve)=>{
    const list = answerSoundCache[category] || [];
    if(list.length===0){ resolve(); return; }
    const pick = list[Math.floor(Math.random()*list.length)];
    const audio = new Audio(pick.dataUrl);
    audio.onended = ()=>resolve();
    audio.onerror = ()=>resolve();
    audio.play().catch(()=>resolve());
  });
}

let alphaReviewStyle = 'normal', alphaReviewGridMode = 'all', alphaReviewSelected = null,
    alphaReviewActive = false, alphaReviewCurrent = null, alphaReviewRevealed = false, alphaReviewStats = {seen:0, known:0},
    alphaGridActive = false, alphaGridPool = [], alphaGridGrid = [], alphaGridCurrent = null, alphaGridWrongAttempt = false,
    alphaGridRoundsSince = {}, alphaGridStats = {seen:0, known:0}, alphaGridFeedback = null,
    alphaGridMode = 'all', alphaGridIntroduced = [], alphaGridRemaining = [], alphaGridPhase = 'quiz', alphaGridNotEnough = false,
    readingTestActive = false, readingTestPool = [], readingTestCurrent = null, readingTestRevealed = false, readingTestNotEnough = false;
function alphaHasAudio(){ return state.alphabet.filter(a=>a.hasAudio); }
function renderAlphabetReviewSetup(el){

      </div>
      <button class="primary" onclick="startAlphaReview()">Start review</button>
    ` : `
      <div class="empty" style="margin-bottom:10px;">This tests reading only — it draws exclusively from words you've spelled out (Word Log → "Spell using alphabet") and already reviewed at least once. New, unreviewed words never appear here.</div>

    `}
  `;
}
function setAlphaReviewStyle(v){ alphaReviewStyle = v; renderAlphabetReviewSetup(document.getElementById('alphabetTabBody')); }
function setAlphaGridMode(v){ alphaGridMode = v; }
function selectAllAlphaChars(v){ document.querySelectorAll('.alphaCheck').forEach(cb=>cb.checked=v); }

async function startAlphaReview(){
  await preloadAnswerSounds();
  const checked = [...document.querySelectorAll('.alphaCheck:checked')].map(cb=>cb.value);
  alphaReviewSelected = new Set(checked);
  if(alphaReviewStyle==='grid'){ startAlphaGridReview(); return; }

  reviewSessionStart = Date.now();
  pickNextAlphaWord();
  renderAlphabet(document.getElementById('content'));
}
function alphaReviewPool(){
  return state.alphabet.filter(a=>a.hasAudio && alphaReviewSelected.has(a.id));
}
function pickNextAlphaWord(){
  const pool = alphaReviewPool();
  if(pool.length===0){ alphaReviewCurrent = null; return; }
  let candidates = pool;
  if(pool.length>1 && alphaReviewCurrent){ candidates = pool.filter(a=>a.id!==alphaReviewCurrent.id); if(candidates.length===0) candidates = pool; }
  alphaReviewCurrent = candidates[Math.floor(Math.random()*candidates.length)];
  alphaReviewRevealed = false;
}
function answerAlphaReview(){
  alphaReviewRevealed = true;
  alphaReviewStats.seen++;
  renderAlphabet(document.getElementById('content'));
}
async function nextAlphaReview(){
  await playRandomAnswerSound('next');
  pickNextAlphaWord();
  renderAlphabet(document.getElementById('content'));
}
function endAlphaReview(){
  stopAllReviewAudio();
  playRandomAnswerSound('finish');
  if(reviewSessionStart){
    const minutes = (Date.now()-reviewSessionStart)/60000;
    if(minutes>0.1){ state.revisionMinutes = (state.revisionMinutes||0)+minutes; saveData(); }
    reviewSessionStart = null;
  }
  alphaReviewActive = false; alphaReviewCurrent = null; alphaReviewSelected = null;
  renderAlphabet(document.getElementById('content'));
}
function renderAlphaReviewActive(el, autoplay){
  if(!alphaReviewCurrent){
    el.innerHTML = `<div class="empty">Nothing left in your selection. <button class="ghost" onclick="endAlphaReview()">Back to setup</button></div>`;
    return;

  const a = alphaReviewCurrent;
  el.innerHTML = `

      ${!alphaReviewRevealed ? `<div style="margin-top:16px;"><button class="primary" onclick="answerAlphaReview()">Show character</button></div>`
        : `<div style="font-size:2.4rem;font-family:'Lora',serif;margin-top:14px;">${escapeHtml(a.char)}</div>
           <button class="primary" style="margin-top:14px;" onclick="nextAlphaReview()">Next</button>`}
    </div>
    <button class="ghost" style="margin-top:14px;" onclick="endAlphaReview()">End review</button>
  `;
  if(autoplay!==false) loadPlayerInto('alphaReviewPlayer', 'word', a.id, true);
}

function startAlphaGridReview(){
  const pool = state.alphabet.filter(a=> a.hasAudio && alphaReviewSelected.has(a.id));
  if(pool.length<2){ alphaGridNotEnough = true; alphaReviewSelected = null; renderAlphabetTabBody(); return; }
  alphaGridNotEnough = false;
  alphaGridPool = pool;
  alphaGridRoundsSince = {};
  alphaGridGrid = [];
  alphaGridActive = true;
  alphaGridStats = {seen:0, known:0};
  reviewSessionStart = Date.now();
  if(alphaGridMode==='rrd'){
    alphaGridIntroduced = [];
    alphaGridRemaining = shuffleArray(pool.map(a=>a.id));
    alphaGridPhase = 'intro';
    alphaGridCurrent = null;
    alphaGridIntroduceNext();
  } else {
    alphaGridIntroduced = pool.map(a=>a.id);
    alphaGridRemaining = [];
    alphaGridPhase = 'quiz';
    rebuildAlphaGrid(null);
    pickAlphaGridChar();
    renderAlphabet(document.getElementById('content'));
  }
}
function alphaGridIntroduceNext(){
  if(alphaGridRemaining.length===0) return;
  const idx = Math.floor(Math.random()*alphaGridRemaining.length);
  const nextId = alphaGridRemaining.splice(idx,1)[0];
  alphaGridIntroduced.push(nextId);
  alphaGridPhase = 'intro';
  alphaGridFeedback = null;
  alphaGridWrongAttempt = false;
  rebuildAlphaGrid(nextId);
  alphaGridCurrent = alphaGridPool.find(a=>a.id===nextId);
  renderAlphabet(document.getElementById('content'));
}
function alphaGridStartQuiz(){
  if(alphaGridIntroduced.length===0) return;
  alphaGridPhase = 'quiz';
  rebuildAlphaGrid(null);
  pickAlphaGridChar();
  renderAlphabet(document.getElementById('content'));
}
function rebuildAlphaGrid(forceIncludeId){
  const ids = alphaGridIntroduced.slice();
  ids.forEach(id=>{
    if(alphaGridGrid.includes(id)) alphaGridRoundsSince[id] = 0;
    else alphaGridRoundsSince[id] = (alphaGridRoundsSince[id]||0) + 1;
  });
  let grid = [];
  let candidates = ids.slice();
  if(forceIncludeId){ grid.push(forceIncludeId); candidates = candidates.filter(id=>id!==forceIncludeId); }
  const slots = Math.min(LIVE_GRID_MAX, ids.length) - grid.length;
  if(slots>0 && candidates.length>0){
    const weights = candidates.map(id=>(alphaGridRoundsSince[id]||0)+1);
    grid = grid.concat(weightedSampleWithoutReplacement(candidates, weights, Math.min(slots, candidates.length)));
  }
  alphaGridGrid = shuffleArray(grid);
}
function pickAlphaGridChar(){
  const gridChars = alphaGridGrid.map(id=>alphaGridPool.find(a=>a.id===id)).filter(Boolean);
  if(gridChars.length===0){ alphaGridCurrent = null; return; }
  alphaGridCurrent = gridChars[Math.floor(Math.random()*gridChars.length)];
  alphaGridWrongAttempt = false;
}
function handleAlphaGridPick(charId){
  if(!alphaGridCurrent || alphaGridPhase!=='quiz') return;
  alphaGridFeedback = null;
  if(charId === alphaGridCurrent.id){
    alphaGridStats.seen++;
    if(!alphaGridWrongAttempt) alphaGridStats.known++;
    rebuildAlphaGrid(null);
    pickAlphaGridChar();
    alphaGridFeedback = 'correct';
    renderAlphabet(document.getElementById('content'), false);
    playRandomAnswerSound('yes').then(()=>{
      if(alphaGridCurrent) loadPlayerInto('alphaGridPlayer', 'word', alphaGridCurrent.id, true);
    });
  } else {
    alphaGridWrongAttempt = true;
    renderAlphabet(document.getElementById('content'), false);
    playRandomAnswerSound('no').then(()=>{
      if(alphaGridCurrent) loadPlayerInto('alphaGridPlayer', 'word', alphaGridCurrent.id, true);
    });
  }
}
function endAlphaGridReview(){
  stopAllReviewAudio();
  if(reviewSessionStart){
    const minutes = (Date.now()-reviewSessionStart)/60000;
    if(minutes>0.1){ state.revisionMinutes = (state.revisionMinutes||0)+minutes; saveData(); }
    reviewSessionStart = null;
  }
  alphaGridActive = false; alphaGridCurrent = null; alphaGridPool = []; alphaGridGrid = [];
  alphaGridIntroduced = []; alphaGridRemaining = []; alphaReviewSelected = null;
  renderAlphabet(document.getElementById('content'));
}
function renderAlphaGridActive(el, autoplay){
  if(!alphaGridCurrent){
    el.innerHTML = `<div class="empty">Nothing left to review. <button class="ghost" onclick="endAlphaGridReview()">Back to setup</button></div>`;
    return;
  }
  const gridChars = alphaGridGrid.map(id=>alphaGridPool.find(a=>a.id===id)).filter(Boolean);
  const isIntro = alphaGridMode==='rrd' && alphaGridPhase==='intro';
  el.innerHTML = `
    <div class="empty" style="margin-bottom:10px;">Reviewed ${alphaGridStats.seen} · knew ${alphaGridStats.known} this session · <span id="reviewSessionTimerDisp">00:00</span> elapsed${alphaGridMode==='rrd'?` · ${alphaGridIntroduced.length}/${alphaGridPool.length} introduced`:''}</div>
    ${isIntro ? `<div style="text-align:center;"><span class="tag ochre" style="font-size:1rem;padding:6px 18px;">New</span></div>` : ''}
    <div id="alphaGridPlayer" class="meta" style="text-align:center;margin:8px 0 10px;">Loading audio…</div>
    ${alphaGridWrongAttempt ? `<div style="text-align:center;color:var(--red);font-weight:600;margin-bottom:8px;">Not quite — try again.</div>` : ''}
    ${alphaGridFeedback==='correct' ? `<div style="text-align:center;color:var(--teal);font-weight:600;margin-bottom:8px;">Correct! 🎉</div>` : ''}
    <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:10px;max-width:520px;margin:0 auto 20px;">
      ${gridChars.map(a=>`<div ${isIntro?'':`onclick="handleAlphaGridPick('${a.id}')"`} style="cursor:${isIntro?'default':'pointer'};aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:1.6rem;font-family:'Lora',serif;border-radius:6px;border:2px solid ${isIntro && a.id===alphaGridCurrent.id?'var(--teal)':'var(--paper-line)'};background:#fff;">${escapeHtml(a.char)}</div>`).join('')}
    </div>
    <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">
      ${alphaGridMode==='rrd' ? `
        <button class="primary" onclick="alphaGridIntroduceNext()" ${alphaGridRemaining.length===0?'disabled':''}>Introduce Next</button>
        <button class="ghost" onclick="alphaGridStartQuiz()" ${alphaGridIntroduced.length===0?'disabled':''}>Quiz</button>
      ` : ''}
      <button class="ghost danger" onclick="endAlphaGridReview()">End review</button>
    </div>
  `;
  if(autoplay!==false) loadPlayerInto('alphaGridPlayer', 'word', alphaGridCurrent.id, true);
}

           <button class="primary" style="margin-top:14px;" onclick="nextReadingWord()">Next</button>`}
    </div>
    <button class="ghost" style="margin-top:14px;" onclick="endReadingTest()">End reading test</button>
  `;
  if(readingTestRevealed) loadPlayerInto('readingTestPlayer', 'word', w.id, true);

function resolveWordAudioKey(id){
  const w = state.words.find(w=>w.id===id);
  if(!w) return 'wordaudio:'+id;
  const variants = [];
  if(w.hasAudio) variants.push('wordaudio:'+id);
  if(w.hasArticleAudio) variants.push('wordaudio:'+id+':article');
  if(w.hasSentenceAudio) variants.push('wordaudio:'+id+':sentence');
  if(variants.length===0) return 'wordaudio:'+id;
  return variants[Math.floor(Math.random()*variants.length)];
}
async function loadPlayerInto(elId, kind, id, autoplay){
  const el = document.getElementById(elId);
  if(!el) return;
  try{
    const key = kind==='general' ? 'audio:'+id : (kind==='word' ? resolveWordAudioKey(id) : 'wordaudio:'+id);
    const res = await window.storage.get(key, false);
    if(res && res.value) el.innerHTML = `<audio controls ${autoplay?'autoplay':''} src="${JSON.parse(res.value).dataUrl}"></audio>`;
    else el.innerHTML = '<span class="empty">Clip not found.</span>';
  }catch(e){ el.innerHTML = '<span class="empty">Could not load.</span>'; }
}

      <span>Allow picking reference pictures for activities. Turn this off once you've set up the pictures you want — the language learner will then just see what's already attached (view, use for a recording, or download), with no browsing or picker to distract them.</span>
    </label>
    <h3 style="margin-top:26px;">Backup</h3>
    <div class="empty" style="margin-bottom:8px;">Export everything (lessons, words, sessions — not audio, which is too large for a text file) as a backup you control.</div>
    <button class="ghost" onclick="exportData()">Export data as JSON</button>
    <h3 style="margin-top:26px;">Recording format</h3>
    <div class="empty" style="margin-bottom:8px;">New recordings now save as MP3, which plays reliably on every device, including iPhone/iPad. Older recordings made before this change may still be in a format that doesn't play everywhere — convert them once to fix that.</div>
    <button class="ghost" onclick="convertAllRecordingsToMp3()">Convert all existing recordings to MP3</button>
    <div id="mp3ConvertStatus" class="meta" style="margin-top:6px;"></div>
    <h3 style="margin-top:26px;">Repair older reference pictures</h3>
    <div class="empty" style="margin-bottom:8px;">Pictures attached to activities before the current picker existed are invisible to Solo Practice, even though they still show up correctly everywhere else. This converts every old-format attachment into the current format, in one pass, across every activity — nothing is removed, and this is safe to run more than once.</div>
    <button class="ghost" onclick="repairOldAttachments()">Repair old reference pictures</button>
    <div id="repairStatus" class="meta" style="margin-top:6px;"></div>
    <h3 style="margin-top:26px;">Reset logged time</h3>
    <div class="empty" style="margin-bottom:8px;">Useful while you're still testing and setting things up before actually starting — this clears hours, revision time, checked-off steps, and meeting completion status, but never touches your pictures, recordings, or words.</div>
    <div style="padding:10px;background:#fff;border:1px solid var(--paper-line);border-radius:3px;margin-bottom:10px;">
      <div class="tm" style="margin-bottom:4px;">Everything, across all 40 meeting plans</div>
      <button class="ghost danger" onclick="resetAllLoggedTime()">Reset all logged time</button>
    </div>
    <div style="padding:10px;background:#fff;border:1px solid var(--paper-line);border-radius:3px;">
      <div class="tm" style="margin-bottom:4px;">Just one meeting plan — handy if you're actively doing some meeting plans for real while still testing others</div>
      <label>Meeting plan: <select id="resetMPNumber">
        ${MEETING_PLANS.map(mp=>`<option value="${mp.n}">Meeting Plan ${mp.n}: ${escapeHtml(mp.title)}</option>`).join('')}
      </select></label>
      <button class="ghost danger" onclick="resetMeetingPlanTime()">Reset this meeting plan's logged time</button>
      <div id="resetMPStatus" class="meta" style="margin-top:6px;"></div>
    </div>
    <h3 style="margin-top:26px;">Dropbox backup (includes audio)</h3>
    ${dropboxTokens ? `
      <div class="empty" style="margin-bottom:8px;">Connected to Dropbox. Backup includes everything — words, meeting progress, photos, and every recording.</div>
      <button class="ghost" onclick="backupToDropbox()">Back up to Dropbox now</button>
      <button class="ghost" onclick="restoreFromDropbox()">Restore from Dropbox</button>
      <button class="ghost danger" onclick="disconnectDropbox()">Disconnect Dropbox</button>
    ` : `
      <div class="empty" style="margin-bottom:8px;">Connect once, then back up or restore manually from any device — nothing syncs automatically, so you're always in control of when data moves.</div>
      <button class="primary" onclick="connectDropbox()">Connect Dropbox</button>
    `}
    <div id="dropboxStatus" class="meta" style="margin-top:8px;"></div>
  `;
}
function toggleAllowMaterialsEditing(val){
  state.allowMaterialsEditing = val;
  saveData();
}
function saveProfile(){
  const hoursPerWeek = document.getElementById('pHours').value;
  state.profile = {
    name: document.getElementById('pName').value.trim(),
    language: document.getElementById('pLang').value.trim(),
    why: document.getElementById('pWhy').value.trim(),
    remember: document.getElementById('pRemember').value.trim(),
    location: document.getElementById('pLocation').value.trim(),
    profession: document.getElementById('pProfession').value.trim(),
    interests: document.getElementById('pInterests').value.trim(),
    hoursPerWeek: hoursPerWeek,
  };
  if(!state.originalFinishDate && Number(hoursPerWeek)>0){
    const weeksNeeded = 100/Number(hoursPerWeek);
    const finishDate = new Date(Date.now() + weeksNeeded*7*86400000);
    state.originalFinishDate = finishDate.toISOString().slice(0,10);
  }
  saveData(); renderProfile(document.getElementById('content'));
}
function exportData(){
  const blob = new Blob([JSON.stringify(state,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'gpa-companion-backup.json';
  a.click();
  URL.revokeObjectURL(url);
}

// ---------- Dropbox backup/restore (PKCE, no server needed) ----------
const DROPBOX_APP_KEY = 'n0w3cr4mhbh9jtj';
let dropboxTokens = null;
function base64UrlEncode(buffer){
  let str = '';
  const bytes = new Uint8Array(buffer);
  for(let i=0;i<bytes.length;i++) str += String.fromCharCode(bytes[i]);
  return btoa(str).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function generateCodeVerifier(){
  const array = new Uint8Array(32);
  crypto.getRandomValues(array);
  return base64UrlEncode(array.buffer);
}
async function generateCodeChallenge(verifier){
  const digest = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier));
  return base64UrlEncode(digest);
}
function dropboxRedirectUri(){
  return window.location.href.split('?')[0].split('#')[0];
}
async function loadDropboxTokens(){
  try{
    const res = await window.storage.get('dropbox-tokens', false);
    if(res && res.value) dropboxTokens = JSON.parse(res.value);
  }catch(e){ dropboxTokens = null; }
}
async function connectDropbox(){
  const verifier = generateCodeVerifier();
  await window.storage.set('dropbox-pkce-verifier', verifier, false);
  const challenge = await generateCodeChallenge(verifier);
  const params = new URLSearchParams({
    client_id: DROPBOX_APP_KEY,
    response_type: 'code',
    code_challenge: challenge,
    code_challenge_method: 'S256',
    redirect_uri: dropboxRedirectUri(),
    token_access_type: 'offline'
  });
  window.location.href = 'https://www.dropbox.com/oauth2/authorize?' + params.toString();
}
async function handleDropboxRedirect(){
  const params = new URLSearchParams(window.location.search);
  const code = params.get('code');
  if(!code) return;
  try{
    const verifierRes = await window.storage.get('dropbox-pkce-verifier', false);
    const verifier = verifierRes && verifierRes.value;
    const body = new URLSearchParams({
      code, grant_type:'authorization_code', client_id: DROPBOX_APP_KEY,
      redirect_uri: dropboxRedirectUri(), code_verifier: verifier
    });
    const res = await fetch('https://api.dropboxapi.com/oauth2/token', {
      method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body: body.toString()
    });
    const data = await res.json();
    if(data.access_token){
      dropboxTokens = {access_token:data.access_token, refresh_token:data.refresh_token, expires_at: Date.now()+(data.expires_in*1000)};
      await window.storage.set('dropbox-tokens', JSON.stringify(dropboxTokens), false);
    }
  }catch(e){ console.error('Dropbox auth failed', e); }
  window.history.replaceState({}, '', window.location.pathname);
}
async function disconnectDropbox(){
  dropboxTokens = null;
  await window.storage.delete('dropbox-tokens', false);
  renderProfile(document.getElementById('content'));
}
async function ensureDropboxToken(){
  if(!dropboxTokens) return null;
  if(Date.now() < dropboxTokens.expires_at - 60000) return dropboxTokens.access_token;
  try{
    const body = new URLSearchParams({grant_type:'refresh_token', refresh_token:dropboxTokens.refresh_token, client_id:DROPBOX_APP_KEY});
    const res = await fetch('https://api.dropboxapi.com/oauth2/token', {
      method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body: body.toString()
    });
    const data = await res.json();
    if(data.access_token){
      dropboxTokens.access_token = data.access_token;
      dropboxTokens.expires_at = Date.now() + (data.expires_in*1000);
      await window.storage.set('dropbox-tokens', JSON.stringify(dropboxTokens), false);
      return dropboxTokens.access_token;
    }
  }catch(e){ console.error('Dropbox refresh failed', e); }
  return null;
}
async function backupToDropbox(){
  const statusEl = document.getElementById('dropboxStatus');
  if(statusEl) statusEl.textContent = 'Backing up…';
  try{
    const token = await ensureDropboxToken();
    if(!token){ if(statusEl) statusEl.textContent = 'Not connected to Dropbox.'; return; }
    const audioList = await window.storage.list('wordaudio:', false);
    const audio = {};
    for(const key of audioList.keys){
      try{ const res = await window.storage.get(key, false); if(res && res.value) audio[key] = res.value; }catch(e){}
    }
    const bundle = {state, audio, exportedAt: new Date().toISOString()};
    const blob = new Blob([JSON.stringify(bundle)], {type:'application/json'});
    const res = await fetch('https://content.dropboxapi.com/2/files/upload', {
      method:'POST',
      headers:{
        'Authorization':'Bearer '+token,
        'Dropbox-API-Arg': JSON.stringify({path:'/gpa-companion-backup.json', mode:'overwrite'}),
        'Content-Type':'application/octet-stream'
      },
      body: blob
    });
    if(res.ok){ if(statusEl) statusEl.textContent = 'Backed up to Dropbox just now (including audio).'; }
    else { const err = await res.text(); if(statusEl) statusEl.textContent = 'Backup failed: '+err.slice(0,200); }
  }catch(e){ if(statusEl) statusEl.textContent = 'Backup failed: '+e.message; }
}
async function restoreFromDropbox(){
  const statusEl = document.getElementById('dropboxStatus');
  if(statusEl) statusEl.textContent = 'Restoring…';
  try{
    const token = await ensureDropboxToken();
    if(!token){ if(statusEl) statusEl.textContent = 'Not connected to Dropbox.'; return; }
    const res = await fetch('https://content.dropboxapi.com/2/files/download', {
      method:'POST',
      headers:{'Authorization':'Bearer '+token, 'Dropbox-API-Arg': JSON.stringify({path:'/gpa-companion-backup.json'})}
    });
    if(!res.ok){ const err = await res.text(); if(statusEl) statusEl.textContent = 'Restore failed: '+err.slice(0,200); return; }
    const bundle = await res.json();
    if(bundle.state){ state = bundle.state; await saveData(); }
    if(bundle.audio){
      for(const key of Object.keys(bundle.audio)){ await window.storage.set(key, bundle.audio[key], false); }
    }
    if(statusEl) statusEl.textContent = 'Restored from Dropbox.';
    render();
  }catch(e){ if(statusEl) statusEl.textContent = 'Restore failed: '+e.message; }
}

loadData();
handleDropboxRedirect().then(loadDropboxTokens).then(()=>{ if(activeTab==='profile') renderProfile(document.getElementById('content')); });
</script>
