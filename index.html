<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GPA Companion</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;1,500&family=Work+Sans:wght@400;500;600&display=swap');

:root{
  --paper:#4A9BE8; --paper-line:#B9D8F5; --panel:#FFFFFF;
  --ink:#123B68; --ink-soft:#557493;
  --teal:#1769D5; --teal-dim:#E8F3FF;
  --ochre:#15549A; --ochre-bg:#E8F3FF;
  --red:#15549A; --radius:3px;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'Work Sans',sans-serif;-webkit-font-smoothing:antialiased;}
h1,h2,h3{font-family:'Lora',serif;font-weight:600;margin:0 0 .3em 0;}
#app{max-width:820px;margin:0 auto;padding:26px 18px 80px;}
header.top{display:flex;align-items:baseline;justify-content:space-between;border-bottom:1px solid var(--paper-line);padding-bottom:14px;margin-bottom:16px;}
header.top h1{font-size:1.4rem;color:#fff;}
header.top .sub{color:rgba(255,255,255,.85);font-size:.82rem;}
.tabs{display:flex;gap:2px;flex-wrap:wrap;}
#tabs{margin-bottom:16px;}
.tabs button{font-family:'Work Sans',sans-serif;font-size:.82rem;padding:8px 13px 7px;border:1px solid var(--paper-line);border-bottom:none;background:var(--paper);color:#fff;cursor:pointer;border-radius:var(--radius) var(--radius) 0 0;position:relative;top:1px;}
.tabs button.active{background:var(--panel);color:var(--ink);border-bottom:1px solid var(--panel);font-weight:600;}
.panel{background:var(--panel);border:1px solid var(--paper-line);border-radius:0 var(--radius) var(--radius) var(--radius);padding:20px;}
.field{margin-bottom:12px;}
.field label{display:block;font-size:.78rem;color:var(--ink-soft);margin-bottom:4px;}
.field input,.field select,.field textarea{width:100%;font-family:inherit;font-size:.9rem;padding:8px 10px;border:1px solid var(--paper-line);border-radius:var(--radius);background:#fff;color:var(--ink);}
.field textarea{min-height:56px;resize:vertical;}
.row{display:flex;gap:12px;flex-wrap:wrap;}
.row > .field{flex:1;min-width:140px;}
button.primary{background:var(--teal);color:#fff;border:none;padding:9px 16px;border-radius:var(--radius);font-size:.85rem;font-weight:600;cursor:pointer;font-family:inherit;}
button.primary:hover{opacity:.9;}
button.ghost{background:none;border:1px solid var(--paper-line);color:var(--ink-soft);padding:6px 11px;border-radius:var(--radius);font-size:.76rem;cursor:pointer;font-family:inherit;}
button.danger{color:var(--red);border-color:var(--red);}
button.record{background:var(--red);color:#fff;border:none;padding:9px 16px;border-radius:var(--radius);font-size:.85rem;font-weight:600;cursor:pointer;}
button.record.recording{background:var(--ink);}
.entry{border-top:1px solid var(--paper-line);padding:12px 0;}
.entry:first-child{border-top:none;}
.entry-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;}
.entry-top .title{font-weight:600;}
.entry-top .date{font-size:.73rem;color:var(--ink-soft);white-space:nowrap;}
.entry .meta{font-size:.77rem;color:var(--ink-soft);margin-top:2px;}
.entry .notes{font-size:.84rem;margin-top:6px;}
.entry .actions{margin-top:7px;}
.tag{display:inline-block;font-size:.7rem;padding:2px 8px;border-radius:10px;background:var(--teal-dim);color:var(--teal);margin-right:5px;}
.tag.ochre{background:var(--ochre-bg);color:var(--ochre);}
.gap-item{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;background:var(--ochre-bg);border-left:3px solid var(--ochre);border-radius:0 var(--radius) var(--radius) 0;margin-bottom:7px;font-size:.87rem;}
.gap-item .days{font-size:.73rem;color:var(--ink-soft);}
.empty{color:var(--ink-soft);font-size:.84rem;font-style:italic;padding:6px 0;}
.stat-row{display:flex;gap:16px;margin-bottom:18px;flex-wrap:wrap;}
.stat{flex:1;min-width:100px;}
.stat .num{font-family:'Lora',serif;font-size:1.6rem;font-weight:600;}
.stat .label{font-size:.72rem;color:var(--ink-soft);}
audio{width:100%;margin-top:6px;height:32px;}
.footer-note{font-size:.7rem;color:var(--ink-soft);margin-top:26px;text-align:center;}
.mp-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--paper-line);cursor:pointer;}
.mp-row:first-child{border-top:none;}
.mp-row .num{width:28px;height:28px;border-radius:50%;background:var(--teal-dim);color:var(--teal);display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:600;flex-shrink:0;}
.mp-row.done .num{background:var(--teal);color:#fff;}
.mp-row .info{flex:1;}
.mp-row .info .t{font-weight:600;font-size:.88rem;}
.mp-row .info .topics{font-size:.76rem;color:var(--ink-soft);}
.mp-detail{background:#fff;border:1px solid var(--paper-line);border-radius:var(--radius);padding:14px;margin:6px 0 14px;font-size:.85rem;}
.mp-detail h4{font-size:.85rem;margin:10px 0 4px;}
.mp-detail ol,.mp-detail ul{margin:4px 0;padding-left:20px;}
.phase-divider{font-size:.76rem;text-transform:none;color:var(--ink-soft);padding:10px 0 4px;border-top:2px solid var(--paper-line);margin-top:6px;}
.iceberg{display:flex;gap:4px;margin-top:2px;}
.iceberg button{flex:1;font-size:.7rem;padding:5px 4px;border:1px solid var(--paper-line);background:#fff;border-radius:var(--radius);cursor:pointer;color:var(--ink-soft);}
.iceberg button.on{background:var(--teal);color:#fff;border-color:var(--teal);}
.task-item{border-top:1px solid var(--paper-line);padding:10px 0;display:flex;gap:10px;}
.task-item:first-child{border-top:none;}
.task-item input[type=checkbox]{margin-top:3px;}
.task-item .tt{font-weight:600;font-size:.87rem;}
.task-item .tm{font-size:.72rem;color:var(--ink-soft);}
.task-item .tp{font-size:.82rem;margin-top:3px;}
.section-label{font-size:.76rem;color:var(--ink-soft);margin:16px 0 4px;}
.section-label:first-child{margin-top:0;}
img.thumb{max-width:100%;border-radius:var(--radius);margin-top:6px;}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div><h1>GPA Companion</h1><div class="sub">your whole Phase 1 journey, one place</div></div>
  </header>
  <nav id="tabs"></nav>
  <div class="panel" id="content"></div>
  <div class="footer-note">Data saves automatically to your account. Use Export in Profile to back it up.</div>
</div>
<div id="imageOverlay" onclick="hideEnlargedImage()" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.88);z-index:1000;align-items:center;justify-content:center;cursor:pointer;padding:20px;">
  <img id="imageOverlayImg" src="" style="max-width:100%;max-height:90vh;object-fit:contain;border-radius:4px;">
</div>

<script>
// If running outside Claude (e.g. published on GitHub Pages), window.storage won't
// exist. This fills it in with an equivalent backed by the browser's own IndexedDB,
// so the exact same file works standalone with zero code changes needed.
if (typeof window.storage === 'undefined') {
  const DB_NAME = 'gpaCompanionDB', STORE = 'kv';
  const dbPromise = new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = () => { req.result.createObjectStore(STORE); };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
  window.storage = {
    async get(key, shared){
      const db = await dbPromise;
      return new Promise((resolve,reject)=>{
        const req = db.transaction(STORE,'readonly').objectStore(STORE).get(key);
        req.onsuccess = ()=> req.result===undefined ? reject(new Error('not found')) : resolve({key, value:req.result, shared:!!shared});
        req.onerror = ()=>reject(req.error);
      });
    },
    async set(key, value, shared){
      const db = await dbPromise;
      return new Promise((resolve,reject)=>{
        const tx = db.transaction(STORE,'readwrite');
        tx.objectStore(STORE).put(value, key);
        tx.oncomplete = ()=>resolve({key, value, shared:!!shared});
        tx.onerror = ()=>reject(tx.error);
      });
    },
    async delete(key, shared){
      const db = await dbPromise;
      return new Promise((resolve,reject)=>{
        const tx = db.transaction(STORE,'readwrite');
        tx.objectStore(STORE).delete(key);
        tx.oncomplete = ()=>resolve({key, deleted:true, shared:!!shared});
        tx.onerror = ()=>reject(tx.error);
      });
    },
    async list(prefix, shared){
      const db = await dbPromise;
      return new Promise((resolve,reject)=>{
        const req = db.transaction(STORE,'readonly').objectStore(STORE).getAllKeys();
        req.onsuccess = ()=>{
          let keys = req.result;
          if(prefix) keys = keys.filter(k=>String(k).startsWith(prefix));
          resolve({keys, prefix, shared:!!shared});
        };
        req.onerror = ()=>reject(req.error);
      });
    }
  };
}
