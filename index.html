<!DOCTYPE html>
<html lang="en">

<title>GPA Companion</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;1,500&family=Work+Sans:wght@400;500;600&display=swap');

:root{
  --paper:#4A9BE8; --paper-line:#B9D8F5; --panel:#FFFFFF;
  --ink:#123B68; --ink-soft:#557493;
  --teal:#1769D5; --teal-dim:#E8F3FF;
  --ochre:#15549A; --ochre-bg:#E8F3FF;
  --red:#15549A; --radius:3px;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'Work Sans',sans-serif;-webkit-font-smoothing:antialiased;}
h1,h2,h3{font-family:'Lora',serif;font-weight:600;margin:0 0 .3em 0;}
#app{max-width:820px;margin:0 auto;padding:26px 18px 80px;}
header.top{display:flex;align-items:baseline;justify-content:space-between;border-bottom:1px solid var(--paper-line);padding-bottom:14px;margin-bottom:16px;}
header.top h1{font-size:1.4rem;color:#fff;}
header.top .sub{color:rgba(255,255,255,.85);font-size:.82rem;}
.tabs{display:flex;gap:2px;flex-wrap:wrap;}
#tabs{margin-bottom:16px;}
.tabs button{font-family:'Work Sans',sans-serif;font-size:.82rem;padding:8px 13px 7px;border:1px solid var(--paper-line);border-bottom:none;background:var(--paper);color:#fff;cursor:pointer;border-radius:var(--radius) var(--radius) 0 0;position:relative;top:1px;}
.tabs button.active{background:var(--panel);color:var(--ink);border-bottom:1px solid var(--panel);font-weight:600;}
.panel{background:var(--panel);border:1px solid var(--paper-line);border-radius:0 var(--radius) var(--radius) var(--radius);padding:20px;}
.field{margin-bottom:12px;}
.field label{display:block;font-size:.78rem;color:var(--ink-soft);margin-bottom:4px;}
.field input,.field select,.field textarea{width:100%;font-family:inherit;font-size:.9rem;padding:8px 10px;border:1px solid var(--paper-line);border-radius:var(--radius);background:#fff;color:var(--ink);}
.field textarea{min-height:56px;resize:vertical;}
.row{display:flex;gap:12px;flex-wrap:wrap;}
.row > .field{flex:1;min-width:140px;}
button.primary{background:var(--teal);color:#fff;border:none;padding:9px 16px;border-radius:var(--radius);font-size:.85rem;font-weight:600;cursor:pointer;font-family:inherit;}
button.primary:hover{opacity:.9;}
button.ghost{background:none;border:1px solid var(--paper-line);color:var(--ink-soft);padding:6px 11px;border-radius:var(--radius);font-size:.76rem;cursor:pointer;font-family:inherit;}
button.danger{color:var(--red);border-color:var(--red);}
button.record{background:var(--red);color:#fff;border:none;padding:9px 16px;border-radius:var(--radius);font-size:.85rem;font-weight:600;cursor:pointer;}
button.record.recording{background:var(--ink);}
.entry{border-top:1px solid var(--paper-line);padding:12px 0;}
.entry:first-child{border-top:none;}
.entry-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;}
.entry-top .title{font-weight:600;}
.entry-top .date{font-size:.73rem;color:var(--ink-soft);white-space:nowrap;}
.entry .meta{font-size:.77rem;color:var(--ink-soft);margin-top:2px;}
.entry .notes{font-size:.84rem;margin-top:6px;}
.entry .actions{margin-top:7px;}
.tag{display:inline-block;font-size:.7rem;padding:2px 8px;border-radius:10px;background:var(--teal-dim);color:var(--teal);margin-right:5px;}
.tag.ochre{background:var(--ochre-bg);color:var(--ochre);}
.gap-item{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;background:var(--ochre-bg);border-left:3px solid var(--ochre);border-radius:0 var(--radius) var(--radius) 0;margin-bottom:7px;font-size:.87rem;}
.gap-item .days{font-size:.73rem;color:var(--ink-soft);}
.empty{color:var(--ink-soft);font-size:.84rem;font-style:italic;padding:6px 0;}
.stat-row{display:flex;gap:16px;margin-bottom:18px;flex-wrap:wrap;}
.stat{flex:1;min-width:100px;}
.stat .num{font-family:'Lora',serif;font-size:1.6rem;font-weight:600;}
.stat .label{font-size:.72rem;color:var(--ink-soft);}
audio{width:100%;margin-top:6px;height:32px;}
.footer-note{font-size:.7rem;color:var(--ink-soft);margin-top:26px;text-align:center;}
.mp-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--paper-line);cursor:pointer;}
.mp-row:first-child{border-top:none;}
.mp-row .num{width:28px;height:28px;border-radius:50%;background:var(--teal-dim);color:var(--teal);display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:600;flex-shrink:0;}
.mp-row.done .num{background:var(--teal);color:#fff;}
.mp-row .info{flex:1;}
.mp-row .info .t{font-weight:600;font-size:.88rem;}
.mp-row .info .topics{font-size:.76rem;color:var(--ink-soft);}
.mp-detail{background:#fff;border:1px solid var(--paper-line);border-radius:var(--radius);padding:14px;margin:6px 0 14px;font-size:.85rem;}
.mp-detail h4{font-size:.85rem;margin:10px 0 4px;}
.mp-detail ol,.mp-detail ul{margin:4px 0;padding-left:20px;}
.phase-divider{font-size:.76rem;text-transform:none;color:var(--ink-soft);padding:10px 0 4px;border-top:2px solid var(--paper-line);margin-top:6px;}
.iceberg{display:flex;gap:4px;margin-top:2px;}
.iceberg button{flex:1;font-size:.7rem;padding:5px 4px;border:1px solid var(--paper-line);background:#fff;border-radius:var(--radius);cursor:pointer;color:var(--ink-soft);}
.iceberg button.on{background:var(--teal);color:#fff;border-color:var(--teal);}
.task-item{border-top:1px solid var(--paper-line);padding:10px 0;display:flex;gap:10px;}
.task-item:first-child{border-top:none;}
.task-item input[type=checkbox]{margin-top:3px;}
.task-item .tt{font-weight:600;font-size:.87rem;}
.task-item .tm{font-size:.72rem;color:var(--ink-soft);}
.task-item .tp{font-size:.82rem;margin-top:3px;}
.section-label{font-size:.76rem;color:var(--ink-soft);margin:16px 0 4px;}
.section-label:first-child{margin-top:0;}
img.thumb{max-width:100%;border-radius:var(--radius);margin-top:6px;}
</style>

<script>
// If running outside Claude (e.g. published on GitHub Pages), window.storage won't
// exist. This fills it in with an equivalent backed by the browser's own IndexedDB,
// so the exact same file works standalone with zero code changes needed.
if (typeof window.storage === 'undefined') {
  const DB_NAME = 'gpaCompanionDB', STORE = 'kv';
  const dbPromise = new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = () => { req.result.createObjectStore(STORE); };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
  window.storage = {
    async get(key, shared){
      const db = await dbPromise;
      return new Promise((resolve,reject)=>{
        const req = db.transaction(STORE,'readonly').objectStore(STORE).get(key);
        req.onsuccess = ()=> req.result===undefined ? reject(new Error('not found')) : resolve({key, value:req.result, shared:!!shared});
        req.onerror = ()=>reject(req.error);
      });
    },
    async set(key, value, shared){
      const db = await dbPromise;
      return new Promise((resolve,reject)=>{
        const tx = db.transaction(STORE,'readwrite');
        tx.objectStore(STORE).put(value, key);
        tx.oncomplete = ()=>resolve({key, value, shared:!!shared});
        tx.onerror = ()=>reject(tx.error);
      });
    },
    async delete(key, shared){
      const db = await dbPromise;
      return new Promise((resolve,reject)=>{
        const tx = db.transaction(STORE,'readwrite');
        tx.objectStore(STORE).delete(key);
        tx.oncomplete = ()=>resolve({key, deleted:true, shared:!!shared});
        tx.onerror = ()=>reject(tx.error);
      });
    },
    async list(prefix, shared){
      const db = await dbPromise;
      return new Promise((resolve,reject)=>{
        const req = db.transaction(STORE,'readonly').objectStore(STORE).getAllKeys();
        req.onsuccess = ()=>{
          let keys = req.result;
          if(prefix) keys = keys.filter(k=>String(k).startsWith(prefix));
          resolve({keys, prefix, shared:!!shared});
        };
        req.onerror = ()=>reject(req.error);
      });
    }
  };
}

const MEETING_DETAILS = {
  1: {
    purpose:"Build the very first connection with your nurturer through five games, all pure listening at first: people-words (Game 1A), animal words (Game 1B), physical action commands (Game 2), the same actions applied to photos of you and your nurturer (Game 3), and common greeting/thank-you phrases using bubble pictures (Game 4).",
    technique:"Every game uses the \"Rough-and-Ready Dozen\" technique: the nurturer names or demonstrates something once, then immediately quizzes you on it, mixing in everything learned so far, at random. You never repeat words back — you just point or physically do the action. Two ground rules sit above everything else here: stay connected to your nurturer as a real person, not a machine dispensing vocabulary, and have fun — laughing is a good sign, not a distraction. There are three possible roles in the room: the nurturer (your host companion), the growing participators (2-6 of you), and optionally a coach — another growing participator, beginner or advanced, whose presence helps train a new nurturer.",
    materials:"Doll or toy figures for man, woman, boy, girl, baby, old man, old woman (or real people in the room); toy animals or animal pictures; a large space to move around in for physical actions; a camera to photograph the nurturer and each GP walking and running (or stick-figure drawings if photos aren't possible); puppets, dolls, or stuffed animals for Game 4; story-strip pictures with empty cartoon speech bubbles (Lexicarry-style, in your graphics packet). The Graphics Packet's Rough-and-Ready Dozen pictures for reference and its Talking Picture Dictionary page for recording new words.",
    steps:[
      {name:"Introduce man, woman, and yourself", game:"1A: Introducing people", needsRecording:false, description:"Your nurturer lays out two dolls (or uses two real people in the room) — a man and a woman — and says the equivalent of \"This is a man. This is a woman\" just once each. From this point on, only the nurturer speaks the target language, and GPs only listen and point — no talking at all. She immediately starts asking, over and over in random order, \"Where is the woman? Where is the man?\" and you respond purely by pointing. She then introduces \"I\" by pointing to herself, folding it into the same random questioning — \"Where am I? Where is the man? Where is the woman?\""},
      {name:"Keep adding new words, one at a time", game:"1A: Introducing people", needsRecording:false, description:"From here, one rule governs everything: every time a new word is added — boy, you, they, child, person, girl, baby, old man, old woman, and so on — the nurturer says it in a sentence exactly once, then goes straight back to quiz-style \"Where is...?\" questioning, folding it in with everything already learned. She never repeats a new word by itself over and over (never \"man, man, man\"); the repetition you need comes from being asked about it in different random combinations, not from hearing it chanted. Only move on to a new word once the group can reliably point to everything already introduced. Don't forget \"people\" and \"person\" and \"child\" alongside man/woman/boy/girl, and don't forget \"we\" and \"he\" alongside I/you/they — by the end, the nurturer should be mixing all the doll-words (boy, girl, man, baby, old man, old woman, person, people, child) with all the \"us\" words (I, we, you, he, they) randomly together, something like: \"Where is the girl? Where is a person? Where is the woman? Where are they? Where am I? Where are we? Where is the old man? Where are the people?\" — on and on, repeated a few times each in no particular order. If someone points wrong along the way, the nurturer corrects it only in the target language, naturally and kindly — for example, gently saying something like \"no, that's not the man, that's the woman — where is the man?\" and continuing, never switching to English or explaining grammar. You'll pick up the gist of the correction even without understanding every word of it, and that's fine. Keep going until you've built up the full set for this round."},
      {name:"Wrap up Game 1A: record and log", game:"1A: Introducing people", needsRecording:true, description:"Now record and log every new word from this round. In the original method this meant manually numbering pictures and keeping a running paper dictionary — this app does that part for you automatically, so just use the recording area below: add each new word, record yourself (or the nurturer) saying it, and it's logged and organized for you, ready to review later."},
      {name:"Introduce two animals", game:"1B: Introducing animals", needsRecording:false, description:"Same technique as Game 1A, just with animals instead of people. Nurturer brings out two toy animals or pictures, names each once (\"This is a cat. This is a dog\"), then immediately starts the random \"Where is...?\" questioning."},
      {name:"Keep adding animals, one at a time", game:"1B: Introducing animals", needsRecording:false, description:"Continue adding one new animal at a time — goat, bird, fish, frog, fly, spider, cow, mouse, horse, and so on (local, familiar animals are perfectly fine) — always folding each new addition into the same random questioning covering everything already learned in this game, the same one-at-a-time rule as before. Once several animals are known, introduce a general category word for \"animals\" itself, and contrast it against the general word for \"people\" from Game 1A."},
      {name:"Wrap up Game 1B: record and log", game:"1B: Introducing animals", needsRecording:true, description:"Same as Game 1A's wrap-up — record and log every new animal word from this round using the recording area below. No manual numbering needed; the app keeps track."},
      {name:"Play Game 2: Us in Action", game:"2: Us in Action", needsRecording:false, description:"This game moves from pointing to physically acting out commands. Nurturer begins with two actions — say, \"stand\" and \"sit\" — demonstrating each herself the first time she says it, with everyone standing/sitting along with her. Once both are introduced, she gives the instructions to the whole group in random order (\"stand, sit, sit, stand, sit...\") without demonstrating again, and everyone responds by actually doing the action. After a few rounds together, she starts addressing one GP at a time — saying the instruction first, pausing, then naming the person, so everyone has to process the instruction before knowing who it's for. She then adds a third action (like \"walk\") the same one-at-a-time way, mixing all three into the random individual and group instructions. GPs should act out actions fully and physically — actually walk around the room, actually lie down — not just gesture at it."},

      {name:"Prepare Game 3: Photos of Us in Action", game:"3: Photos of Us in Action", needsRecording:false, description:"This game needs some prep first, and the source material suggests spreading it over a few days given how many photos are involved. Take (or have the coach take) photos of the nurturer and of each GP separately: one walking, one running. If the nurturer prefers not to be photographed, simple stick-figure drawings of her doing each action work fine instead. Print these out — draft quality on plain paper is fine, several photos per page cut apart with scissors."},
      {name:"Play Game 3: Photos of Us in Action", game:"3: Photos of Us in Action", needsRecording:false, description:"Start with just the two \"walking\" photos: \"In which photo am I walking? In which photo are you walking?\" — repeated randomly, giving different GPs a turn to respond. When you're ready to add the \"running\" photos, you can add both at once since there are no genuinely new words, just new forms of the same ones: \"In which picture are you running? In which am I walking?\" and so on. With walking and running photos of multiple people now in play, pointing correctly means understanding both the action word AND the person word (I/you) together, not just one or the other. If any one GP starts struggling, it's fine to narrow back down to just two photos for that person specifically, then rebuild up again once they're confident — this doesn't need to slow down the rest of the group."},
      {name:"Wrap up Game 3: record and log", game:"3: Photos of Us in Action", needsRecording:true, description:"Record a sample covering the walking/running photos in random order, and log anything new using the area below."},
      {name:"Play Game 4: Cartoon Bubbles", game:"4: Cartoon Bubbles", needsRecording:false, description:"This game teaches common social phrases — hello, goodbye, thank you, you're welcome — using puppets or dolls first, then bubble pictures. Start by acting out a greeting and a farewell between two puppets or dolls, so GPs see what's being depicted before any pictures are involved. Then bring in two pictures with empty speech bubbles (from your graphics packet, or the Lexicarry book this idea comes from) depicting people greeting and parting, and ask Rough-and-Ready Dozen style: \"Who is saying hello? Who is saying goodbye?\" repeated randomly. Once that's solid, add a third: someone giving a gift and the other expressing thanks, then a fourth image for acknowledging thanks (\"you're welcome\") — folding each new phrase into the same random questioning as it's added, exactly like every other game so far. Vary the age and gender of the people depicted across pictures, since the same phrase can look different depending on who's speaking. It's fine to pick a fresh small set of expressions each day (five or six is plenty to start) — you're learning to recognize them as whole chunks, not analyzing every word inside them."},

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
const BUSY_PICTURE_DEFAULT_CATEGORIES = ["Bajaj scenes","City","Emotions","Football","Home","Market","Religion","Street","Tea shop","Verbs","Video & Photo"];
function busyCategories(){
  return [...new Set([...BUSY_PICTURE_DEFAULT_CATEGORIES, ...state.busyPictures.map(p=>p.category).filter(Boolean)])].sort();
}
function drawGenderLabel(canvas, gender){
  if(!gender) return;
  const ctx = canvas.getContext('2d');
  const text = gender==='M' ? 'Male' : 'Female';
  const barH = Math.max(20, canvas.height*0.13);
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(0, canvas.height-barH, canvas.width, barH);
  ctx.fillStyle = '#fff';
  ctx.font = `bold ${Math.round(barH*0.6)}px sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, canvas.width/2, canvas.height-barH/2);
}
function applyGenderLabelToPhoto(src, gender){
  return new Promise((resolve)=>{
    if(!gender || !src){ resolve(src); return; }
    const img = new Image();
    img.onerror = ()=> resolve(src);
    img.onload = ()=>{
      const canvas = document.createElement('canvas');
      canvas.width = img.width; canvas.height = img.height;
      canvas.getContext('2d').drawImage(img,0,0);
      drawGenderLabel(canvas, gender);
      resolve(canvas.toDataURL('image/jpeg', 0.85));
    };
    img.src = src;
  });
}
let wordFormGender = {};
function genderButtonsHTML(prefix){
  return `<div style="display:flex;gap:6px;">
    <button type="button" class="ghost" style="${!wordFormGender[prefix]?'font-weight:600;':''}" onclick="setWordFormGender('${prefix}', null)">None</button>
    <button type="button" class="ghost" style="${wordFormGender[prefix]==='M'?'font-weight:600;':''}" onclick="setWordFormGender('${prefix}', 'M')">Male</button>
    <button type="button" class="ghost" style="${wordFormGender[prefix]==='F'?'font-weight:600;':''}" onclick="setWordFormGender('${prefix}', 'F')">Female</button>
  </div>`;
}
function setWordFormGender(prefix, g){
  wordFormGender[prefix] = g;
  const el = document.getElementById(prefix+'GenderButtons');
  if(el) el.innerHTML = genderButtonsHTML(prefix);
}

async function loadData(){
  try{
    const res = await window.storage.get(STORE_KEY, false);
    if(res && res.value){
      state = JSON.parse(res.value);
    }
  }catch(e){}
  state.profile = state.profile || {};
  state.sessions = state.sessions || [];
  state.words = state.words || [];
  state.orientationDone = state.orientationDone || {};
  state.audioIndex = state.audioIndex || [];
  state.meetingComplete = state.meetingComplete || {};
  state.stepProgress = state.stepProgress || {};
  state.stepDurations = state.stepDurations || {};
  state.activityMaterials = state.activityMaterials || {};
  state.photoLibrary = state.photoLibrary || [];
  state.busyPictures = state.busyPictures || [];
  state.alphabet = state.alphabet || [];
  state.materialsDismissed = state.materialsDismissed || {};
  state.revisionMinutes = state.revisionMinutes || 0;
  state.words.forEach(w=>{
    if(w.iceberg==null){
      if(w.level===2) w.iceberg = 1;
      else if(w.level===1) w.iceberg = 5;
      else w.iceberg = 9;
    }
  });
  state.activityNurturerAudio = state.activityNurturerAudio || {};
  loaded = true;
  render();
}
async function saveData(){
  try{ await window.storage.set(STORE_KEY, JSON.stringify(state), false); }
  catch(e){ console.error('Storage error', e); }
}

function totalHours(){ return state.sessions.reduce((a,s)=>a+(Number(s.duration)||0),0)/60; }
function currentPhaseInfo(){
  const h = totalHours();
  let phase = 1;
  for(let i=1;i<CUM_HOURS.length;i++){ if(h >= CUM_HOURS[i]) phase = i+1; }
  if(phase>6) phase=6;
  const info = PHASE_TARGETS[phase-1];
  const startH = CUM_HOURS[phase-1];
  const endH = phase<6 ? CUM_HOURS[phase] : null;
  return {phase, info, startH, endH, hoursIntoPhase: h-startH};
}
function render(){
  const tabsEl = document.getElementById('tabs');
  tabsEl.innerHTML = `<div class="tabs">${TABS_ROW1.map(t=>`<button class="${t.id===activeTab?'active':''}" onclick="setTab('${t.id}')">${t.label}</button>`).join('')}</div><div class="tabs" style="margin-top:2px;">${TABS_ROW2.map(t=>`<button class="${t.id===activeTab?'active':''}" onclick="setTab('${t.id}')">${t.label}</button>`).join('')}</div>`;
  const c = document.getElementById('content');
  if(!loaded){ c.innerHTML='<div class="empty">Loading…</div>'; return; }
  if(activeTab==='dashboard') renderDashboard(c);
  else if(activeTab==='orientation') renderOrientation(c);
  else if(activeTab==='meetings') { if(liveActivity) renderLiveActivity(c); else renderMeetings(c); }
  else if(activeTab==='words') renderWords(c);
  else if(activeTab==='review') renderReview(c);
  else if(activeTab==='suggestions') renderSuggestions(c);
  else if(activeTab==='alphabet') renderAlphabet(c);
  else if(activeTab==='assign') renderAssign(c);
  else if(activeTab==='library') renderLibrary(c);
  else if(activeTab==='profile') renderProfile(c);
}
function setTab(id){ activeTab=id; render(); }
function escapeHtml(s){ const d=document.createElement('div'); d.textContent=s||''; return d.innerHTML; }
function entryTypeTag(w){
  const t = w.entryType || 'word';
  if(t==='word') return '';
  const labels = {phrase:'phrase', description:'description', story:'story'};
  return `<span class="tag">${labels[t]||t}</span>`;
}
function entryTypeBreakdown(){
  const counts = {word:0, phrase:0, description:0, story:0};
  state.words.forEach(w=>{ const t = w.entryType || 'word'; if(counts[t]!==undefined) counts[t]++; });
  return `Words: ${counts.word} · Phrases: ${counts.phrase} · Descriptions: ${counts.description} · Stories: ${counts.story}`;
}

// ---------- Dashboard ----------
function renderDashboard(c){
  const h = totalHours();
  const {phase, info, startH, endH, hoursIntoPhase} = currentPhaseInfo();
  const meetingsTouched = Object.values(state.meetingComplete).filter(s=>s==='done').length;

  // Actual pace from logged session history (self-adjusting as you log more)
  const sessDates = state.sessions.map(s=>s.date).filter(Boolean).sort();
  let actualPace = null;
  if(sessDates.length>=2){
    const first = new Date(sessDates[0]), last = new Date();
    const weeksElapsed = Math.max((last-first)/(7*86400000), 1/7);
    actualPace = h/weeksElapsed;
  }
  const statedPace = Number(state.profile.hoursPerWeek)||0;
  const pace = actualPace || statedPace;

  let forecastLine = 'Log a couple of sessions (or add your weekly hours in Profile) to see a forecast.';
  if(endH && pace>0){
    const remaining = Math.max(endH-h,0);
    if(remaining<=0){
      forecastLine = `Phase ${phase}'s ${endH-startH}-hour target is reached!`;
    } else {
      const weeksNeeded = remaining/pace;
      const finishDate = new Date(Date.now() + weeksNeeded*7*86400000);
      const dateStr = finishDate.toLocaleDateString(undefined, {year:'numeric', month:'long', day:'numeric'});
      const paceSource = actualPace ? `your actual pace so far (~${actualPace.toFixed(1)} hrs/week)` : `the ${statedPace} hrs/week you set in Profile`;
      forecastLine = `At ${paceSource}, you're on track to finish Phase ${phase} around <strong>${dateStr}</strong>.`;
    }
  } else if(!endH){
    forecastLine = 'Phase 6 has no fixed hour target — this is the open-ended final stretch.';
  }

  const p = state.profile;
  let title;
  if(p.name && p.language) title = `${escapeHtml(p.name)}'s ${escapeHtml(p.language)} learning companion`;
  else if(p.language) title = `Your ${escapeHtml(p.language)} learning companion`;
  else if(p.name) title = `${escapeHtml(p.name)}'s learning companion`;
  else title = 'Your learning companion';

  c.innerHTML = `
    <div style="margin-bottom:18px;">
      <h2 style="font-size:1.25rem;margin-bottom:8px;">${title}</h2>
      ${p.why ? `<div style="margin-bottom:4px;"><strong>Why?</strong> ${escapeHtml(p.why)}</div>` : ''}
      ${p.remember ? `<div><strong>Remember:</strong> <em>${escapeHtml(p.remember)}</em></div>` : ''}
      ${(!p.why && !p.remember) ? `<div class="empty">Add "why" and "what to remember" in Profile to see them here.</div>` : ''}
    </div>
    <div class="stat-row">
      <div class="stat"><div class="num">${meetingsTouched}/40</div><div class="label">meeting plans completed</div></div>
      <div class="stat"><div class="num">${state.words.length}</div><div class="label">recordings logged</div></div>
      <div class="stat"><div class="num">${state.words.filter(w=>w.iceberg===1).length}</div><div class="label">top of your iceberg</div></div>
      <div class="stat"><div class="num">${((state.revisionMinutes||0)/60).toFixed(1)}/${(MEETING_PLANS.length*1.5).toFixed(0)}</div><div class="label">revision hours</div></div>
    </div>
    <div class="empty" style="margin-bottom:16px;">${entryTypeBreakdown()}</div>
    <h3>Phase ${phase}</h3>
    <div class="meta" style="margin-bottom:4px;"><strong>Understanding:</strong> ${info.understand}</div>
    <div class="meta" style="margin-bottom:10px;"><strong>Talking:</strong> ${info.talk}</div>
    <div class="empty" style="margin-bottom:16px;">${forecastLine}</div>
    <div class="empty" style="margin-bottom:16px;">Revision hours (~1.5 hrs planned per meeting plan across all ${MEETING_PLANS.length} of Phase 1) come from the Review section at the top of Meeting Plans and time spent in the Review tab — kept separate from the hours above, since revision isn't progress through the curriculum.</div>
  `;
}

// ---------- Per-activity timer ----------
let activeTimer = {planN:null, stepIdx:null, ms:0, running:false, startedAt:null};
let revisionTimer = {ms:0, running:false, startedAt:null};
function formatTimer(ms){
  const totalSec=Math.floor(ms/1000);
  const m=Math.floor(totalSec/60), s=totalSec%60;
  return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}
function startRevisionTimer(){
  revisionTimer.running = true;
  revisionTimer.startedAt = Date.now();
  renderMeetings(document.getElementById('content'));
}
function pauseRevisionTimer(){
  if(revisionTimer.running){ revisionTimer.ms += Date.now()-revisionTimer.startedAt; revisionTimer.running=false; }
  renderMeetings(document.getElementById('content'));
}
async function stopRevisionTimer(){
  if(revisionTimer.running){ revisionTimer.ms += Date.now()-revisionTimer.startedAt; revisionTimer.running=false; }
  const minutes = revisionTimer.ms/60000;
  if(minutes>0.1){
    state.revisionMinutes = (state.revisionMinutes||0) + minutes;
    await saveData();
  }
  revisionTimer = {ms:0, running:false, startedAt:null};
  renderMeetings(document.getElementById('content'));
}
function computeStepEstimates(detail){
  const WRAP_MIN = 8;
  const TOTAL_BUDGET = 150;
  const wrapCount = detail.steps.filter(s=>s.needsRecording).length;
  const playCount = detail.steps.length - wrapCount;
  const playBudget = Math.max(TOTAL_BUDGET - wrapCount*WRAP_MIN, playCount*5);
  const playEach = playCount>0 ? Math.round(playBudget/playCount) : 0;
  return detail.steps.map(s => s.needsRecording ? WRAP_MIN : playEach);
}
function paceComment(actualMin, estMin){
  const diff = actualMin-estMin;
  if(Math.abs(diff)<=2) return `logged ${actualMin} min — right on pace`;
  if(diff>0) return `logged ${actualMin} min — ${diff} min over the estimate`;
  return `logged ${actualMin} min — ${Math.abs(diff)} min under the estimate`;
}
function tickActiveTimer(){
  if(activeTimer.running){
    const key = activeTimer.planN+'-'+activeTimer.stepIdx;
    const el = document.getElementById('stepTimerDisp-'+key);
    if(el){
      const elapsedMs = activeTimer.ms + (Date.now()-activeTimer.startedAt);
      el.textContent = formatTimer(elapsedMs);
      const paceEl = document.getElementById('stepTimerPace-'+key);
      if(paceEl && paceEl.dataset.est){
        const est = Number(paceEl.dataset.est);
        const diff = (elapsedMs/60000)-est;
        if(Math.abs(diff)<1){ paceEl.textContent='on pace so far'; paceEl.style.color='var(--ink-soft)'; }
        else if(diff>0){ paceEl.textContent=`${diff.toFixed(1)} min over so far`; paceEl.style.color='var(--red)'; }
        else { paceEl.textContent=`${Math.abs(diff).toFixed(1)} min under so far`; paceEl.style.color='var(--teal)'; }
      }
    }
  }
  if(revisionTimer.running){
    const el = document.getElementById('revisionTimerDisp');
    if(el){
      const elapsedMs = revisionTimer.ms + (Date.now()-revisionTimer.startedAt);
      el.textContent = formatTimer(elapsedMs);
    }
  }
  if(reviewSessionStart){
    const el = document.getElementById('reviewSessionTimerDisp');
    if(el) el.textContent = formatTimer(Date.now()-reviewSessionStart);
  }
}
setInterval(tickActiveTimer, 1000);
function startStepTimer(planN, stepIdx){
  if(activeTimer.running && (activeTimer.planN!==planN || activeTimer.stepIdx!==stepIdx)){
    activeTimer.ms += Date.now()-activeTimer.startedAt; activeTimer.running=false;
  }
  if(activeTimer.planN!==planN || activeTimer.stepIdx!==stepIdx){ activeTimer = {planN, stepIdx, ms:0, running:false, startedAt:null}; }
  activeTimer.running = true; activeTimer.startedAt = Date.now();
  renderMeetings(document.getElementById('content'));
}
function pauseStepTimer(planN, stepIdx){
  if(activeTimer.planN===planN && activeTimer.stepIdx===stepIdx && activeTimer.running){
    activeTimer.ms += Date.now()-activeTimer.startedAt; activeTimer.running=false;
  }
  renderMeetings(document.getElementById('content'));
}
function stopStepTimer(planN, stepIdx){
  if(activeTimer.planN===planN && activeTimer.stepIdx===stepIdx){
    if(activeTimer.running){ activeTimer.ms += Date.now()-activeTimer.startedAt; activeTimer.running=false; }
    const minutes = Math.round(activeTimer.ms/60000);
    if(stepIdx==='whole'){
      const durEl=document.getElementById('mpDuration'); if(durEl) durEl.value=minutes;
    } else {
      state.stepDurations = state.stepDurations || {};
      state.stepDurations[planN] = state.stepDurations[planN] || {};
      state.stepDurations[planN][stepIdx] = minutes;
      saveData();
    }
    activeTimer = {planN:null, stepIdx:null, ms:0, running:false, startedAt:null};
  }
  renderMeetings(document.getElementById('content'));
}
function useStepTotal(planN){
  const durs = (state.stepDurations && state.stepDurations[planN]) || {};
  const total = Object.values(durs).reduce((a,b)=>a+(Number(b)||0),0);
  const durEl = document.getElementById('mpDuration');
  if(durEl) durEl.value = total;
}

let materialsPickerOpen = {};
let materialsBrowsePage = {};
const STOPWORDS = new Set(['the','and','or','of','to','in','on','at','for','with','a','an','is','are','etc','more','other','words','word','some','words,','around','into','from','words.']);
function keywordsFrom(str){
  return (str||'').toLowerCase().split(/[^a-z0-9]+/).filter(w=>w.length>=3 && !STOPWORDS.has(w));
}
function autoMatchedLibraryPhotos(key, contextText){
  const actWords = new Set(keywordsFrom(contextText));
  if(actWords.size===0) return [];
  const dismissed = (state.materialsDismissed && state.materialsDismissed[key]) || [];
  const gameKeys = gameKeysFor(key);
  const attachedIds = [];
  gameKeys.forEach(k=>{
    ((state.activityMaterials && state.activityMaterials[k]) || []).forEach(a=>{ if(a.libId) attachedIds.push(a.libId); });
  });
  return state.photoLibrary.filter(p=>{
    if(dismissed.includes(p.id) || attachedIds.includes(p.id)) return false;
    const libWords = keywordsFrom((p.category||'')+' '+(p.label||''));
    return libWords.some(w=>actWords.has(w));
  });
}
function dismissAutoMatch(key, libId){
  state.materialsDismissed = state.materialsDismissed || {};
  state.materialsDismissed[key] = state.materialsDismissed[key] || [];
  state.materialsDismissed[key].push(libId);
  saveData();
  renderMeetings(document.getElementById('content'));
}
function gameKeysFor(key){
  const parts = key.split('-');
  const mpN = Number(parts[0]);
  const mp = MEETING_PLANS.find(m=>m.n===mpN);
  if(!mp || !mp.detailed) return [key];
  const detail = MEETING_DETAILS[mpN];
  if(!detail) return [key];
  const stepIdx = Number(parts[1]);
  const step = detail.steps[stepIdx];
  if(!step) return [key];
  const keys = [];
  detail.steps.forEach((s,i)=>{ if(s.game===step.game) keys.push(mpN+'-'+i); });
  return keys.length ? keys : [key];
}

  if(!item) return;
  showEnlargedImage(resolveAttachedSrc(item));

// ---------- Live Activity Mode ----------
let liveActivity = null;
const LIVE_GRID_MAX = 15;
function weightedSampleWithoutReplacement(items, weights, k){
  const keyed = items.map((it,i)=>({it, key: Math.pow(Math.random(), 1/Math.max(weights[i], 0.0001))}));
  keyed.sort((a,b)=>b.key-a.key);
  return keyed.slice(0, k).map(x=>x.it);
}
function shuffleArray(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
function startLiveActivity(key){
  const gameKeys = gameKeysFor(key);
  const pool = [];
  gameKeys.forEach(k=>{
    ((state.activityMaterials && state.activityMaterials[k]) || []).forEach((a,idx)=>{
      const src = resolveAttachedSrc(a);
      if(src) pool.push({id: k+'|'+idx, src});
    });
  });
  if(pool.length===0) return;
  liveActivity = {
    pool,
    introduced: [],
    remaining: shuffleArray(pool.map(p=>p.id)),
    roundsSince: {},
    currentGrid: [],
    mode: null,
    startKey: key
  };
  const parts = key.split('-');
  startStepTimer(Number(parts[0]), Number(parts[1]));
  render();
}
function rebuildLiveGrid(forceIncludeId){
  const la = liveActivity;
  if(!la) return;
  la.introduced.forEach(id=>{
    if(la.currentGrid.includes(id)) la.roundsSince[id] = 0;
    else la.roundsSince[id] = (la.roundsSince[id]||0) + 1;
  });
  let gridIds = [];
  let pool = la.introduced.slice();
  if(forceIncludeId){
    gridIds.push(forceIncludeId);
    pool = pool.filter(id=>id!==forceIncludeId);
  }
  const slotsLeft = Math.min(LIVE_GRID_MAX, la.introduced.length) - gridIds.length;
  if(slotsLeft>0 && pool.length>0){
    const weights = pool.map(id=>(la.roundsSince[id]||0)+1);
    gridIds = gridIds.concat(weightedSampleWithoutReplacement(pool, weights, Math.min(slotsLeft, pool.length)));
  }
  la.currentGrid = shuffleArray(gridIds);
}
function liveIntroduceNext(){
  const la = liveActivity;
  if(!la || la.remaining.length===0) return;
  const idx = Math.floor(Math.random()*la.remaining.length);
  const nextId = la.remaining.splice(idx,1)[0];
  la.introduced.push(nextId);
  la.mode = 'new';
  rebuildLiveGrid(nextId);
  render();
}
function liveQuiz(){
  const la = liveActivity;
  if(!la || la.introduced.length===0) return;
  la.mode = 'quiz';
  rebuildLiveGrid(null);
  render();
}
function endLiveActivity(){

async function addAndMaybeRecord(prefix, shouldRecord){
  const meta = formMeta[prefix] || {};

  const displayType = document.getElementById(prefix+'DisplayType').value;
  const fileInput = document.getElementById(prefix+'Photo');
  const id = uid();
  const entry = {
    id, text, meetingPlan,
    stepIndex: (presetStepIndex!=null && presetStepIndex!==undefined) ? presetStepIndex : null,
    stepName: presetStepName || null,
    entryType: entryTypeEl ? entryTypeEl.value : 'word',
    category: categoryEl ? (categoryEl.value.trim() || null) : null,
    isPower: powerEl.value==='yes',
    iceberg:9,
    dateAdded:new Date().toISOString().slice(0,10),
    lastReview:null,
    photo:null,
    displayType,
    hasAudio:false,
  };
  const rerender = ()=>{ if(activeTab==='words') renderWords(document.getElementById('content')); else renderMeetings(document.getElementById('content')); };
  const finish = async ()=>{
    const gender = wordFormGender[prefix] || null;
    if(gender && entry.photo){
      entry.photo = await applyGenderLabelToPhoto(entry.photo, gender);
    }
    state.words.push(entry);
    await saveData();
    delete graphicsSelection[prefix];
    delete wordFormGender[prefix];
    if(shouldRecord){
      startWordRecording(id, prefix+'Status', rerender);
    } else {
      rerender();
    }
  };
  if(displayType==='graphics' && graphicsSelection[prefix]){
    entry.photo = 'graphics/' + graphicsSelection[prefix].file;
    finish();
    return;
  }
  if(displayType==='library' && librarySelection[prefix]){
    const libItem = state.photoLibrary.find(p=>p.id===librarySelection[prefix]);
    if(libItem){
      entry.photo = libItem.dataUrl;
      delete librarySelection[prefix];
      finish();
      return;
    }
  }
  if(displayType==='reference' && referenceSelection[prefix]!=null){
    const items = referenceImagesForForm(prefix);
    const item = items[referenceSelection[prefix]];
    if(item){
      entry.photo = item.src;
      delete referenceSelection[prefix];
      finish();
      return;
    }
  }
  if(displayType==='busy' && busySelection[prefix]){
    const busyItem = state.busyPictures.find(p=>p.id===busySelection[prefix]);
    if(busyItem){
      entry.photo = busyItem.dataUrl;
      delete busySelection[prefix];
      finish();
      return;
    }
  }
  if(fileInput && fileInput.files && fileInput.files[0]){
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onerror = ()=>{
        console.error('Photo failed to load/decode — saving entry without photo.');
        finish();
      };
      img.onload = ()=>{
        const canvas = document.createElement('canvas');
        const maxW = 500;
        const scale = Math.min(1, maxW/img.width);
        canvas.width = img.width*scale; canvas.height = img.height*scale;
        canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
        entry.photo = canvas.toDataURL('image/jpeg', 0.7);
        finish();
      };
      img.src = reader.result;
    };
    reader.onerror = ()=>{ console.error('File read failed — saving entry without photo.'); finish(); };
    reader.readAsDataURL(fileInput.files[0]);
  } else { finish(); }
}

function meetingCategory(mp){
  const t = (mp.topics+' '+mp.title).toLowerCase();
  if(/color|size|shape|length/.test(t)) return 'attribute';
  if(/number|quantity|money|buy|sell/.test(t)) return 'number';
  if(/room|house|neighbo(u)?rhood|geographical|countryside|places/.test(t)) return 'place';
  if(/family|body|emotion|people|nation|countr(y|ies)/.test(t)) return 'people';
  if(/verb|action|wash|cut|cook|open|close|push|climb|fly|swim|drive|touch|look|give|take|throw|show|listen|read|want|have|see|like|rest|work|cough|sneeze|bend|break|fold/.test(t)) return 'action';
  return 'object';
}
function suggestedMaterials(mp){
  const cat = meetingCategory(mp);
  if(cat==='people'){
    return {status:'not-applicable'};
  }
  const profileText = ((state.profile.profession||'')+' '+(state.profile.interests||'')).toLowerCase();
  if(!profileText.trim()) return {status:'no-profile'};
  const matched = Object.entries(OBJECT_BANKS).filter(([k,b])=> b.match.some(m=>profileText.includes(m)));
  if(matched.length===0) return {status:'no-match'};
  let items = [];
  matched.forEach(([k,b])=>{
    const sub = cat==='action' ? (b.actions||b.objects) : cat==='place' ? (b.places||b.objects) : b.objects;
    items = items.concat(sub);
  });
  return {status:'ok', items:[...new Set(items)].slice(0,6)};
}

let spellBuilder = {};
function toggleSpellEdit(wordId){
  const el = document.getElementById('wSpell-'+wordId);
  if(!el) return;
  if(el.innerHTML){ el.innerHTML=''; delete spellBuilder[wordId]; return; }
  const w = state.words.find(w=>w.id===wordId);
  spellBuilder[wordId] = (w && w.spelling) ? w.spelling.slice() : [];
  renderSpellBuilder(wordId);
}
function renderSpellBuilder(wordId){
  const el = document.getElementById('wSpell-'+wordId);
  if(!el) return;
  const seq = spellBuilder[wordId] || [];
  if(state.alphabet.length===0){
    el.innerHTML = `<div class="empty" style="margin-top:6px;">No alphabet characters added yet — add some in the Alphabet tab first.</div>`;
    return;
  }
  el.innerHTML = `
    <div style="margin-top:8px;padding:8px;background:#fff;border:1px solid var(--paper-line);border-radius:3px;">
      <div style="font-size:1.4rem;font-family:'Lora',serif;min-height:1.8rem;margin-bottom:8px;">${seq.map(id=>{const a=state.alphabet.find(a=>a.id===id); return a?escapeHtml(a.char):'?';}).join('') || '<span class="empty" style="font-size:.85rem;">(tap characters below to spell it)</span>'}</div>
      <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;">
        ${state.alphabet.map(a=>`<button class="ghost" style="font-size:1.1rem;padding:4px 10px;" onclick="spellAppend('${wordId}','${a.id}')">${escapeHtml(a.char)}</button>`).join('')}
      </div>
      <button class="ghost" onclick="spellBackspace('${wordId}')">Backspace</button>
      <button class="ghost" onclick="spellClear('${wordId}')">Clear</button>
      <button class="primary" onclick="spellSave('${wordId}')">Save spelling</button>
    </div>
  `;
}
function spellAppend(wordId, charId){
  spellBuilder[wordId] = spellBuilder[wordId] || [];
  spellBuilder[wordId].push(charId);
  renderSpellBuilder(wordId);
}
function spellBackspace(wordId){
  if(spellBuilder[wordId] && spellBuilder[wordId].length) spellBuilder[wordId].pop();
  renderSpellBuilder(wordId);
}
function spellClear(wordId){
  spellBuilder[wordId] = [];
  renderSpellBuilder(wordId);
}
async function spellSave(wordId){
  const w = state.words.find(w=>w.id===wordId);
  if(w) w.spelling = (spellBuilder[wordId]||[]).slice();
  await saveData();
  delete spellBuilder[wordId];
  renderWords(document.getElementById('content'));
}
function deleteWord(id){
  state.words = state.words.filter(w=>w.id!==id);
  saveData();
  try{ window.storage.delete('wordaudio:'+id, false); }catch(e){}
  renderWords(document.getElementById('content'));
}
async function loadWordAudio(id){
  const el = document.getElementById('wAudio-'+id);
  if(!el) return;
  try{
    const res = await window.storage.get('wordaudio:'+id, false);
    if(res && res.value){ el.innerHTML = `<audio controls src="${JSON.parse(res.value).dataUrl}"></audio>`; }
  }catch(e){}
}
let activeRecorder = null;
async function startWordRecording(wordId, targetElId, onDone){
  const elId = targetElId || ('wAudio-'+wordId);
  const el = document.getElementById(elId);
  if(!el) return;
  if(activeRecorder && activeRecorder.state==='recording'){ activeRecorder.stop(); }
  try{
    const stream = await navigator.mediaDevices.getUserMedia({audio:{channelCount:1}});
    let chunks = [];
    const rec = new MediaRecorder(stream, {audioBitsPerSecond:32000});
    activeRecorder = rec;
    el.innerHTML = '<span class="meta">Recording…</span> <button class="ghost" onclick="stopActiveRecording()">Stop</button>';
    rec.ondataavailable = e=>chunks.push(e.data);
    rec.onstop = async ()=>{
      stream.getTracks().forEach(t=>t.stop());
      if(activeRecorder===rec) activeRecorder = null;
      const blob = new Blob(chunks, {type:'audio/webm'});
      const reader = new FileReader();
      reader.onloadend = async ()=>{
        try{
          await window.storage.set('wordaudio:'+wordId, JSON.stringify({dataUrl:reader.result}), false);
          const w = state.words.find(w=>w.id===wordId);
          if(w) w.hasAudio = true;
          await saveData();
          if(onDone){ onDone(); }
          else { const freshEl = document.getElementById(elId); if(freshEl) freshEl.innerHTML = `<audio controls src="${reader.result}"></audio>`; }
        }catch(e){ const freshEl=document.getElementById(elId); if(freshEl) freshEl.innerHTML = '<span class="meta">Save failed.</span>'; }
      };
      reader.readAsDataURL(blob);
    };
    rec.start();
    setTimeout(()=>{ if(rec.state==='recording') rec.stop(); }, 180000);
  }catch(e){ el.innerHTML = '<span class="meta">Microphone unavailable.</span>'; }

let reviewActive = false, reviewSelected = null, reviewCurrent = null, reviewRevealed = false, reviewStats = {seen:0, known:0};
function groupWordsForDisplay(wordsList){
  const map = {};
  wordsList.forEach(w=>{
    let topLabel, subLabel;
    if(w.meetingPlan){
      const mp = MEETING_PLANS.find(m=>m.n===Number(w.meetingPlan));
      topLabel = mp ? `Meeting Plan ${mp.n}: ${mp.title}` : `Meeting Plan ${w.meetingPlan}`;
      subLabel = w.stepName || 'General';
    } else {
      topLabel = 'Other / Extra';
      subLabel = w.category || 'Uncategorized';
    }
    map[topLabel] = map[topLabel] || {};
    map[topLabel][subLabel] = map[topLabel][subLabel] || [];
    map[topLabel][subLabel].push(w);
  });
  const topLabels = Object.keys(map).sort((a,b)=>{
    if(a==='Other / Extra') return 1;
    if(b==='Other / Extra') return -1;
    return a.localeCompare(b, undefined, {numeric:true});
  });
  return topLabels.map(topLabel => ({
    topLabel,
    subs: Object.keys(map[topLabel]).sort().map(subLabel => ({subLabel, words: map[topLabel][subLabel]}))
  }));
}

function renderReview(c){

let reviewSessionStart = null;
function startReview(){
  lastReviewSummary = null;
  if(reviewMode==='activities'){
    const groups = reviewGroups();
    const ids = new Set();
    groups.forEach(g=>{
      g.subs.forEach(s=>{
        const subKey = g.topLabel+'::'+s.subLabel;
        if(reviewActivitySelectedSubs.has(subKey)) s.words.forEach(w=>ids.add(w.id));
      });
    });
    reviewSelected = ids;
  } else {
    const checked = [...document.querySelectorAll('.revWordCheck:checked')].map(cb=>cb.value);
    reviewSelected = new Set(checked);
  }
  if(reviewStyle==='grid'){
    startGridReview();
    return;

  renderReview(document.getElementById('content'));

function reviewPool(){
  return state.words.filter(w=> w.hasAudio && reviewSelected.has(w.id));
}
function pickNextReviewWord(){
  const pool = reviewPool();
  if(pool.length===0){ reviewCurrent = null; return; }
  const weight = w => w.iceberg;
  let candidates = pool;
  if(pool.length>1 && reviewCurrent){ candidates = pool.filter(w=>w.id!==reviewCurrent.id); if(candidates.length===0) candidates = pool; }
  const total = candidates.reduce((a,w)=>a+weight(w),0);
  let r = Math.random()*total;
  for(const w of candidates){ r -= weight(w); if(r<=0){ reviewCurrent = w; reviewRevealed=false; return; } }
  reviewCurrent = candidates[candidates.length-1]; reviewRevealed=false;
}
function answerReview(knewIt){
  reviewRevealed = true;
  reviewStats.seen++;
  if(knewIt) reviewStats.known++;
  const w = state.words.find(w=>w.id===reviewCurrent.id);
  if(w){
    w.iceberg = knewIt ? Math.max(w.iceberg-1, 1) : Math.min(w.iceberg+1, 9);
    w.lastReview = new Date().toISOString().slice(0,10);
    w.reviewCount = (w.reviewCount||0) + 1;
    if(!knewIt){ w.reviewMissCount = (w.reviewMissCount||0) + 1; w.suggestionDismissed = false; }
  }
  saveData();
  renderReview(document.getElementById('content'));
}
function nextReview(){
  pickNextReviewWord();
  renderReview(document.getElementById('content'));
}

// ---------- Grid Review ----------
let gridReviewActive = false, gridReviewPool = [], gridReviewGrid = [], gridReviewCurrent = null,
    gridReviewWrongAttempt = false, gridReviewRoundsSince = {}, gridReviewStats = {seen:0, known:0}, gridReviewNotEnough = false, gridReviewFeedback = null,
    gridReviewMode = 'all', gridReviewIntroduced = [], gridReviewRemaining = [], gridReviewPhase = 'quiz';
function startGridReview(){
  const pool = state.words.filter(w=> w.hasAudio && w.photo && reviewSelected.has(w.id));
  if(pool.length<2){
    gridReviewNotEnough = true;
    reviewSelected = null;
    renderReview(document.getElementById('content'));
    return;
  }
  gridReviewNotEnough = false;
  gridReviewPool = pool;
  gridReviewRoundsSince = {};
  gridReviewGrid = [];
  gridReviewActive = true;
  gridReviewStats = {seen:0, known:0};
  reviewSessionStart = Date.now();
  if(gridReviewMode==='rrd'){
    gridReviewIntroduced = [];
    gridReviewRemaining = shuffleArray(pool.map(w=>w.id));
    gridReviewPhase = 'intro';
    gridReviewCurrent = null;
    gridReviewIntroduceNext();
  } else {
    gridReviewIntroduced = pool.map(w=>w.id);
    gridReviewRemaining = [];
    gridReviewPhase = 'quiz';
    rebuildGridReviewGrid(null);
    pickGridReviewWord();
    renderReview(document.getElementById('content'));
  }
}
function gridReviewIntroduceNext(){
  if(gridReviewRemaining.length===0) return;
  const idx = Math.floor(Math.random()*gridReviewRemaining.length);
  const nextId = gridReviewRemaining.splice(idx,1)[0];
  gridReviewIntroduced.push(nextId);
  gridReviewPhase = 'intro';
  gridReviewFeedback = null;
  gridReviewWrongAttempt = false;
  rebuildGridReviewGrid(nextId);
  gridReviewCurrent = gridReviewPool.find(w=>w.id===nextId);
  renderReview(document.getElementById('content'));
}
function gridReviewStartQuiz(){
  if(gridReviewIntroduced.length===0) return;
  gridReviewPhase = 'quiz';
  rebuildGridReviewGrid(null);
  pickGridReviewWord();
  renderReview(document.getElementById('content'));
}
function rebuildGridReviewGrid(forceIncludeId){
  const ids = gridReviewIntroduced.slice();
  ids.forEach(id=>{
    if(gridReviewGrid.includes(id)) gridReviewRoundsSince[id] = 0;
    else gridReviewRoundsSince[id] = (gridReviewRoundsSince[id]||0) + 1;
  });
  let grid = [];
  let candidates = ids.slice();
  if(forceIncludeId){
    grid.push(forceIncludeId);
    candidates = candidates.filter(id=>id!==forceIncludeId);
  }
  const slots = Math.min(LIVE_GRID_MAX, ids.length) - grid.length;
  if(slots>0 && candidates.length>0){
    const weights = candidates.map(id=>(gridReviewRoundsSince[id]||0)+1);
    grid = grid.concat(weightedSampleWithoutReplacement(candidates, weights, Math.min(slots, candidates.length)));
  }
  gridReviewGrid = shuffleArray(grid);
}
function pickGridReviewWord(){
  const gridWords = gridReviewGrid.map(id=>gridReviewPool.find(w=>w.id===id)).filter(Boolean);
  if(gridWords.length===0){ gridReviewCurrent = null; return; }
  gridReviewCurrent = gridWords[Math.floor(Math.random()*gridWords.length)];
  gridReviewWrongAttempt = false;
}
function handleGridPick(wordId){
  if(!gridReviewCurrent || gridReviewPhase!=='quiz') return;
  gridReviewFeedback = null;
  if(wordId === gridReviewCurrent.id){
    gridReviewStats.seen++;
    const knewIt = !gridReviewWrongAttempt;
    if(knewIt) gridReviewStats.known++;
    const w = state.words.find(w=>w.id===wordId);
    if(w){
      w.iceberg = knewIt ? Math.max(w.iceberg-1, 1) : Math.min(w.iceberg+1, 9);
      w.lastReview = new Date().toISOString().slice(0,10);
      w.reviewCount = (w.reviewCount||0) + 1;
      if(!knewIt){ w.reviewMissCount = (w.reviewMissCount||0) + 1; w.suggestionDismissed = false; }
    }
    saveData();
    rebuildGridReviewGrid(null);
    pickGridReviewWord();
    gridReviewFeedback = 'correct';
    renderReview(document.getElementById('content'));
  } else {
    gridReviewWrongAttempt = true;
    renderReview(document.getElementById('content'));
  }
}
function endGridReview(){
  if(reviewSessionStart){
    const minutes = (Date.now()-reviewSessionStart)/60000;
    if(minutes>0.1){
      state.revisionMinutes = (state.revisionMinutes||0) + minutes;
      saveData();
    }
    lastReviewSummary = {minutes: minutes.toFixed(1), seen: gridReviewStats.seen, known: gridReviewStats.known};
    reviewSessionStart = null;
  }
  gridReviewActive = false; gridReviewCurrent = null; gridReviewPool = []; gridReviewGrid = [];
  gridReviewIntroduced = []; gridReviewRemaining = []; reviewSelected = null;
  renderReview(document.getElementById('content'));
}
function renderGridReviewActive(c){
  if(!gridReviewCurrent){
    c.innerHTML = `<div class="empty">Nothing left to review. <button class="ghost" onclick="endGridReview()">Back to setup</button></div>`;
    return;
  }
  const gridWords = gridReviewGrid.map(id=>gridReviewPool.find(w=>w.id===id)).filter(Boolean);
  const isIntro = gridReviewMode==='rrd' && gridReviewPhase==='intro';
  c.innerHTML = `
    <div class="empty" style="margin-bottom:10px;">Reviewed ${gridReviewStats.seen} · knew ${gridReviewStats.known} this session · <span id="reviewSessionTimerDisp">00:00</span> elapsed${gridReviewMode==='rrd'?` · ${gridReviewIntroduced.length}/${gridReviewPool.length} introduced`:''}</div>
    ${isIntro ? `<div style="text-align:center;"><span class="tag ochre" style="font-size:1rem;padding:6px 18px;">New</span></div>` : ''}
    <div id="gridReviewPlayer" class="meta" style="text-align:center;margin:8px 0 10px;">Loading audio…</div>
    ${gridReviewWrongAttempt ? `<div style="text-align:center;color:var(--red);font-weight:600;margin-bottom:8px;">Not quite — try again.</div>` : ''}
    ${gridReviewFeedback==='correct' ? `<div style="text-align:center;color:var(--teal);font-weight:600;margin-bottom:8px;">Correct! 🎉</div>` : ''}
    <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:10px;max-width:520px;margin:0 auto 20px;">
      ${gridWords.map(w=>`<div ${isIntro?'':`onclick="handleGridPick('${w.id}')"`} style="cursor:${isIntro?'default':'pointer'};aspect-ratio:1;overflow:hidden;border-radius:6px;border:2px solid ${isIntro && w.id===gridReviewCurrent.id?'var(--teal)':'var(--paper-line)'};background:#fff;"><img src="${w.photo}" style="width:100%;height:100%;object-fit:cover;"></div>`).join('')}
    </div>
    <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">
      ${gridReviewMode==='rrd' ? `
        <button class="primary" onclick="gridReviewIntroduceNext()" ${gridReviewRemaining.length===0?'disabled':''}>Introduce Next</button>
        <button class="ghost" onclick="gridReviewStartQuiz()" ${gridReviewIntroduced.length===0?'disabled':''}>Quiz</button>
      ` : ''}
      <button class="ghost danger" onclick="endGridReview()">End review</button>
    </div>
  `;
  loadPlayerInto('gridReviewPlayer', 'word', gridReviewCurrent.id, true);
}

function practiceWordNow(id){
  const w = state.words.find(w=>w.id===id);
  if(!w) return;
  reviewSelected = new Set([id]);
  reviewActive = true;
  reviewStats = {seen:0, known:0};
  reviewSessionStart = Date.now();
  pickNextReviewWord();
  activeTab = 'review';
  render();
}

// ---------- Alphabet ----------
let alphabetTabView = 'alphabet';
function renderAlphabet(c){
  if(alphaReviewActive){ renderAlphaReviewActive(c); return; }
  if(alphaGridActive){ renderAlphaGridActive(c); return; }
  if(readingTestActive){ renderReadingTestActive(c); return; }
  c.innerHTML = `
    <h3>Alphabet</h3>
    <div class="empty" style="margin-bottom:10px;">Characters are entered as text (works for any Unicode script) rather than uploaded images — type or paste the character, then record its sound.</div>
    <div class="field"><label>View</label>
      <select onchange="setAlphabetTabView(this.value)">
        <option value="alphabet" ${alphabetTabView==='alphabet'?'selected':''}>Alphabet</option>
        <option value="review" ${alphabetTabView==='review'?'selected':''}>Review</option>
      </select>
    </div>
    <div id="alphabetTabBody"></div>
  `;
  renderAlphabetTabBody();
}
function setAlphabetTabView(v){
  alphabetTabView = v;
  renderAlphabetTabBody();
}
function renderAlphabetTabBody(){
  const el = document.getElementById('alphabetTabBody');
  if(!el) return;
  if(alphabetTabView==='alphabet'){ renderAlphabetManage(el); return; }
  if(alphaReviewActive){ renderAlphaReviewActive(el); return; }
  if(alphaGridActive){ renderAlphaGridActive(el); return; }
  if(readingTestActive){ renderReadingTestActive(el); return; }
  renderAlphabetReviewSetup(el);
}
function renderAlphabetManage(el){
  el.innerHTML = `
    <div style="padding:10px;background:#fff;border:1px solid var(--paper-line);border-radius:3px;margin-bottom:14px;">
      <h4 style="margin-top:0;">Add alphabet character</h4>
      <div class="field"><label>Character</label><input id="alphaCharInput" placeholder="e.g. a single letter, or a sound unit"></div>
      <div style="display:flex;gap:8px;margin-top:8px;">
        <button class="ghost" onclick="addAlphabetChar(false)">Add</button>
        <button class="record" onclick="addAlphabetChar(true)">Add &amp; Record</button>
      </div>
      <div id="alphaAddStatus" class="meta" style="margin-top:6px;"></div>
    </div>
    <h4>Your alphabet (${state.alphabet.length})</h4>
    <div id="alphaList" style="display:flex;flex-wrap:wrap;gap:10px;"></div>
  `;
  renderAlphaList();
}
function renderAlphaList(){
  const el = document.getElementById('alphaList');
  if(!el) return;
  if(state.alphabet.length===0){
    el.innerHTML = `<div class="empty">No characters added yet.</div>`;
    return;
  }
  el.innerHTML = state.alphabet.map(a=>`
    <div class="entry" style="width:110px;text-align:center;">
      <div style="font-size:1.8rem;font-family:'Lora',serif;">${escapeHtml(a.char)}</div>
      <div id="alphaAudio-${a.id}" style="margin:4px 0;min-height:20px;"></div>
      <button class="ghost" style="font-size:.7rem;padding:2px 6px;width:100%;" onclick="startWordRecording('${a.id}', 'alphaAudio-${a.id}', ()=>onAlphaRecorded('${a.id}'))">${a.hasAudio?'Re-record':'Record'}</button>
      <button class="ghost danger" style="font-size:.7rem;padding:2px 6px;width:100%;margin-top:2px;" onclick="deleteAlphaChar('${a.id}')">Remove</button>
    </div>
  `).join('');
  state.alphabet.forEach(a=>{ if(a.hasAudio) loadPlayerInto('alphaAudio-'+a.id, 'word', a.id); });
}
function addAlphabetChar(shouldRecord){
  const input = document.getElementById('alphaCharInput');
  const char = input.value.trim();
  if(!char) return;
  const id = uid();
  state.alphabet.push({id, char, dateAdded: new Date().toISOString().slice(0,10), hasAudio:false});
  saveData();
  input.value = '';
  if(shouldRecord){
    startWordRecording(id, 'alphaAddStatus', ()=>{
      markAlphaHasAudio(id);
      renderAlphabetManage(document.getElementById('alphabetTabBody'));
    });
  } else {
    renderAlphabetManage(document.getElementById('alphabetTabBody'));
  }
}
function markAlphaHasAudio(id){
  const a = state.alphabet.find(a=>a.id===id);
  if(a) a.hasAudio = true;
  saveData();
}
function onAlphaRecorded(id){
  markAlphaHasAudio(id);
  renderAlphaList();
}
async function deleteAlphaChar(id){
  state.alphabet = state.alphabet.filter(a=>a.id!==id);
  await saveData();
  renderAlphaList();
}

// ---------- Alphabet Review ----------
let alphaReviewStyle = 'normal', alphaReviewGridMode = 'all', alphaReviewSelected = null,
    alphaReviewActive = false, alphaReviewCurrent = null, alphaReviewRevealed = false, alphaReviewStats = {seen:0, known:0},
    alphaGridActive = false, alphaGridPool = [], alphaGridGrid = [], alphaGridCurrent = null, alphaGridWrongAttempt = false,
    alphaGridRoundsSince = {}, alphaGridStats = {seen:0, known:0}, alphaGridFeedback = null,
    alphaGridMode = 'all', alphaGridIntroduced = [], alphaGridRemaining = [], alphaGridPhase = 'quiz', alphaGridNotEnough = false,
    readingTestActive = false, readingTestPool = [], readingTestCurrent = null, readingTestRevealed = false, readingTestNotEnough = false;
function alphaHasAudio(){ return state.alphabet.filter(a=>a.hasAudio); }
function renderAlphabetReviewSetup(el){
  const chars = alphaHasAudio();
  if(chars.length===0){
    el.innerHTML = `<div class="empty">No recorded characters yet. Add and record some in the Alphabet view first.</div>`;
    return;
  }
  el.innerHTML = `
    <div class="field"><label>Review type</label>
      <select onchange="setAlphaReviewStyle(this.value)">
        <option value="normal" ${alphaReviewStyle==='normal'?'selected':''}>Normal Review (hear it, then see it)</option>
        <option value="grid" ${alphaReviewStyle==='grid'?'selected':''}>Grid Review (hear it, click the right character)</option>
        <option value="reading" ${alphaReviewStyle==='reading'?'selected':''}>Reading Test (read words you've already learned)</option>
      </select>
    </div>
    ${alphaReviewStyle==='grid' ? `<div class="field"><label>Grid Review mode</label>
      <select onchange="setAlphaGridMode(this.value)">
        <option value="all" ${alphaGridMode==='all'?'selected':''}>Show all characters from the start</option>
        <option value="rrd" ${alphaGridMode==='rrd'?'selected':''}>Rough-and-Ready Dozen — introduce one at a time</option>
      </select>
    </div>` : ''}
    ${alphaReviewStyle!=='reading' ? `
      <div style="margin:10px 0;"><button class="ghost" onclick="selectAllAlphaChars(true)">Select all</button> <button class="ghost" onclick="selectAllAlphaChars(false)">Select none</button></div>
      <div id="alphaCheckList" style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;">
        ${chars.map(a=>`<label style="border:1px solid var(--paper-line);border-radius:4px;padding:6px 10px;display:flex;align-items:center;gap:6px;"><input type="checkbox" class="alphaCheck" value="${a.id}" checked><span style="font-size:1.2rem;">${escapeHtml(a.char)}</span></label>`).join('')}
      </div>
      <button class="primary" onclick="startAlphaReview()">Start review</button>
    ` : `
      <div class="empty" style="margin-bottom:10px;">This tests reading only — it draws exclusively from words you've spelled out (Word Log → "Spell using alphabet") and already reviewed at least once. New, unreviewed words never appear here.</div>
      <button class="primary" onclick="startReadingTest()">Start reading test</button>
    `}
  `;
}
function setAlphaReviewStyle(v){ alphaReviewStyle = v; renderAlphabetReviewSetup(document.getElementById('alphabetTabBody')); }
function setAlphaGridMode(v){ alphaGridMode = v; }
function selectAllAlphaChars(v){ document.querySelectorAll('.alphaCheck').forEach(cb=>cb.checked=v); }

function startAlphaReview(){
  const checked = [...document.querySelectorAll('.alphaCheck:checked')].map(cb=>cb.value);
  alphaReviewSelected = new Set(checked);
  if(alphaReviewStyle==='grid'){ startAlphaGridReview(); return; }
  alphaReviewActive = true;
  alphaReviewStats = {seen:0, known:0};
  reviewSessionStart = Date.now();
  pickNextAlphaWord();
  renderAlphabet(document.getElementById('content'));
}
function alphaReviewPool(){
  return state.alphabet.filter(a=>a.hasAudio && alphaReviewSelected.has(a.id));
}
function pickNextAlphaWord(){
  const pool = alphaReviewPool();
  if(pool.length===0){ alphaReviewCurrent = null; return; }
  let candidates = pool;
  if(pool.length>1 && alphaReviewCurrent){ candidates = pool.filter(a=>a.id!==alphaReviewCurrent.id); if(candidates.length===0) candidates = pool; }
  alphaReviewCurrent = candidates[Math.floor(Math.random()*candidates.length)];
  alphaReviewRevealed = false;
}
function answerAlphaReview(){
  alphaReviewRevealed = true;
  alphaReviewStats.seen++;
  renderAlphabet(document.getElementById('content'));
}
function nextAlphaReview(){
  pickNextAlphaWord();
  renderAlphabet(document.getElementById('content'));
}
function endAlphaReview(){
  if(reviewSessionStart){
    const minutes = (Date.now()-reviewSessionStart)/60000;
    if(minutes>0.1){ state.revisionMinutes = (state.revisionMinutes||0)+minutes; saveData(); }
    reviewSessionStart = null;
  }
  alphaReviewActive = false; alphaReviewCurrent = null; alphaReviewSelected = null;
  renderAlphabet(document.getElementById('content'));
}
function renderAlphaReviewActive(el){
  if(!alphaReviewCurrent){
    el.innerHTML = `<div class="empty">Nothing left in your selection. <button class="ghost" onclick="endAlphaReview()">Back to setup</button></div>`;
    return;
  }
  const a = alphaReviewCurrent;
  el.innerHTML = `
    <div class="empty" style="margin-bottom:10px;">Reviewed ${alphaReviewStats.seen} this session · <span id="reviewSessionTimerDisp">00:00</span> elapsed</div>
    <div class="panel" style="background:#fff;border:1px solid var(--paper-line);padding:18px;text-align:center;">
      <div id="alphaReviewPlayer" class="meta">Loading audio…</div>
      ${!alphaReviewRevealed ? `<div style="margin-top:16px;"><button class="primary" onclick="answerAlphaReview()">Show character</button></div>`
        : `<div style="font-size:2.4rem;font-family:'Lora',serif;margin-top:14px;">${escapeHtml(a.char)}</div>
           <button class="primary" style="margin-top:14px;" onclick="nextAlphaReview()">Next</button>`}
    </div>
    <button class="ghost" style="margin-top:14px;" onclick="endAlphaReview()">End review</button>
  `;
  loadPlayerInto('alphaReviewPlayer', 'word', a.id, true);
}

function startAlphaGridReview(){
  const pool = state.alphabet.filter(a=> a.hasAudio && alphaReviewSelected.has(a.id));
  if(pool.length<2){ alphaGridNotEnough = true; alphaReviewSelected = null; renderAlphabetTabBody(); return; }
  alphaGridNotEnough = false;
  alphaGridPool = pool;
  alphaGridRoundsSince = {};
  alphaGridGrid = [];
  alphaGridActive = true;
  alphaGridStats = {seen:0, known:0};
  reviewSessionStart = Date.now();
  if(alphaGridMode==='rrd'){
    alphaGridIntroduced = [];
    alphaGridRemaining = shuffleArray(pool.map(a=>a.id));
    alphaGridPhase = 'intro';
    alphaGridCurrent = null;
    alphaGridIntroduceNext();
  } else {
    alphaGridIntroduced = pool.map(a=>a.id);
    alphaGridRemaining = [];
    alphaGridPhase = 'quiz';
    rebuildAlphaGrid(null);
    pickAlphaGridChar();
    renderAlphabet(document.getElementById('content'));
  }
}
function alphaGridIntroduceNext(){
  if(alphaGridRemaining.length===0) return;
  const idx = Math.floor(Math.random()*alphaGridRemaining.length);
  const nextId = alphaGridRemaining.splice(idx,1)[0];
  alphaGridIntroduced.push(nextId);
  alphaGridPhase = 'intro';
  alphaGridFeedback = null;
  alphaGridWrongAttempt = false;
  rebuildAlphaGrid(nextId);
  alphaGridCurrent = alphaGridPool.find(a=>a.id===nextId);
  renderAlphabet(document.getElementById('content'));
}
function alphaGridStartQuiz(){
  if(alphaGridIntroduced.length===0) return;
  alphaGridPhase = 'quiz';
  rebuildAlphaGrid(null);
  pickAlphaGridChar();
  renderAlphabet(document.getElementById('content'));
}
function rebuildAlphaGrid(forceIncludeId){
  const ids = alphaGridIntroduced.slice();
  ids.forEach(id=>{
    if(alphaGridGrid.includes(id)) alphaGridRoundsSince[id] = 0;
    else alphaGridRoundsSince[id] = (alphaGridRoundsSince[id]||0) + 1;
  });
  let grid = [];
  let candidates = ids.slice();
  if(forceIncludeId){ grid.push(forceIncludeId); candidates = candidates.filter(id=>id!==forceIncludeId); }
  const slots = Math.min(LIVE_GRID_MAX, ids.length) - grid.length;
  if(slots>0 && candidates.length>0){
    const weights = candidates.map(id=>(alphaGridRoundsSince[id]||0)+1);
    grid = grid.concat(weightedSampleWithoutReplacement(candidates, weights, Math.min(slots, candidates.length)));
  }
  alphaGridGrid = shuffleArray(grid);
}
function pickAlphaGridChar(){
  const gridChars = alphaGridGrid.map(id=>alphaGridPool.find(a=>a.id===id)).filter(Boolean);
  if(gridChars.length===0){ alphaGridCurrent = null; return; }
  alphaGridCurrent = gridChars[Math.floor(Math.random()*gridChars.length)];
  alphaGridWrongAttempt = false;
}
function handleAlphaGridPick(charId){
  if(!alphaGridCurrent || alphaGridPhase!=='quiz') return;
  alphaGridFeedback = null;
  if(charId === alphaGridCurrent.id){
    alphaGridStats.seen++;
    if(!alphaGridWrongAttempt) alphaGridStats.known++;
    rebuildAlphaGrid(null);
    pickAlphaGridChar();
    alphaGridFeedback = 'correct';
    renderAlphabet(document.getElementById('content'));
  } else {
    alphaGridWrongAttempt = true;
    renderAlphabet(document.getElementById('content'));
  }
}
function endAlphaGridReview(){
  if(reviewSessionStart){
    const minutes = (Date.now()-reviewSessionStart)/60000;
    if(minutes>0.1){ state.revisionMinutes = (state.revisionMinutes||0)+minutes; saveData(); }
    reviewSessionStart = null;
  }
  alphaGridActive = false; alphaGridCurrent = null; alphaGridPool = []; alphaGridGrid = [];
  alphaGridIntroduced = []; alphaGridRemaining = []; alphaReviewSelected = null;
  renderAlphabet(document.getElementById('content'));
}
function renderAlphaGridActive(el){
  if(!alphaGridCurrent){
    el.innerHTML = `<div class="empty">Nothing left to review. <button class="ghost" onclick="endAlphaGridReview()">Back to setup</button></div>`;
    return;
  }
  const gridChars = alphaGridGrid.map(id=>alphaGridPool.find(a=>a.id===id)).filter(Boolean);
  const isIntro = alphaGridMode==='rrd' && alphaGridPhase==='intro';
  el.innerHTML = `
    <div class="empty" style="margin-bottom:10px;">Reviewed ${alphaGridStats.seen} · knew ${alphaGridStats.known} this session · <span id="reviewSessionTimerDisp">00:00</span> elapsed${alphaGridMode==='rrd'?` · ${alphaGridIntroduced.length}/${alphaGridPool.length} introduced`:''}</div>
    ${isIntro ? `<div style="text-align:center;"><span class="tag ochre" style="font-size:1rem;padding:6px 18px;">New</span></div>` : ''}
    <div id="alphaGridPlayer" class="meta" style="text-align:center;margin:8px 0 10px;">Loading audio…</div>
    ${alphaGridWrongAttempt ? `<div style="text-align:center;color:var(--red);font-weight:600;margin-bottom:8px;">Not quite — try again.</div>` : ''}
    ${alphaGridFeedback==='correct' ? `<div style="text-align:center;color:var(--teal);font-weight:600;margin-bottom:8px;">Correct! 🎉</div>` : ''}
    <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:10px;max-width:520px;margin:0 auto 20px;">
      ${gridChars.map(a=>`<div ${isIntro?'':`onclick="handleAlphaGridPick('${a.id}')"`} style="cursor:${isIntro?'default':'pointer'};aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:1.6rem;font-family:'Lora',serif;border-radius:6px;border:2px solid ${isIntro && a.id===alphaGridCurrent.id?'var(--teal)':'var(--paper-line)'};background:#fff;">${escapeHtml(a.char)}</div>`).join('')}
    </div>
    <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">
      ${alphaGridMode==='rrd' ? `
        <button class="primary" onclick="alphaGridIntroduceNext()" ${alphaGridRemaining.length===0?'disabled':''}>Introduce Next</button>
        <button class="ghost" onclick="alphaGridStartQuiz()" ${alphaGridIntroduced.length===0?'disabled':''}>Quiz</button>
      ` : ''}
      <button class="ghost danger" onclick="endAlphaGridReview()">End review</button>
    </div>
  `;
  loadPlayerInto('alphaGridPlayer', 'word', alphaGridCurrent.id, true);
}

// ---------- Reading Test ----------
function readingTestWords(){
  return state.words.filter(w=> w.hasAudio && w.spelling && w.spelling.length>0 && (w.reviewCount||0)>0);
}
function startReadingTest(){
  const pool = readingTestWords();
  if(pool.length===0){ readingTestNotEnough = true; renderAlphabetTabBody(); return; }
  readingTestNotEnough = false;
  readingTestPool = pool;
  readingTestActive = true;
  reviewSessionStart = Date.now();
  pickNextReadingWord();
  renderAlphabet(document.getElementById('content'));
}
function pickNextReadingWord(){
  const pool = readingTestPool;
  if(pool.length===0){ readingTestCurrent = null; return; }
  let candidates = pool;
  if(pool.length>1 && readingTestCurrent){ candidates = pool.filter(w=>w.id!==readingTestCurrent.id); if(candidates.length===0) candidates = pool; }
  readingTestCurrent = candidates[Math.floor(Math.random()*candidates.length)];
  readingTestRevealed = false;
}
function revealReadingAnswer(){
  readingTestRevealed = true;
  renderAlphabet(document.getElementById('content'));
}
function nextReadingWord(){
  pickNextReadingWord();
  renderAlphabet(document.getElementById('content'));
}
function endReadingTest(){
  if(reviewSessionStart){
    const minutes = (Date.now()-reviewSessionStart)/60000;
    if(minutes>0.1){ state.revisionMinutes = (state.revisionMinutes||0)+minutes; saveData(); }
    reviewSessionStart = null;
  }
  readingTestActive = false; readingTestCurrent = null; readingTestPool = [];
  renderAlphabet(document.getElementById('content'));
}
function renderReadingTestActive(el){
  if(!readingTestCurrent){
    el.innerHTML = `<div class="empty">Nothing left to read. <button class="ghost" onclick="endReadingTest()">Back to setup</button></div>`;
    return;
  }
  const w = readingTestCurrent;
  const spelledChars = w.spelling.map(id=>state.alphabet.find(a=>a.id===id)).filter(Boolean);
  el.innerHTML = `
    <div class="empty" style="margin-bottom:10px;"><span id="reviewSessionTimerDisp">00:00</span> elapsed</div>
    <div class="panel" style="background:#fff;border:1px solid var(--paper-line);padding:18px;text-align:center;">
      <div style="display:flex;justify-content:center;gap:4px;flex-wrap:wrap;font-size:2rem;font-family:'Lora',serif;">
        ${spelledChars.map(a=>`<span>${escapeHtml(a.char)}</span>`).join('')}
      </div>
      <div class="meta" style="margin-top:10px;">Read it aloud yourself, then check your pronunciation.</div>
      ${!readingTestRevealed ? `<button class="primary" style="margin-top:14px;" onclick="revealReadingAnswer()">Check pronunciation</button>`
        : `<div id="readingTestPlayer" class="meta" style="margin-top:14px;">Loading audio…</div>
           <button class="primary" style="margin-top:14px;" onclick="nextReadingWord()">Next</button>`}
    </div>
    <button class="ghost" style="margin-top:14px;" onclick="endReadingTest()">End reading test</button>
  `;
  if(readingTestRevealed) loadPlayerInto('readingTestPlayer', 'word', w.id, true);
}

async function loadPlayerInto(elId, kind, id, autoplay){
  const el = document.getElementById(elId);
  if(!el) return;
  try{
    const key = kind==='general' ? 'audio:'+id : 'wordaudio:'+id;
    const res = await window.storage.get(key, false);
    if(res && res.value) el.innerHTML = `<audio controls ${autoplay?'autoplay':''} src="${JSON.parse(res.value).dataUrl}"></audio>`;
    else el.innerHTML = '<span class="empty">Clip not found.</span>';
  }catch(e){ el.innerHTML = '<span class="empty">Could not load.</span>'; }
}

// ---------- Profile ----------
function renderProfile(c){
  const p = state.profile;
  c.innerHTML = `
    <h3>About you</h3>
    <div class="row">
      <div class="field"><label>Your name</label><input id="pName" value="${escapeHtml(p.name||'')}"></div>
      <div class="field"><label>Language you're learning</label><input id="pLang" value="${escapeHtml(p.language||'')}"></div>
    </div>
    <div class="field"><label>Why am I learning this language?</label><textarea id="pWhy" placeholder="the reason you'll want to see every day">${escapeHtml(p.why||'')}</textarea></div>
    <div class="field"><label>What to remember when it gets tough</label><textarea id="pRemember" placeholder="a truth or encouragement to hold onto">${escapeHtml(p.remember||'')}</textarea></div>
    <div class="row">
      <div class="field"><label>Where you'll live</label><input id="pLocation" value="${escapeHtml(p.location||'')}"></div>
      <div class="field"><label>Profession</label><input id="pProfession" value="${escapeHtml(p.profession||'')}"></div>
    </div>
    <div class="row">
      <div class="field"><label>Interests</label><input id="pInterests" value="${escapeHtml(p.interests||'')}"></div>
      <div class="field"><label>Hours you can study per week</label><input id="pHours" type="number" min="0" value="${escapeHtml(p.hoursPerWeek||'')}"></div>
    </div>
    <button class="primary" onclick="saveProfile()">Save</button>
    <h3 style="margin-top:26px;">Session setup</h3>
    <label style="display:flex;align-items:flex-start;gap:8px;font-size:.85rem;margin-bottom:8px;">
      <input type="checkbox" id="pAllowMaterialsEditing" style="margin-top:3px;" ${state.allowMaterialsEditing!==false?'checked':''} onchange="toggleAllowMaterialsEditing(this.checked)">
      <span>Allow picking reference pictures for activities. Turn this off once you've set up the pictures you want — the language learner will then just see what's already attached (view, use for a recording, or download), with no browsing or picker to distract them.</span>
    </label>
    <h3 style="margin-top:26px;">Backup</h3>
    <div class="empty" style="margin-bottom:8px;">Export everything (lessons, words, sessions — not audio, which is too large for a text file) as a backup you control.</div>
    <button class="ghost" onclick="exportData()">Export data as JSON</button>
  `;
}
function toggleAllowMaterialsEditing(val){
  state.allowMaterialsEditing = val;
  saveData();
}
function saveProfile(){
  state.profile = {
    name: document.getElementById('pName').value.trim(),
    language: document.getElementById('pLang').value.trim(),
    why: document.getElementById('pWhy').value.trim(),
    remember: document.getElementById('pRemember').value.trim(),
    location: document.getElementById('pLocation').value.trim(),
    profession: document.getElementById('pProfession').value.trim(),
    interests: document.getElementById('pInterests').value.trim(),
    hoursPerWeek: document.getElementById('pHours').value,
  };
  saveData(); renderProfile(document.getElementById('content'));
}
function exportData(){
  const blob = new Blob([JSON.stringify(state,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'gpa-companion-backup.json';
  a.click();
  URL.revokeObjectURL(url);
}

loadData();
</script>
