  1: {
    purpose:"Build the very first connection with your nurturer through five games, all pure listening at first: people-words (Game 1A), animal words (Game 1B), physical action commands (Game 2), the same actions applied to photos of you and your nurturer (Game 3), and common greeting/thank-you phrases using bubble pictures (Game 4).",
    technique:"Every game uses the \"Rough-and-Ready Dozen\" technique: the nurturer names or demonstrates something once, then immediately quizzes you on it, mixing in everything learned so far, at random. You never repeat words back — you just point or physically do the action. Two ground rules sit above everything else here: stay connected to your nurturer as a real person, not a machine dispensing vocabulary, and have fun — laughing is a good sign, not a distraction. There are three possible roles in the room: the nurturer (your host companion), the growing participators (2-6 of you), and optionally a coach — another growing participator, beginner or advanced, whose presence helps train a new nurturer.",
    materials:"Doll or toy figures for man, woman, boy, girl, baby, old man, old woman (or real people in the room); toy animals or animal pictures; a large space to move around in for physical actions; a camera to photograph the nurturer and each GP walking and running (or stick-figure drawings if photos aren't possible); puppets, dolls, or stuffed animals for Game 4; story-strip pictures with empty cartoon speech bubbles (Lexicarry-style, in your graphics packet). The Graphics Packet's Rough-and-Ready Dozen pictures for reference and its Talking Picture Dictionary page for recording new words.",
    steps:[
      {name:"Introduce man, woman, and yourself", game:"1A: Introducing people", needsRecording:false, description:"Your nurturer lays out two dolls (or uses two real people in the room) — a man and a woman — and says the equivalent of \"This is a man. This is a woman\" just once each. From this point on, only the nurturer speaks the target language, and GPs only listen and point — no talking at all. She immediately starts asking, over and over in random order, \"Where is the woman? Where is the man?\" and you respond purely by pointing. She then introduces \"I\" by pointing to herself, folding it into the same random questioning — \"Where am I? Where is the man? Where is the woman?\""},
      {name:"Keep adding new words, one at a time", game:"1A: Introducing people", needsRecording:false, description:"From here, one rule governs everything: every time a new word is added — boy, you, they, child, person, girl, baby, old man, old woman, and so on — the nurturer says it in a sentence exactly once, then goes straight back to quiz-style \"Where is...?\" questioning, folding it in with everything already learned. She never repeats a new word by itself over and over (never \"man, man, man\"); the repetition you need comes from being asked about it in different random combinations, not from hearing it chanted. Only move on to a new word once the group can reliably point to everything already introduced. Don't forget \"people\" and \"person\" and \"child\" alongside man/woman/boy/girl, and don't forget \"we\" and \"he\" alongside I/you/they — by the end, the nurturer should be mixing all the doll-words (boy, girl, man, baby, old man, old woman, person, people, child) with all the \"us\" words (I, we, you, he, they) randomly together, something like: \"Where is the girl? Where is a person? Where is the woman? Where are they? Where am I? Where are we? Where is the old man? Where are the people?\" — on and on, repeated a few times each in no particular order. If someone points wrong along the way, the nurturer corrects it only in the target language, naturally and kindly — for example, gently saying something like \"no, that's not the man, that's the woman — where is the man?\" and continuing, never switching to English or explaining grammar. You'll pick up the gist of the correction even without understanding every word of it, and that's fine. Keep going until you've built up the full set for this round."},
      {name:"Wrap up Game 1A: record and log", game:"1A: Introducing people", needsRecording:true, description:"Now record and log every new word from this round. In the original method this meant manually numbering pictures and keeping a running paper dictionary — this app does that part for you automatically, so just use the recording area below: add each new word, record yourself (or the nurturer) saying it, and it's logged and organized for you, ready to review later."},
      {name:"Introduce two animals", game:"1B: Introducing animals", needsRecording:false, description:"Same technique as Game 1A, just with animals instead of people. Nurturer brings out two toy animals or pictures, names each once (\"This is a cat. This is a dog\"), then immediately starts the random \"Where is...?\" questioning."},
      {name:"Keep adding animals, one at a time", game:"1B: Introducing animals", needsRecording:false, description:"Continue adding one new animal at a time — goat, bird, fish, frog, fly, spider, cow, mouse, horse, and so on (local, familiar animals are perfectly fine) — always folding each new addition into the same random questioning covering everything already learned in this game, the same one-at-a-time rule as before. Once several animals are known, introduce a general category word for \"animals\" itself, and contrast it against the general word for \"people\" from Game 1A."},
      {name:"Wrap up Game 1B: record and log", game:"1B: Introducing animals", needsRecording:true, description:"Same as Game 1A's wrap-up — record and log every new animal word from this round using the recording area below. No manual numbering needed; the app keeps track."},
      {name:"Play Game 2: Us in Action", game:"2: Us in Action", needsRecording:false, description:"This game moves from pointing to physically acting out commands. Nurturer begins with two actions — say, \"stand\" and \"sit\" — demonstrating each herself the first time she says it, with everyone standing/sitting along with her. Once both are introduced, she gives the instructions to the whole group in random order (\"stand, sit, sit, stand, sit...\") without demonstrating again, and everyone responds by actually doing the action. After a few rounds together, she starts addressing one GP at a time — saying the instruction first, pausing, then naming the person, so everyone has to process the instruction before knowing who it's for. She then adds a third action (like \"walk\") the same one-at-a-time way, mixing all three into the random individual and group instructions. GPs should act out actions fully and physically — actually walk around the room, actually lie down — not just gesture at it."},
      {name:"Wrap up Game 2: record and log", game:"2: Us in Action", needsRecording:true, description:"Once the last action has been added, record about a minute covering all the actions in random order, and log each new action word using the area below."},
      {name:"Prepare Game 3: Photos of Us in Action", game:"3: Photos of Us in Action", needsRecording:false, description:"This game needs some prep first, and the source material suggests spreading it over a few days given how many photos are involved. Take (or have the coach take) photos of the nurturer and of each GP separately: one walking, one running. If the nurturer prefers not to be photographed, simple stick-figure drawings of her doing each action work fine instead. Print these out — draft quality on plain paper is fine, several photos per page cut apart with scissors."},
      {name:"Play Game 3: Photos of Us in Action", game:"3: Photos of Us in Action", needsRecording:false, description:"Start with just the two \"walking\" photos: \"In which photo am I walking? In which photo are you walking?\" — repeated randomly, giving different GPs a turn to respond. When you're ready to add the \"running\" photos, you can add both at once since there are no genuinely new words, just new forms of the same ones: \"In which picture are you running? In which am I walking?\" and so on. With walking and running photos of multiple people now in play, pointing correctly means understanding both the action word AND the person word (I/you) together, not just one or the other. If any one GP starts struggling, it's fine to narrow back down to just two photos for that person specifically, then rebuild up again once they're confident — this doesn't need to slow down the rest of the group."},
      {name:"Wrap up Game 3: record and log", game:"3: Photos of Us in Action", needsRecording:true, description:"Record a sample covering the walking/running photos in random order, and log anything new using the area below."},
      {name:"Play Game 4: Cartoon Bubbles", game:"4: Cartoon Bubbles", needsRecording:false, description:"This game teaches common social phrases — hello, goodbye, thank you, you're welcome — using puppets or dolls first, then bubble pictures. Start by acting out a greeting and a farewell between two puppets or dolls, so GPs see what's being depicted before any pictures are involved. Then bring in two pictures with empty speech bubbles (from your graphics packet, or the Lexicarry book this idea comes from) depicting people greeting and parting, and ask Rough-and-Ready Dozen style: \"Who is saying hello? Who is saying goodbye?\" repeated randomly. Once that's solid, add a third: someone giving a gift and the other expressing thanks, then a fourth image for acknowledging thanks (\"you're welcome\") — folding each new phrase into the same random questioning as it's added, exactly like every other game so far. Vary the age and gender of the people depicted across pictures, since the same phrase can look different depending on who's speaking. It's fine to pick a fresh small set of expressions each day (five or six is plenty to start) — you're learning to recognize them as whole chunks, not analyzing every word inside them."},
      {name:"Wrap up Game 4: record and log", game:"4: Cartoon Bubbles", needsRecording:true, description:"Once the last expression has been added, record a sample — it might run about two minutes — covering everything in random order. Log the new expressions using the area below, continuing your running numbered set."}
    ],
    checkup:"Were you listening intensely and thinking about meaning, without commentating out loud? Was the nurturer speaking only in the target language, the whole time?"
  },
  2: {
    purpose:"Expand from Meeting 1's people and animal words into everyday objects, locations, simple give/take commands, and action pictures — five distinct games covering kitchen and office objects, stick-figure actions, spatial locations, putting and taking, and more cartoon-bubble practice.",
    technique:"Every game in this meeting still uses the same Rough-and-Ready Dozen technique from Meeting 1: the nurturer names something once, then immediately quizzes you on it at random, folding in everything learned so far. You never repeat a word back — you just point (or, later in this meeting, act out a command). No new item gets repeated by itself; the repetition comes from varied random questioning. Stay connected as a person, and keep it fun — the ground rules from Meeting 1 still apply throughout.",
    materials:"Kitchen items (book, paper, pencil, pen, knife, fork, spoon, glass, cup, bowl, mixing bowl, teapot); office/schoolroom objects and furniture — real, toy, or drawn (table, chair, bed, couch); a deliberately \"good\" and \"bad\" version of one or two items (like a good pencil and a broken one); simple stick-figure or triangle-people action drawings (sitting, standing, lying, walking, running); an object with a clear front and back for location words (a toy chair works well); a dozen pencils or similar small objects; a few containers things can go \"in\" (glass, cup, bowl); photos of the nurturer and each GP walking/running together; bubble-story pictures from your graphics packet (Lexicarry-style).",
    steps:[
      {name:"Play Game 1: Our little world — kitchen to office", game:"Game 1: Kitchen to office", needsRecording:false, description:"Using the same technique as Meeting 1, the nurturer introduces a set of everyday objects — starting with kitchen items, then office/schoolroom objects and furniture — ideally ones she actually uses in real life. She starts with two items (\"This is a pen. This is a knife. Where is the knife?\"), then adds one new item at a time, folding each into random questioning exactly as before. Along the way you may pick up a generic word for \"thing\" if the language has one (\"Where is a thing?\" — point to any item). Once several objects are known, the nurturer can combine them with \"and\" and \"or\" (\"Where is the book and the spoon? Where is the glass or the cup?\"). Include one deliberately \"good\" and \"bad\" version of an item so those words come up too. If anyone still feels weak on specific words from Meeting 1, fold a few of those back into this set as well."},
      {name:"Wrap up Game 1: record and log", game:"Game 1: Kitchen to office", needsRecording:true, description:"Record and log every new word from this round using the area below — the app organizes and numbers everything automatically."},
      {name:"Play Game 2: Make it true! (Stick People in Action)", game:"Game 2: Stick people in action", needsRecording:false, description:"Nurturer lays out two simple stick-figure or triangle-people drawings and describes an action for one of them — for example, \"The boy is running.\" You choose which of the two pictures matches. One by one, add more action pictures the same way — sitting, standing, lying down, walking. Don't worry if the exact grammatical form differs (like \"Run!\" versus \"is running\") — as long as you understand enough to point to the right picture, you've got what you need for now; finer details come later."},
      {name:"Wrap up Game 2: record and log", game:"Game 2: Stick people in action", needsRecording:true, description:"Record and log this round's new content using the area below."},
      {name:"Play Games 3A & 3B: Lots of places, and objects in places", game:"Games 3A-3B: Locations", needsRecording:false, description:"Choose an already-known object with a clear front and back (a toy chair works well). Nurturer introduces two location words at once — for example, \"This pencil is on the chair. This pencil is under the chair. Which pencil is under the chair?\" — then adds one new location at a time (in front of, behind), same Rough-and-Ready Dozen style: start with two, understand and point, one new item at a time, mostly ask individuals, keep it random. Don't worry about picking up extra words like \"which\" along the way — you'll hear them constantly. Once the location words feel solid, extend the game (3B) by bringing in objects you already know from Meeting 1 or from Game 1 today — especially ones you still feel weak on — and mix them into new combinations: \"Which pencil is under the horse? Which pencil is in front of the man?\""},
      {name:"Wrap up Games 3A & 3B: record", game:"Games 3A-3B: Locations", needsRecording:true, description:"Record a short sample covering the location words and object combinations using the area below. Since Game 3B doesn't introduce anything new of its own, there's nothing extra to log there — just the sample from 3A onward."},
      {name:"Play Game 3C: Understand and do — putting, taking, etc.", game:"Game 3C: Giving and taking", needsRecording:false, description:"Take one already-known object (say, a pencil). Nurturer contrasts two actions — \"Take the pencil\" and \"Put down the pencil\" — then adds one new action, \"give\" (\"Give me the pencil\"), then one more, \"point at.\" Four actions is enough for this round. Choose three or four other objects besides the pencil, and the nurturer gives commands mixing any of the actions with any of the objects at random — \"Take the goat. Give me the pencil.\""},
      {name:"Wrap up Game 3C: record and log", game:"Game 3C: Giving and taking", needsRecording:true, description:"Record and log this round's new words using the area below."},
      {name:"Play Game 4: Photos of us in action, continued", game:"Game 4: Photos of us in action", needsRecording:false, description:"Pick up the \"Photos of us in action\" game from Meeting 1, where you had pictures of the nurturer and each GP walking and running individually. Today, add new photos of the nurturer and each GP walking and running together, and extend the questioning to include \"we\" alongside \"I\" and \"you\" — \"In which picture are we walking? In which are we running?\""},
      {name:"Wrap up Game 4: record", game:"Game 4: Photos of us in action", needsRecording:true, description:"Just a sample recording this time using the area below — no new vocabulary items to log separately."},
      {name:"Play Game 5: More of the Cartoon Bubble Game", game:"Game 5: Cartoon bubble game", needsRecording:false, description:"Continue the bubble-picture game from Meeting 1 — bubble-story pictures from your graphics packet — adding a few more scenes the same way you did before."},
      {name:"Wrap up Game 5: record and log", game:"Game 5: Cartoon bubble game", needsRecording:true, description:"Record and log this round's new content using the area below."}
    ],
    checkup:"Were you listening intensely and thinking about meaning, without commentating out loud? Was the nurturer speaking only in the target language, the whole time?"
  },
  3: {
    purpose:"Seven games: learn the room you're actually sitting in, combine actions with room locations, add many more animals and kitchen containers, reinforce location words through two cue-card games, extend the ongoing photo and bubble-picture games, and prepare material for Meeting Plan 4.",
    technique:"Every game still runs on the same Rough-and-Ready Dozen technique from Meeting 1: name or demonstrate something once, then quiz randomly, folding in everything learned so far. This meeting also introduces cue cards — your Talking Picture Dictionary pages cut apart into individual cards. They exist for two reasons: to help you review recordings at home even without the real objects in front of you, and to help your nurturer keep games moving quickly by literally handing her random combinations to describe, rather than her having to invent variety on the spot.",
    materials:"Actual parts of the room you meet in (door, window, shelf, cupboard, blackboard/whiteboard, floor, ceiling, wall, wall picture, other furniture); cue cards for actions and room locations; toy animals, drawings, or magazine photos for camel, sheep, bee, tiger, goat, rabbit, duck, goose, snake, lizard, chicken; containers — pan, plate, saucer, tray, pitcher, kettle, frying pan, pot, lid, stove; cue cards for every object and location learned so far, sorted into stacks for the \"Make It True\" game; existing photos of the nurturer and each GP walking/running (individually and together); bubble-story pictures from your graphics packet; any familiar objects that can be held or touched, plus a camera for new prep photos.",
    steps:[
      {name:"Play Game 1: Look Around Us Here", game:"1: Look Around Us Here", needsRecording:false, description:"Same Rough-and-Ready Dozen technique as always, this time on the actual room you're meeting in. Nurturer starts with two — say, door and window — \"This is the door. This is the window. Where is the window? Where is the door?\" repeated randomly, then adds one at a time: floor, ceiling, wall, shelf, cupboard, blackboard or whiteboard, wall picture, other furniture in the room. Keep folding each new item into the same random questioning covering everything learned so far."},
      {name:"Wrap up Game 1: record and log", game:"1: Look Around Us Here", needsRecording:true, description:"Record and log the new room words using the area below."},
      {name:"Play Game 2: Us in Action, Here", game:"2: Us in Action, Here", needsRecording:false, description:"Combine movement and body-position words (sit, stand, lie) with the room locations from Game 1. Start by adding \"point to\" and \"look at\" — \"Point to the ceiling. Look at the floor. Look at the sofa. Point to the door.\" Then fold in known commands from earlier meetings: \"Walk to the door. Stand beside the blackboard. Sit on the floor.\" As always, a GP just needs to be able to carry out the action correctly — understanding every grammatical detail of how it's phrased can come later."},
      {name:"Wrap up Game 2: record and log", game:"2: Us in Action, Here", needsRecording:true, description:"Record and log this round's combinations using the area below."},
      {name:"Play Game 3A: More Animal World", game:"3A: More Animal World", needsRecording:false, description:"More Rough-and-Ready Dozen, alternating between new living creatures and new inanimate containers — it tends to go easier alternating between the two types rather than doing all of one and then all of the other. Add animals like camel, sheep, bee, tiger, goat, rabbit, duck, goose, snake, lizard, chicken. Add containers like pan, plate, saucer, tray, pitcher, kettle, frying pan, pot, lid, stove. For example: \"This is a camel. This is a pitcher. Where is the camel? Where is the pitcher?\" — then keep adding one at a time, folding each into the random mix."},
      {name:"Wrap up Game 3A: record and log", game:"3A: More Animal World", needsRecording:true, description:"Record and log the new animals and containers using the area below. The source material notes this one needs two separate recordings (animals, then containers) if you'd rather split them — either way works, just make sure both groups get logged."},
      {name:"Play Games 3B & 3C: Strengthening Locations and Objects", game:"3B-3C: Strengthening Locations and Objects", needsRecording:false, description:"Two reinforcement games using cue cards — no brand-new vocabulary here, just deepening what's already been learned. First (3B): practice \"putting objects in locations\" — \"Put the duck into the pitcher.\" Don't worry yet if a word changes form depending on context (\"into the pitcher\" vs. \"in the pitcher\") — rough-and-ready understanding is still the goal. Then (3C), play \"Make It True\": sort your cue cards into two stacks of objects and one stack of location words. Draw one card from each object stack plus the location stack — say you draw \"horse,\" \"boy,\" and \"behind\" — and say the resulting sentence (\"The boy is behind the horse\"), while GPs physically arrange the actual objects to match. Occasionally flip it (\"the horse is behind the boy\") so GPs must actually process the sentence rather than guess. Keep the pace brisk — decide quickly what to say next rather than pausing to think, which is exactly what the cue cards are there to help with."},
      {name:"Wrap up Games 3B & 3C: record", game:"3B-3C: Strengthening Locations and Objects", needsRecording:true, description:"Just a recorded sample of the game using the area below — there's no new vocabulary to log here, so nothing needs adding to your running word count this round."},
      {name:"Play Game 4: Photos of Us in Action, Continued", game:"4: Photos of Us in Action, Continued", needsRecording:false, description:"Continue the ongoing photo game from Meetings 1 and 2. You already have photos of the nurturer and each GP walking/running individually (Meeting 1) and together (Meeting 2, covering \"we\"). Now add questions using existing photos of individuals in your group: \"In which picture is he running? In which is she walking?\" — extending the same action + person-word combination to he/she."},
      {name:"Wrap up Game 4: record", game:"4: Photos of Us in Action, Continued", needsRecording:true, description:"A brief recorded sample using the area below — no picture dictionary entry needed this round, since he/she are just new forms of words you already know."},
      {name:"Play Game 5: Continuing the Cartoon Bubbles", game:"5: Continuing the Cartoon Bubbles", needsRecording:false, description:"Continue the bubble-picture game from Meeting 1, using the Lexicarry book or your graphics packet's bubble pictures. This round, look for pictures that let you bring out differences based on the age or gender of the speakers — greetings, leave-takings, \"how are you\"s and \"I'm fine, how are you\"s can all vary depending on who's talking to whom. It's fine to make somewhat arbitrary choices about which picture depicts which exact phrase — giving a rough translation to clarify intended meaning is completely fine. Once the game is underway, the same Rough-and-Ready Dozen rules apply as always: only the nurturer speaks, and only in the target language."},
      {name:"Wrap up Game 5: record and log", game:"5: Continuing the Cartoon Bubbles", needsRecording:true, description:"Record parts of the activity as you go, and log new phrases in your running Picture Dictionary using the area below."},
      {name:"Play Game 6: Preparing for Meeting Plan 4 — Holding & Touching", game:"6: Preparing for Meeting 4", needsRecording:false, description:"This one sets up material for Meeting Plan 4's own photo game. First, introduce two new words — \"holding\" and \"touching\" — using a single already-known object: nurturer asks GPs to either touch it or hold it. Once everyone has each object familiar, have each person hold or touch a different familiar object at the same time, then the nurturer asks \"Who is holding X?\" and \"Who is touching Y?\" while GPs point to the right person. Once this is solid, take a batch of photos of different people holding and touching different things — you'll need these ready for Meeting Plan 4."},
      {name:"Wrap up Game 6: record and log", game:"6: Preparing for Meeting 4", needsRecording:true, description:"Record and log \"holding\" and \"touching\" using the area below — and don't forget to actually take and save the prep photos for Meeting Plan 4 while you're at it."}
    ],
    checkup:"Were you listening intensely and thinking about meaning, without commentating out loud? Was the nurturer speaking only in the target language, the whole time?"
  },
  4: {
    purpose:"Eight games: refresh room words using a toy house, extend the stick-figure action game to your own room, add new actions and the \"we\" combination to your ongoing photo game, practice giving/taking commands, gather about fifteen real everyday objects to build vocabulary from, reinforce location words further, and extend the bubble-picture phrases.",
    technique:"Same Rough-and-Ready Dozen approach throughout — but by now you're experienced enough that the nurturer can start straight from \"add one\" instead of introducing two brand-new items first, since you're building on everything already learned rather than starting fresh each time.",
    materials:"A toy house with a bed, table, chair, and sofa placed inside (buy one, or make one from cardstock using the pattern in your graphics packet — a dollhouse works too); the stick-people cue cards from Meeting Plan 2's Game 2; existing photos of the nurturer and each GP doing actions, plus your holding/touching prep photos; the same familiar objects used in Game 2 for Game 3's commands; about fifteen real, everyday objects gathered from around your home or a local market — common things a small child would recognize (a tree, broom, comb, mirror, toy elephant, sink, toilet, flower, etc. — drawings are fine for anything too large or impractical to bring inside); your growing \"Bag of Stuff\" of every object used in games so far; cue cards for location words (in, on, in front of, behind, under, together with, separate from, above) and for every object and location learned so far; bubble-story pictures continuing from where you left off in your graphics packet.",
    steps:[
      {name:"Play Game 1A: \"Here,\" Again", game:"1A: \"Here,\" Again", needsRecording:false, description:"Start by asking GPs to again point to and understand all the room-location words from Meeting Plan 3's \"Look Around Us Here\" — cue cards can help remind the nurturer what's already been covered. This refreshes and strengthens those words. Then bring out a toy house and do the same thing using it: point to its door, window, and so on. You'll likely need a few new words too — \"house,\" \"stairs,\" and possibly others depending on your toy house's features. Since you're adding to an already-known set rather than starting from nothing, the nurturer can begin straight from \"add one\" — introduce a new item, then fold it into random questioning with everything already known, the same technique as always."},
      {name:"Wrap up Game 1A: record and log", game:"1A: \"Here,\" Again", needsRecording:true, description:"Record a sample, and log only the genuinely new words from the toy house (house, stairs, etc.) using the area below — the refreshed room words from Meeting 3 don't need logging again."},
      {name:"Play Game 1B: Make It True — Stick Figures in Action, Here", game:"1B: Make It True — Stick Figures, Here", needsRecording:false, description:"Using the stick-people cue cards from Meeting Plan 2's Game 2 alongside your actual room (or the toy house), the nurturer describes a situation and GPs arrange the stick-figure pictures to match — \"the man is sitting by the window,\" \"the woman is running to the door,\" and so on. This combines action words with the room-location words you already know, reinforcing both together."},
      {name:"Wrap up Game 1B: record", game:"1B: Make It True — Stick Figures, Here", needsRecording:true, description:"Just a recorded sample using the area below — no new words are introduced here, so there's nothing new to log."},
      {name:"Play Game 2: Photos of Us in Action, More", game:"2: Photos of Us in Action, More", needsRecording:false, description:"Add more actions to your ongoing photo game — but instead of stopping to take a big batch of new photos together, add just one new action per day going forward, reusing activities already introduced in other games (check your cue cards for what's already covered: sitting, standing, lying, and others). Continue asking \"In which picture am I jumping? In which are you sitting?\" as before. For \"we,\" phrase it as \"In which pictures are we jumping?\" — the GP responds by pointing to two separate photos: one of the nurturer jumping, one of themselves jumping, since there isn't a single photo of both together for every action. Also fold in your holding/touching photos from the earlier prep work into this same rotation."},
      {name:"Wrap up Game 2: record", game:"2: Photos of Us in Action, More", needsRecording:true, description:"Record a sample using the area below — no picture dictionary entry needed, since this is just extending patterns you already know into new combinations."},
      {name:"Play Game 3: Give and Take", game:"3: Give and Take", needsRecording:false, description:"Using the same familiar objects from Game 2, the nurturer instructs GPs to take an object, put it down, point at it, give it to her, or asks where it is — mixing singular and plural forms: \"You take the horse. You guys take the cow. You show me the door. Where is the wall?\" and so on, at a brisk, varied pace."},
      {name:"Wrap up Game 3: record", game:"3: Give and Take", needsRecording:true, description:"Record a few minutes' sample using the area below — nothing new for the picture dictionary this round."},
      {name:"Play Game 4: Choose Your Objects!", game:"4: Choose Your Objects!", needsRecording:false, description:"You still need a good number of new words this meeting, same as every meeting so far. The easiest words to add at this stage are names of physical objects you can pick up and interact with — don't worry about exactly which ones, as long as they're common in your host world or things a small child would already know. If you haven't already gathered real objects for this (the source material suggests going to a local market and picking up about fifteen individual items, table by table if there is one), now's the time — a mix of real objects and drawings for anything impractical (like a tree or an elephant) works fine. Use the Rough-and-Ready Dozen to introduce them one at a time: tree, broom, comb, mirror, elephant, sink, toilet, flower, and others along these lines."},
      {name:"Wrap up Game 4: record and log", game:"4: Choose Your Objects!", needsRecording:true, description:"Record a sample of the game and log every new object using the area below — and hold onto all fifteen-or-so objects afterward, since they'll keep getting reused as your \"Bag of Stuff\" throughout the rest of Phase 1."},
      {name:"Play Games 5 & 6: More \"Lots of Places\"", game:"5-6: More Lots of Places", needsRecording:false, description:"Continue Meeting Plan 2's \"Lots of Places\" game — there are so many locations and objects in your Bag of Stuff by now that some genuinely benefit from more practice. Start simple: put matches or pencils into places relative to objects from your Bag of Stuff, using both the locations you already know and some new ones — on, in, in front of, behind, under, together with, separate from, above. Once that's solid, move beyond matches: use ALL your previous objects both as the things being placed and as the locations relative to which other things are placed — \"put the boy under the frog,\" \"put the dog beside the chair,\" and so on. Two stacks of cue cards make this much easier to keep varied and quick: one stack of location words, one of every object learned so far. Draw one location card and two object cards — say, \"behind,\" a goat, and a paper — and say the resulting sentence: \"Put the goat behind the paper.\""},
      {name:"Wrap up Games 5 & 6: record and log", game:"5-6: More Lots of Places", needsRecording:true, description:"Record a sample using the area below, and log any of the newer location words (together with, separate from, above, etc.) that weren't already covered back in Meeting Plan 2."},
      {name:"Play Game 7: More Bubble Pictures", game:"7: More Bubble Pictures", needsRecording:false, description:"Refresh whatever bubble-picture phrases you covered on page 1 previously, then continue onto page 2 of your bubble pictures (Cartoon Bubble Game, Lexicarry, or similar). Introduce a few more common, simple social phrases — for example, something someone says when another person sneezes, when asking what time it is, or when interrupting a conversation. Pick one clear phrase per bubble picture, though it's fine to draw in an extra bubble if a picture naturally calls for it."},
      {name:"Wrap up Game 7: record and log", game:"7: More Bubble Pictures", needsRecording:true, description:"Record a sample and log the new phrases in your running Picture Dictionary using the area below."}
    ],
    checkup:"Were you listening intensely and thinking about meaning, without commentating out loud? Was the nurturer speaking only in the target language, the whole time?"
  },
  5: {
    purpose:"Six games covering a genuinely large amount of ground: body parts using a single doll, more face vocabulary, applying body-part words to multiple people, animal body parts, family relationships across three generations, and an optional refresh of bubble pictures if time allows. This meeting has historically taken longer than others — that's expected, not a sign you're behind.",
    technique:"Same Rough-and-Ready Dozen technique throughout, with one important phrasing detail: when asking about a doll's body part, the nurturer should always frame it as \"Where is HIS foot?\" or \"Where is HER foot?\" — never just \"Where is the foot?\" — since you're identifying whose body part it is, not just the part itself. If this meeting runs long, it's fine and expected to stop between two games and pick up the rest next time — just try not to start or end a meeting exactly mid-game if you can help it.",
    materials:"A doll or picture of a human body (the nurturer may need to divide it up differently than your graphics packet does — that's fine, the packet just serves as your reference Picture Dictionary); individual body-part cue cards cut from the graphics packet; the same room and action cue cards from Meeting Plan 3, Game 2; dolls or pictures of man, woman, boy, girl, baby, old man, old woman; all the animal figures or pictures used in previous meetings; a doll family — ideally dolls depicting a range of ages (man, woman, one or two boys, one or two girls, old man, old woman — drawings or puppets work for extra family members if needed); your existing bubble-story pictures for the optional refresh game.",
    steps:[
      {name:"Play Game 1A: People From Head to Toe", game:"1A: People From Head to Toe", needsRecording:false, description:"Starting with a single doll, rapidly learn as many body-part names as you can in the time available, along with the word for \"body\" itself. As always, start with two (\"This is his hand. This is his foot. Where is his hand?\") and add one at a time, always framing questions as \"Where is his hand?\" — never just \"Where is a hand?\" or \"Where is the hand?\" — since you're identifying the doll's own body part. For body parts that naturally come in pairs (eyes, ears, hands), just say whatever feels natural to the nurturer as a native speaker — some languages treat these as a plural, others don't, and either is fine."},
      {name:"Play Game 1B: More Than a Pretty Face", game:"1B: More Than a Pretty Face", needsRecording:false, description:"If you haven't already covered them, add more parts of the face — eye, ear, and similar — using the same Rough-and-Ready Dozen technique. Watch out: some host languages treat body parts that come in pairs (like eyes or ears) as though they're a single word or concept, which can be an easy source of confusion if you're not expecting it."},
      {name:"Wrap up Games 1A & 1B: record and log", game:"1A-1B: Body Parts", needsRecording:true, description:"Record and log every body part covered across both games using the area below."},
      {name:"Play Game 2: Here and There in Here", game:"2: Here and There in Here", needsRecording:false, description:"Same as Meeting Plan 3's Game 2 — combine action and body-position words (sit, stand, lie) with room locations. \"Point at the ceiling. Walk to the door. Stand beside the blackboard. Sit on the floor.\" Cue cards for both actions and room locations can help keep the pace brisk and varied."},
      {name:"Wrap up Game 2: record", game:"2: Here and There in Here", needsRecording:true, description:"Record a sample using the area below."},
      {name:"Play Game 3: Everybody's Body Parts!", game:"3: Everybody's Body Parts!", needsRecording:false, description:"Using dolls or pictures of man, woman, boy, girl, and baby, ask questions like \"Where is the man's nose? Where are the baby's legs?\" You don't need to \"start with two\" here since GPs already know these body-part words — the real challenge is that the word forms may change somewhat depending on whose body part it is (e.g. \"the man's nose\" might sound noticeably different from just \"nose\"). If a GP needs to pause and think hard before pointing correctly, that's completely fine — rough-and-ready understanding is still the goal, not instant recognition of every word form."},
      {name:"Wrap up Game 3: record", game:"3: Everybody's Body Parts!", needsRecording:true, description:"Record a sample using the area below — no new base words here, just new forms of ones you already know."},
      {name:"Play Game 4: Tails and Horns and Stuff", game:"4: Tails and Horns and Stuff", needsRecording:false, description:"Use the Rough-and-Ready Dozen to learn animal body parts — wing, feathers, tail, horn, beak, and possibly \"turtle\" if that's new. Then apply them to all the animal figures or pictures you've used in previous meetings: \"Where is the horse's head? Where is the frog's forehead? Where are the cow's legs? Where are the bird's feathers? Where are the goat's horns?\""},
      {name:"Wrap up Game 4: record and log", game:"4: Tails and Horns and Stuff", needsRecording:true, description:"Record and log the new animal body-part words using the area below."},
      {name:"Play Game 5: All in the Family", game:"5: All in the Family", needsRecording:false, description:"A bigger game with its own technique: set one doll sitting upright in the middle of the rest of the doll family, who all lie down around them — say the man is sitting up. Everyone now understands that any question about \"his\" family refers to the man specifically. Start with two relationships (\"This is his son. This is his wife. Where is his son? Where is his wife?\"), then add one at a time — daughter, and so on — until you've covered every family member for that person. Stick to three generations of a single nuclear family only: don't add in-laws, aunts, uncles, or cousins at this stage. If your host culture distinguishes older from younger siblings, you may need to choose relative ages for your dolls and account for that distinction. Once one person's family is fully covered, lie them down, sit up a different doll (the woman, a child, a grandparent), and repeat the same process for their relationships to everyone else — man in the center might cover wife/son/daughter/father/mother, while a child in the center might cover sister/brother/father/mother/grandmother/grandfather. As always, accept whatever words your nurturer uses for family relationships even if they don't map cleanly onto how you'd categorize them yourself — that's genuinely fine, and this is a theme (family words carrying host-specific logic) you'll come back to in much more depth later in your language journey."},
      {name:"Wrap up Game 5: record and log", game:"5: All in the Family", needsRecording:true, description:"This game specifically calls for recording multiple times, not just once at the end — record a sample as soon as you've heard all of the first person's (e.g. the man's) family members, then record again after each subsequent family member's relationships have been learned. Use the area below for each round, and log every new family-relationship word as you go."},
      {name:"Play Game 6: Bubble Pictures, Refresh (optional — skip if short on time)", game:"6: Bubble Pictures, Refresh", needsRecording:false, description:"An optional refresher: the nurturer sticks to pictures you've already understood before, refreshing and strengthening them in your hearing rather than introducing anything new. GPs can pick whichever pictures or picture strips feel most useful right now, in any order. Skip this game entirely if you're already short on time this meeting."},
      {name:"Wrap up Game 6: record", game:"6: Bubble Pictures, Refresh", needsRecording:true, description:"If you played this optional game, record a brief sample using the area below — there's nothing new to log since this was pure review."}
    ],
    checkup:"Were you listening intensely and thinking about meaning, without commentating out loud? Was the nurturer speaking only in the target language, the whole time?"
  },
  6: {
    purpose:"Nine games — the biggest meeting yet. This is where object pronouns (him, them, me, us) and the he/she distinction actually get introduced, alongside possessive pronouns with body parts, a big three-way combination game mixing actions with family and body parts, and more bubble-picture phrases. Also a reminder worth carrying through all of these: you're at a stage where play, not serious study, is genuinely the fastest way to grow — lean into it.",
    technique:"Same Rough-and-Ready Dozen approach throughout. A few of today's games involve physical contact between GPs (patting, stroking, touching) — be sensitive about this between males and females in your group. Dolls, puppets, or \"almost\" touching are all fine substitutes if direct contact isn't appropriate. Also: at the end of this meeting, ask your nurturer to bring pictures of their own family next time (or draw stick figures / use dolls to represent their family if bringing real photos isn't practical) — you'll need this for Meeting Plan 7.",
    materials:"Cue cards for actions applied to room parts; cue cards for the new actions from Game 1 (pat, stroke, wash) plus dolls or puppets as a touch-sensitive alternative; cue cards for him/them/me/us and for already-known actions (touch, push, pull, etc.); pictures of each GP and the nurturer from Meeting Plan 1 (as another touch-sensitive alternative for Game 2D); dolls or puppets; a cloth for pretend \"washing\" (no water needed); your doll family again, arranged from different family members' perspectives; three separate stacks of cue cards for Game 4 — actions, family relationships, and body parts; all the toy furniture and household items gathered in previous meetings; your continuing bubble-picture pages.",
    steps:[
      {name:"Play Game 1: Places in Here and Things We Can Do", game:"1: Places in Here and Things We Can Do", needsRecording:false, description:"Tell GPs to run to, walk to, or stand by the door, window, wall, and other room parts — reusing action and location words you already know. Add two new actions here too: \"look at\" and \"touch\" applied to parts of the room."},
      {name:"Wrap up Game 1: record and log", game:"1: Places in Here and Things We Can Do", needsRecording:true, description:"Record a sample and log \"look at\" and \"touch\" as new words using the area below."},
      {name:"Play Game 2A: Doing Things to Us! Part 1, the Actions", game:"2A: Doing Things to Us — The Actions", needsRecording:false, description:"One GP stands in the middle of the group. Keeping the \"object\" the same (the person in the middle) lets you focus purely on three brand-new actions: pat, stroke, and wash. The nurturer tells GPs to do these to the person in the middle — \"pat him, stroke him\" — then mixes in already-familiar actions too: \"look at him, touch him, point at him, wash him.\""},
      {name:"Wrap up Game 2A: record and log", game:"2A: Doing Things to Us — The Actions", needsRecording:true, description:"Record a sample and log pat, stroke, and wash using the area below."},
      {name:"Play Game 2B: Doing Things to \"Us,\" Continued", game:"2B: Doing Things to Us, Continued", needsRecording:false, description:"Now change who's being acted on. Start with two — \"him\" and \"them\" — \"Touch him. Touch them. Look at them. Pat them.\" Once that's solid, add \"me\": if the nurturer (or a puppet on the nurturer's hand) says \"pat me,\" the GP pats the nurturer or the puppet. Keep alternating unpredictably between him, them, and me, mixed with all the actions learned so far."},
      {name:"Wrap up Game 2B: record and log", game:"2B: Doing Things to Us, Continued", needsRecording:true, description:"Record a sample and log him/them/me as new words using the area below."},
      {name:"Play Game 2C: Make It True! (You and He or Him)", game:"2C: Make It True — You and He or Him", needsRecording:false, description:"This is where \"you\" as someone being spoken TO and \"he/she\" as someone being spoken ABOUT genuinely come together. Pick one person to be \"you\" — the nurturer will talk directly to them — and a second person to be \"he\" or \"she\" — the nurturer will talk about them instead. Say the nurturer makes John \"you\" and Sue \"she.\" Starting with just one action (like \"looking at\"): the nurturer tells John, \"She is looking at you\" — and for that to be true, Sue actually has to start looking at John. Or: \"You are patting her\" — for that to be true, John has to pat Sue. Only one of the two people acts out each statement, depending on who the sentence is actually about. Once a pair has this working smoothly with one action, add the other actions from today's games. Then swap roles — Sue becomes \"you,\" John becomes \"he.\""},
      {name:"Wrap up Game 2C: record and log", game:"2C: Make It True — You and He or Him", needsRecording:true, description:"Record a sample and log \"he/him\" and \"she/her\" as new words using the area below."},
      {name:"Play Game 2D: Ourselves and One Another", game:"2D: Ourselves and One Another", needsRecording:false, description:"Using the same actions from today, the nurturer now asks GPs to do things either to each other or to themselves — \"pat each other,\" \"pat yourself,\" and so on. Once that's working, mix in the full range of targets covered across today's games: me, him, yourself, us, them, each other."},
      {name:"Wrap up Game 2D: record and log", game:"2D: Ourselves and One Another", needsRecording:true, description:"Record both a sample of the game and log \"each other\" and \"yourself\" as new words using the area below."},
      {name:"Play Game 3: Body Parts — Yours, Mine, Etc.", game:"3: Body Parts — Yours, Mine, Etc.", needsRecording:false, description:"The nurturer asks where your, her, their, etc. leg or foot is. Today's goal is purely to hear the difference between \"my,\" \"your,\" \"his,\" and \"our\" — start with two (\"This is my head. This is your head. Where is your head? Where is my head?\") then add one at a time: his, our, their. If you notice OTHER differences along the way — like \"my head\" versus \"our headS\" — don't worry about those yet; pointing to the correct person's body part is genuinely all that matters today. If your host language has standalone words for \"mine,\" \"yours,\" etc., add those too if they're commonly used."},
      {name:"Wrap up Game 3: record and log", game:"3: Body Parts — Yours, Mine, Etc.", needsRecording:true, description:"Record a sample and log the possessive forms (my, your, his, our, their) using the area below."},
      {name:"Play Game 4: Stroking His Brother's Foot! Etc.", game:"4: Stroking His Brother's Foot, Etc.", needsRecording:false, description:"Arrange your doll family again, viewed from one member's perspective — say, the little girl's, with her brothers and parents around her. From her perspective: \"Where is her mother's nose? Wash her younger brother's ears. Touch her sister's fingers. Look at her father's legs.\" Then switch perspectives — try the mother's view using her son, daughter, husband, and so on. Sort your cue cards into three separate stacks: actions, family relationships, and body parts. Draw one card from each stack — say you draw \"hit,\" \"brother,\" and \"foot\" — and say the resulting sentence: \"Hit his brother's foot.\" Keep drawing three-card combinations this way until you've worked through most of all three stacks."},
      {name:"Wrap up Game 4: record", game:"4: Stroking His Brother's Foot, Etc.", needsRecording:true, description:"A two-minute recorded sample using the area below — this game combines words you already know in new combinations, so there's nothing new to log."},
      {name:"Play Game 5: Take the Broom, Touch the Chair, and Look at the Pan!", game:"5: Take the Broom, Touch the Chair", needsRecording:false, description:"Spread out all the toy furniture and household items gathered across previous meetings. The nurturer combines today's and earlier actions with these objects: \"Take the broom. Touch the chair. Look at the pan.\" and so on, mixing freely."},
      {name:"Wrap up Game 5: record", game:"5: Take the Broom, Touch the Chair", needsRecording:true, description:"Record a sample using the area below — no new vocabulary here, just fresh combinations of things you already know."},
      {name:"Play Game 6: Cartoon Bubbles", game:"6: Cartoon Bubbles", needsRecording:false, description:"Continue your bubble pictures with a few more common social phrases: apologizing and accepting an apology, speaking to someone at the door, and interacting with beggars. Ask questions like \"Who is colliding? Who fell? Who is saying I'm sorry? Who is saying, that's okay?\" Also work in a word for \"visit\" — \"Where is the woman who is visiting her friend?\" or \"Who is visiting?\" — and consider adding \"guest\" and \"host\"/\"hostess\" if they come up naturally."},
      {name:"Wrap up Game 6: record and log", game:"6: Cartoon Bubbles", needsRecording:true, description:"Record a sample and log the new bubble-picture expressions using the area below."}
    ],
    checkup:"Were you listening intensely and thinking about meaning, without commentating out loud? Was the nurturer speaking only in the target language, the whole time?"
  },
  7: {
    purpose:"A milestone meeting — by now you're on your way to understanding somewhere around 150 words from your host world, and it's worth pausing to genuinely notice that. Six games: a personal one where your nurturer shares their own family, a big comprehensive review of everything so far, then colors and sizes for the first time, and a strengthening pass through your bubble pictures. Worth keeping in mind: recognizing a word right now doesn't mean you understand it the way a host person does yet — that comes from experiencing it many more times in many more settings. For now, each word is like a hook you'll keep hanging more meaning on as you go.",
    technique:"Same Rough-and-Ready Dozen approach throughout. Game 1 is a genuine step beyond pure play, into more of a normal, personal connection with your nurturer — treat it that way rather than as just another vocabulary drill.",
    materials:"Photos of your nurturer's own family (if sharing personal family photos isn't culturally appropriate for your nurturer, dolls, stick figures, or generic pictures representing a family work just as well); a large table surface with every object, drawing, or photo used in any game so far spread out on it; your cue cards for room locations, location words, and actions, to help the nurturer make sure nothing gets missed; construction paper cut into small and large pieces in as many colors as you can manage (crayons or colored pencils on white paper work if you're short on colored paper); other objects that naturally come in colored sets — candies, colored pencils, small toy cars, paper clips, tacks, balls; your continuing bubble-picture pages 1 through 3, and puppets if useful.",
    steps:[
      {name:"Play Game 1: Nurturer's Family", game:"1: Nurturer's Family", needsRecording:false, description:"Your nurturer brings photos of their own real family this time, saying who's who — \"this is my father, this is my sister,\" and so on — the same technique as Meeting Plan 5's family game, but genuinely personal now rather than practice dolls. This is a real step beyond play, into an actual normal connection with your nurturer."},
      {name:"Wrap up Game 1: record and log", game:"1: Nurturer's Family", needsRecording:true, description:"Record a sample and log the nurturer's family members using the area below."},
      {name:"Play Game 2: Grand Refreshing of Main Words", game:"2: Grand Refreshing of Main Words", needsRecording:false, description:"A genuinely big comprehensive review — the nurturer uses vocabulary from every meeting so far, prompted by everything spread out on the table plus the parts and places in the room. She gives commands or asks \"where is\" in random order, sometimes combining two things into one command (\"Take the spider and run to the window\"). She checks through her stack of cue cards as she goes to make sure nothing important gets missed, and can remove objects from the table once they've come up."},
      {name:"Wrap up Game 2: record", game:"2: Grand Refreshing of Main Words", needsRecording:true, description:"Record a sample of this review using the area below — pure review, so nothing new to log here."},
      {name:"Play Game 3: Getting Colorful", game:"3: Getting Colorful", needsRecording:false, description:"Colors, for the first time — introduced the same Rough-and-Ready Dozen way as everything else. \"Where is the red paper? Where is the blue paper?\" and so on, using your cut colored paper pieces."},
      {name:"Wrap up Game 3: record and log", game:"3: Getting Colorful", needsRecording:true, description:"Record a sample and log the new color words using the area below."},
      {name:"Play Game 4: Colors in Different Sizes", game:"4: Colors in Different Sizes", needsRecording:false, description:"Add size words on top of colors: \"This is a large white paper. This is a small white paper. Where is the large red paper? Take the small white paper.\""},
      {name:"Wrap up Game 4: record and log", game:"4: Colors in Different Sizes", needsRecording:true, description:"Record a sample and log \"large\" and \"small\" using the area below."},
      {name:"Play Game 5: Other Colored Stuff", game:"5: Other Colored Stuff", needsRecording:false, description:"Apply colors and sizes to other objects that naturally come in colored sets — candies, toy cars, pencils, balls, and similar. Briefly introduce any genuinely new object words that come up (like \"car\" or \"ball\") along the way. Ask about combinations: \"Where is the small yellow ball? Where is the big brown horse? Where is the small blue chair?\" Then move to full commands combining everything: \"Put the green pen under the small white paper. Put the red car behind the large green paper.\""},
      {name:"Wrap up Game 5: record and log", game:"5: Other Colored Stuff", needsRecording:true, description:"Record a sample and log any new object words using the area below."},
      {name:"Play Game 6: Cartoon Bubbles, Strengthening", game:"6: Cartoon Bubbles, Strengthening", needsRecording:false, description:"Strengthen everything learned across pages 1-3 of your bubble pictures so far — \"Who is sneezing? Who is saying, what time is it? Who is saying, excuse me?\" You can optionally add a couple of related new options here too, like what to say if you don't want to give to a beggar (or if you do, or if you are the beggar), or what to say if you don't want someone knocking at the door to come in. Keep discussion of the pictures minimal — puppets can help convey the situation without needing to explain it in words."},
      {name:"Wrap up Game 6: record", game:"6: Cartoon Bubbles, Strengthening", needsRecording:true, description:"Record a sample using the area below, logging any of the optional new phrases if you added them."}
    ],
    checkup:"Were you listening intensely and thinking about meaning, without commentating out loud? Was the nurturer speaking only in the target language, the whole time?"
  },
  8: {
    purpose:"Ten games — the biggest meeting yet. Give and take grows into a genuinely rich combination game (mixing color, size, and who's receiving something), then pronouns get added as recipients, then throw and show join in. From there the meeting shifts into drinks (with pouring), then a big set of foods (with eating, cutting, and cooking), before combining everything together in one large game, finishing with a bubble-picture strip on buying and selling.",
    technique:"Same Rough-and-Ready Dozen throughout. Game 1B deliberately reuses toy animals you remember only weakly, alongside some you know well — this is a genuine, built-in way of reinforcing exactly the words that didn't fully stick the first time, not just introducing new ones. When a game varies several details at once (color, size, and recipient, for instance), expect some GPs to need more time keeping it all straight than others — that's normal, not a sign anything's wrong.",
    materials:"Puppets or stuffed animals for the opening demonstration; small and large colored candies, or buttons, beads, or colored paper clips in two sizes (reuse the materials from Meeting Plan 7's Game 5 if you still have them); your toy animals, especially any you remember only weakly; your doll family, optionally enriched with a few more dolls (more sons, daughters, siblings, older and younger); a range of local drinks — water, milk, juice, tea, coffee, soft drinks — with appropriate cups, glasses, or teacups, or reusable stand-in props (a washed empty milk or juice box, a dry teabag in a cup, a bag of instant coffee, a washed empty soda can, a small water bottle — worth keeping for future meetings too); real or toy foods covering fruits (about a dozen), vegetables (about a dozen), basic foods (rice, bread, oil, flour, sugar, salt), and dairy/protein foods (meat, cheese, butter, fish, yogurt, nuts, seeds); a toy cutting board and knife; a toy stovetop and pot; a bubble-picture strip on buying and selling.",
    steps:[
      {name:"Play Game 1A: Puppets Give and Take", game:"1A-1B: Give and Take", needsRecording:false, description:"First, a pure demonstration using a puppet assistant — the nurturer gives instructions directly to the puppet: \"Take the red candy. Give the red candy to the dog.\" She can keep instructing the puppet for as long as needed until it feels like the meaning of \"give\" and \"take\" is clear."},
      {name:"Play Game 1B: Giving to Animals", game:"1A-1B: Give and Take", needsRecording:false, description:"Now GPs do it themselves. The nurturer gives instructions combining color, size, and which animal receives something: \"Give a large red candy to the horse. Give a small green candy to the dog.\" Since several details are being varied at once, some GPs will naturally need more time to keep everything straight — that's expected. This is also a good moment to bring back toy animals you only remember weakly alongside ones you know well, reinforcing exactly the words that didn't fully stick the first time."},
      {name:"Wrap up Games 1A & 1B: record and log", game:"1A-1B: Give and Take", needsRecording:true, description:"Record a sample and log \"give\" and \"take\" using the area below."},
      {name:"Play Game 2: Giving to Someone's Animals", game:"2: Giving to Someone's Animals", needsRecording:false, description:"Add possessives to who's receiving something: \"Give a small yellow candy to my cat. Give a big brown candy to his cow.\""},
      {name:"Wrap up Game 2: record and log", game:"2: Giving to Someone's Animals", needsRecording:true, description:"Record a sample and log the possessive forms used using the area below."},
      {name:"Play Game 3: Giving to Family Members", game:"3: Giving to Family Members", needsRecording:false, description:"Set up your doll family again — feel free to enrich it with a few more dolls (more sons, daughters, siblings, older and younger) if useful, following the usual Rough-and-Ready Dozen rules for any genuinely new words this introduces. Keep giving candies to animals, but now also to family members: \"Give the dog a candy. Give the girl's younger brother a candy.\" Mix animals and family members randomly together rather than doing one block then the other."},
      {name:"Wrap up Game 3: record and log", game:"3: Giving to Family Members", needsRecording:true, description:"Record a sample and log any new family terms using the area below."},
      {name:"Play Game 4: Add Ourselves", game:"4: Add Ourselves", needsRecording:false, description:"Add pronoun recipients — you, me, my, our: \"Give me a large blue candy. Give the boy's father a small green candy. Give us a small brown candy.\" If this feels like too much at once, it's fine to start with just one action word and one fixed object, adding the pronouns one at a time: \"Give me the button, give yourself the button, give me the button, give her the button...\" — then bring in other objects and people once the pronouns themselves are solid."},
      {name:"Wrap up Game 4: record and log", game:"4: Add Ourselves", needsRecording:true, description:"Record a sample and log the pronoun forms using the area below."},
      {name:"Play Game 5: Giving, Throwing, Showing", game:"5: Giving, Throwing, Showing", needsRecording:false, description:"Add \"throw\" and \"show,\" then mix them in with give and take: \"Throw me a candy. Show the horse a small brown candy.\""},
      {name:"Wrap up Game 5: record and log", game:"5: Giving, Throwing, Showing", needsRecording:true, description:"Record a sample and log \"throw\" and \"show\" using the area below."},
      {name:"Play Game 6: Drinking and Pouring Different Liquids", game:"6: Drinking and Pouring Liquids", needsRecording:false, description:"Introduce local drinks with the Rough-and-Ready Dozen — water, milk, juice, tea, coffee, soft drinks, and however many types of fruit juice are useful to you. Start with two and add one at a time as always. Then the nurturer gives commands: \"Drink some milk. Drink some water.\" Once that's solid, add \"pour\": \"Pour me some juice. Pour the girl's brother some juice. Drink the Pepsi from the can. Pour the tea into the bottle. Pour the tea into the teacup. Drink the water from the glass.\" Keep mixing pouring and drinking together rather than doing each separately."},
      {name:"Wrap up Game 6: record and log", game:"6: Drinking and Pouring Liquids", needsRecording:true, description:"Record a sample and log the drinks plus \"drink\" and \"pour\" using the area below."},
      {name:"Play Game 7: Foods", game:"7: Foods", needsRecording:false, description:"The nurturer asks \"Where is the carrot? Where is the egg?\" and similar, working toward at least fifteen food items — roughly a dozen fruits and a dozen vegetables is a good target, filling in with basic foods (rice, bread, oil, flour, sugar, salt) or dairy/protein foods (meat, cheese, butter, fish, yogurt, nuts, seeds) wherever a full set of twelve isn't practical. Try to include the everyday foods that are actually part of your nurturer's daily life. Once a good set is established, introduce \"eat,\" \"cut,\" and \"cook,\" and have GPs eat, cut, or cook different items using a toy cutting board/knife and toy stovetop/pot."},
      {name:"Wrap up Game 7: record and log", game:"7: Foods", needsRecording:true, description:"Record a sample and log all the new food words plus eat/cut/cook using the area below — this meeting is a good chance to add a genuinely healthy number of new words."},
      {name:"Play Game 8: Eating and Drinking and Giving and Taking", game:"8: Eating, Drinking, Giving, Taking", needsRecording:false, description:"A big combination game: the nurturer mixes instructions to drink or pour liquids, eat/cut/cook foods, and give/take/throw/show/touch them to and from one another — pulling together essentially everything from this entire meeting into one continuous, varied game."},
      {name:"Wrap up Game 8: record", game:"8: Eating, Drinking, Giving, Taking", needsRecording:true, description:"Record a sample using the area below — this is pure combination of words you already know, so nothing new to log."},
      {name:"Play Game 9: Cartoon Bubble Game — Buying and Selling", game:"9: Cartoon Bubble Game", needsRecording:false, description:"Work through the bubble-picture strip on buying and selling from your graphics packet (or the equivalent Lexicarry strip, if you're using that resource)."},
      {name:"Wrap up Game 9: record and log", game:"9: Cartoon Bubble Game", needsRecording:true, description:"Record a sample and log the new buying/selling expressions using the area below."}
    ],
    checkup:"Were you listening intensely and thinking about meaning, without commentating out loud? Was the nurturer speaking only in the target language, the whole time?"
  },
  9: {
    purpose:"Seven games, including two genuinely significant milestones: taking photos of yourselves doing everyday actions (prepped now for direct use in Meeting Plan 10), and — for the first time — actually introducing \"yes\" and \"no.\" There's also a built-in \"gap-filling\" concept here worth carrying forward: at any point in your meetings, if you notice a vocabulary gap (a missed family term, a food you keep needing), it's fine to pause and fill it in with a brief, informal Rough-and-Ready Dozen right then, rather than waiting for a dedicated meeting.",
    technique:"Same Rough-and-Ready Dozen throughout. Note that the source material's own numbering skips from Game 3b straight to Game 5a — that's preserved here exactly as written rather than renumbered, in case you're cross-checking against other materials.",
    materials:"Foods and drinks from Meeting Plan 8; a cutting board, knife, toy sink, and toy stove if available (cuttable toy foods with velcro centers work especially well here); a fork, spoon, knife, and scissors; a piece of fruit and a drink with a cup for the photo-taking game; every object used across previous meetings, spread out on a table for the true/false game; a range of clothing items — aim for a dozen or more distinct pieces, real clothing where practical, supplemented with pictures or paper dolls, and be mindful of what is and isn't appropriate to show or discuss in a mixed group (underwear, for instance, may not be appropriate).",
    steps:[
      {name:"Play Game 1: Eat, Drink, and Be Merry", game:"1: Eat, Drink, and Be Merry", needsRecording:false, description:"Add more action words with the Rough-and-Ready Dozen: prepare, use, lift, carry, wait — practice these first with just a few food items to keep things manageable. Once all the new action words are in, combine them freely with every food and drink from Meeting Plan 8: \"Eat the carrot. Drink the yogurt. Lift the salt. Cook the meat. Use the fork.\""},
      {name:"Wrap up Game 1: record and log", game:"1: Eat, Drink, and Be Merry", needsRecording:true, description:"Record a sample and log the new action words using the area below."},
      {name:"Play Game 2: Gap-Filling (optional)", game:"2: Gap-Filling", needsRecording:false, description:"An open, optional activity — at any point across your meetings, you may notice a vocabulary gap worth filling in: maybe a food you keep needing, a plural form, or something specific to your everyday life that never quite came up. Take a few minutes here to fill in whatever gaps you've noticed, using the same Rough-and-Ready Dozen technique as always."},
      {name:"Wrap up Game 2: record and log", game:"2: Gap-Filling", needsRecording:true, description:"If you played this optional game, record a sample and log whatever new words came up using the area below."},
      {name:"Play Game 3a: Using Things to Do Things", game:"3a: Using Things to Do Things", needsRecording:false, description:"Introduce using an object as a tool for an action: \"Cut the carrot with the fork. Eat the rice with a spoon. Eat the carrot with your hand.\" Scissors can be added here too — \"cut the paper with scissors.\""},
      {name:"Wrap up Game 3a: record and log", game:"3a: Using Things to Do Things", needsRecording:true, description:"Record a sample and log any new tool words (like scissors) using the area below."},
      {name:"Play Game 3b: Photos of Us in Action — Prep for Meeting 10", game:"3b: Photos of Us in Action, Prep", needsRecording:false, description:"An important prep activity — everything recorded here gets used directly in Meeting Plan 10, Game 7B. The nurturer gives each GP a mixed-up sequence of commands (cue cards help keep the order varied): eat a fruit, drink from a cup, pour into a cup, cut with a knife, cut with scissors, point at something, wash a fruit or cup. As each person performs an action, take their photo — and take photos of the nurturer doing every action too. Print these afterward and organize them by action (a page of various people eating, a page of various people drinking, and so on) so they're ready for Meeting Plan 10."},
      {name:"Wrap up Game 3b: record and log", game:"3b: Photos of Us in Action, Prep", needsRecording:true, description:"Record the nurturer giving the action commands and describing each person doing them, using the area below."},
      {name:"Play Game 5a: Locations (True-False) — Yes and No", game:"5a: Locations, True-False", needsRecording:false, description:"A genuine milestone — this is where \"yes\" and \"no\" actually get introduced, along with whatever gesture goes with each in your host culture (nodding, for instance). Spread every object used so far randomly across a table. The nurturer describes where things are — sometimes truthfully, sometimes deliberately falsely. If she's correct, GPs say \"yes.\" If she's wrong, GPs say \"no,\" and the nurturer agrees and corrects herself — \"No, the cat is not in the basket; the cat is beside the basket\" — which naturally introduces a negative form too. Record the whole activity as you go."},
      {name:"Wrap up Game 5a: record and log", game:"5a: Locations, True-False", needsRecording:true, description:"Log \"yes,\" \"no,\" and the negative form used using the area below. Worth knowing: once you have a recording of yes and no, you can add them to this app's Answer Recorder (in Review setup) — real target-language yes/no responses that play back automatically whenever you get a Grid Review answer right or wrong."},
      {name:"Play Game 5b: Description of Objects in Locations", game:"5b: Description of Objects in Locations", needsRecording:false, description:"Take a photo of the whole table arrangement from Game 5a. The nurturer describes the arrangement using location words you already know — this one is really about producing a solid recording for later listening practice, more than an interactive game in the moment."},
      {name:"Wrap up Game 5b: record", game:"5b: Description of Objects in Locations", needsRecording:true, description:"Record the nurturer's full description using the area below, to revisit later."},
      {name:"Play Game 6: Clothing and More Body Parts", game:"6: Clothing and More Body Parts", needsRecording:false, description:"Introduce clothing with the Rough-and-Ready Dozen, aiming for sets of about twelve items if you have that many distinct pieces available. Bring real clothing, or use a male and female GP as models — if you use models, this is also a natural moment to add a few more body parts (beard, elbow, eyeglasses, and similar). Be thoughtful about what is and isn't appropriate to show or discuss in your particular group — some clothing items may not be appropriate in a mixed setting."},
      {name:"Wrap up Game 6: record and log", game:"6: Clothing and More Body Parts", needsRecording:true, description:"Record a sample and log the new clothing (and any new body-part) words using the area below."}
    ],
    checkup:"Were you listening intensely and thinking about meaning, without commentating out loud? Was the nurturer speaking only in the target language, the whole time?"
