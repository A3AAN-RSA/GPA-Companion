  10: {
    purpose:"Nine games in the order the source material actually presents them — worth knowing upfront, since the numbering itself jumps around (Game 7a is directly followed by \"Game 10,\" with \"Game 8\" coming last), which is preserved here exactly rather than renumbered. Refresh possessives, review bubble pictures, add a good number of new action verbs, learn \"to\" and \"from,\" introduce plurals, extend the ongoing photo game with pronouns, and optionally start on \"put on\"/\"take off.\"",
    technique:"Same Rough-and-Ready Dozen throughout. One real warning from the source material worth taking seriously: a documented case exists where growing participators reached Phase 2 unable to use \"my, your, the girl's\" and similar possessive forms at all, because a coach had decided this wasn't important enough to focus on. It is — don't let Game 1 get shortchanged.",
    materials:"Objects from earlier meetings, for refreshing possessives; your continuing Lexicarry or bubble-picture pages 1-3; a few simple props for acting out new verbs — a book, an apple, paper, a pencil and eraser, a ball or toy, a broom or similar; a variety of objects from previous meetings plus your room-part picture cards; familiar objects, animals, or dolls on a table, with a small supply of candies, matches, or buttons for each GP and a few of the same items already placed with each object on the table; paired rows of single objects and small groups of the same objects (or pictures) for plurals; every photo taken in previous meetings; the specific action-organized photos from Meeting Plan 9's Game 3b; a few easily removable clothing items — shoes, sandals, a hat, headscarf, glasses, jacket or sweater, ring, gloves, bracelet — or a doll with clothing that can be put on and taken off.",
    steps:[
      {name:"Play Game 1: Bee's Wing, Pot's Lid — Refresh and Strengthen Words", game:"1: Bee's Wing, Pot's Lid", needsRecording:false, description:"Refresh and strengthen possessive constructions using commands and questions like \"Where are my boots? Touch our elbows. Point to the bee's wing. Pat the pot's lid.\" Cue cards can help the nurturer keep coming up with fresh combinations. This is genuinely important to give real time to — it's easy to underestimate."},
      {name:"Wrap up Game 1: record and log", game:"1: Bee's Wing, Pot's Lid", needsRecording:true, description:"Record a sample using the area below."},
      {name:"Play Game 2: Cartoon Bubbles, Refresh", game:"2: Cartoon Bubbles, Refresh", needsRecording:false, description:"Pure review — refresh the expressions from pages 1-3 of your Lexicarry or bubble-picture pages, no new content."},
      {name:"Wrap up Game 2: record", game:"2: Cartoon Bubbles, Refresh", needsRecording:true, description:"Record a sample using the area below."},
      {name:"Play Game 3: More Things We Do", game:"3: More Things We Do", needsRecording:false, description:"Rough-and-Ready Dozen style, introduce a good batch of new action words: listen, read, think, chew, play, work, write, sleep, wake up, swallow, draw, erase. As always, start with two — the nurturer physically acts each one out at first — then add one new action at a time."},
      {name:"Wrap up Game 3: record and log", game:"3: More Things We Do", needsRecording:true, description:"Once the last action has been added, record that final round using the area below, and log every new action word."},
      {name:"Play Game 4: Combine New Actions with Old — Actions with Objects and Places", game:"4: Combine New with Old Actions", needsRecording:false, description:"The nurturer gives commands mixing today's new actions with objects and places from earlier meetings: \"Sleep on the floor. Write on the large red paper. Chew the fish. Swallow the milk. Draw with the pen on the book.\" Repeat each new action across a genuine variety of old objects and places, not just once each."},
      {name:"Wrap up Game 4: record", game:"4: Combine New with Old Actions", needsRecording:true, description:"Record all of this, or a few minutes of it, using the area below."},
      {name:"Play Game 5: To and From, Alone", game:"5: To and From, Alone", needsRecording:false, description:"A Listen & Do game teaching \"to\" and \"from.\" Place familiar objects, animals, and dolls on the table. Each GP gets a small supply of candies, matches, or buttons, and each item on the table already has a few of the same. The nurturer gives full commands first: \"Give a candy to the elephant. Take a candy from the cat.\" Once that's familiar, she starts dropping the action word entirely, leaving just the abbreviated form — \"from the horse; to the mother\" — which forces you to actually rely on \"to\" and \"from\" themselves to know what's meant, rather than the verb doing the work."},
      {name:"Wrap up Game 5: record and log", game:"5: To and From, Alone", needsRecording:true, description:"Record a sample and log \"to\" and \"from\" using the area below."},
      {name:"Play Game 6: Alone or in Groups (Singular/Plural)", game:"6: Singular/Plural", needsRecording:false, description:"Set up a row of single individual objects (a dog, a cat, a chicken) and a second row of small groups of the same kinds of objects (dogs, cats, chickens) — pictures work fine for the plurals if needed. The nurturer asks \"Where is the dog?\" and \"Where are the dogs?\", contrasting singular and plural forms directly."},
      {name:"Wrap up Game 6: record and log", game:"6: Singular/Plural", needsRecording:true, description:"Record a sample and log the plural forms using the area below. It's worth having someone take a photo of exactly which items your group used, as a permanent reference alongside the recording."},
      {name:"Play Game 7a: Continue \"Photos of Us in Action\"", game:"7a: Photos of Us in Action", needsRecording:false, description:"Use every photo taken in this and earlier meetings, with the nurturer referring to I, you, we, he, they, and so on — continuing to build out this ongoing photo game with the full range of pronouns."},
      {name:"Wrap up Game 7a: record", game:"7a: Photos of Us in Action", needsRecording:true, description:"Record all of this using the area below."},
      {name:"Play Game 10: \"Photos of Us in Action,\" Part 2", game:"10: Photos of Us in Action, Part 2", needsRecording:false, description:"This time, use specifically the photos organized by action back in Meeting Plan 9's Game 3b (eating, drinking, pouring, cutting with a knife, cutting with scissors, pointing, washing) for pure \"understand and point.\" The nurturer might ask, \"In which picture am I eating an apple? In which picture are you pointing at a sweet potato? In which picture is she cutting a mango with scissors?\" Look back at Meeting Plan 9, Game 3b if it's not clear which photos these are."},
      {name:"Wrap up Game 10: record and log", game:"10: Photos of Us in Action, Part 2", needsRecording:true, description:"Record a sample using the area below."},
      {name:"Play Game 8: Clothe and Unclothe (optional)", game:"8: Clothe and Unclothe", needsRecording:false, description:"If you have time, introduce \"put on\" and \"take off\" by demonstrating them. The nurturer tells GPs to put on and take off a number of easily removable clothing items — shoes, sandals, a hat, headscarf, glasses, a jacket or sweater, a ring, gloves, a bracelet. A doll with removable clothing works just as well if that's easier. This game is meant to be repeated in later meetings whenever it's useful, not just done once."},
      {name:"Wrap up Game 8: record and log", game:"8: Clothe and Unclothe", needsRecording:true, description:"If you played this optional game, record a sample and log \"put on\" and \"take off\" using the area below."}
    ],
    checkup:"Were you listening intensely and thinking about meaning, without commentating out loud? Was the nurturer speaking only in the target language, the whole time?"

  11: {
    purpose:"This meeting may feel a bit sparse compared to others — that's expected, not a sign you're behind. Emotion words genuinely take longer to settle in than names of objects and actions, so don't rush them. Eight games: a real listening-discrimination exercise, emotion words built up through several layers of combination (with dolls, then family, then body parts), \"power tool\" phrases for asking about language itself, and a set of tool names. Worth knowing: you're now just four meeting plans away from your first actual talking games.",
    technique:"A genuinely important idea underlies Game 1 specifically, worth understanding before you start: accurate pronunciation comes from training your ears, not your eyes. If two words sound identical to you right now, seeing how they're spelled won't actually help you hear the difference — real experiments back this up. Trust what you hear over what you'd imagine the spelling should sound like; your eyes and ears take completely different paths in the brain. If you ever catch yourself having said the wrong similar-sounding word by accident (like saying \"jump\" when you meant \"cat\"), that's not a failure — it's a genuine discovery of a sound distinction you didn't know existed yet, and a perfect opportunity for a listening-contrast game like Game 1. For the emotion-word games, the nurturer doesn't need to translate the feelings pictures into precise home-world equivalents — she can just interpret each face however she naturally sees it, and let the words mean what they mean in her world. For any longer sentences in Games 5 and 8, break them into natural chunks with short pauses for GPs who need it — understanding the gist is what matters, not catching every detail.",
    materials:"Pairs or small groups of words that currently sound identical or very similar to you, but are genuinely distinct to native speakers (only use words you've already encountered in earlier listening games, never brand new ones here) — cue cards for these should already exist from when they were first introduced; your graphics packet's feelings page (roughly twenty concepts available — aim for twelve to twenty depending on time, and make cue cards from them as you go); dolls representing man, woman, boy, and girl; your doll family; the Power Tools pictures from your resource packet (phrases like \"what is this?\", \"please repeat that\", \"I don't understand\", \"I don't know\", \"please speak more slowly,\" plus bubble pictures of someone speaking too quietly or too fast); common tools, real or toy — hammer, screwdriver, saw, hatchet, scissors, screws, nails, hooks, nuts, wrench, pliers, string/rope/clothesline, knot, glue, tape, wire, lock, keys.",
    steps:[
      {name:"Play Game 1: \"Hear the Difference?\" (10 minutes)", game:"1: Hear the Difference?", needsRecording:false, description:"A genuine listening-discrimination exercise, not a new-vocabulary game — only use word pairs already familiar to you from earlier listening games (this isn't where words are first introduced). If you've noticed a pair of words that sound identical to you but shouldn't (verify with a native speaker that they really are distinct), this is the moment to work on it. The nurturer pronounces the words repeatedly in random order — if the confused pair was \"jump\" and \"cat,\" she says \"cat\" and you point at the toy cat, she says \"jump\" and you jump. Don't worry if you're not very accurate at first; that's exactly what this game exists to improve."},
      {name:"Wrap up Game 1: record", game:"1: Hear the Difference?", needsRecording:true, description:"Record a sample using the area below."},
      {name:"Play Game 2a: \"Feeling Good, Feeling Bad...\"", game:"2a-2b: Feeling Good, Feeling Bad", needsRecording:false, description:"Introduce feeling and emotion words with the Rough-and-Ready Dozen, ideally first in command form: \"Be happy. Be angry. Be sly.\" Start with two, add one at a time as always, and display each new feeling's cue card as it's introduced. Aim for somewhere between twelve and twenty concepts depending on your time — your graphics packet has about twenty to choose from, and it's fine to split them across two blocks if you use them all."},
      {name:"Play Game 2b: \"Feeling Good, Feeling Bad...\" Continued", game:"2a-2b: Feeling Good, Feeling Bad", needsRecording:false, description:"Once you can respond to a dozen or more feeling commands, shift to asking about the pictures instead: \"Who is angry? Who is sad?\" using the cue cards from Game 2a. This should move quickly since the concepts and words are already familiar."},
      {name:"Wrap up Games 2a & 2b: record and log", game:"2a-2b: Feeling Good, Feeling Bad", needsRecording:true, description:"Record a sample and log every feeling word covered using the area below."},
      {name:"Play Game 3: \"Make It True?\"", game:"3: Make It True?", needsRecording:false, description:"The nurturer says something like \"The girl is kind,\" and you place the matching \"kind\" feeling cue card next to the girl doll — physically making the statement true, the same way \"Make It True\" games have worked in earlier meetings."},
      {name:"Wrap up Game 3: record", game:"3: Make It True?", needsRecording:true, description:"Record a sample using the area below."},
      {name:"Play Game 4: \"Feeling Good, Feeling Bad...\" — All in the Family", game:"4: Feelings, All in the Family", needsRecording:false, description:"The same pattern, now applied to your doll family: \"Where is the sad woman's daughter? Where is the sleepy woman's husband?\" — combining feelings with the family-relationship words from earlier meetings."},
      {name:"Wrap up Game 4: record", game:"4: Feelings, All in the Family", needsRecording:true, description:"Record a sample using the area below."},
      {name:"Play Game 5: Feelings, Clothes, and Body Parts", game:"5: Feelings, Clothes, and Body Parts", needsRecording:false, description:"Extend the pattern further, mentioning body parts of dolls alongside the feeling they're imagined to have: \"Where is the frightened man's hat? Where is the angry boy's chin?\" These are genuinely long sentences — it's fine if some of the details slip past you, as long as you understand enough to respond correctly. This is exactly the skill of listening for the gist even when some details are out of reach. Break longer sentences into natural chunks with short pauses if that helps."},
      {name:"Wrap up Game 5: record", game:"5: Feelings, Clothes, and Body Parts", needsRecording:true, description:"Record a sample using the area below."},
      {name:"Play Game 6: Cartoon Bubble Game — \"How Do You Say, 'How Do You Say?'\"", game:"6: Power Tools", needsRecording:false, description:"Introduce \"power tools\" — phrases that let you keep learning more language on your own: \"What is this? What are they doing? Please repeat that. I don't understand. I don't know. Please speak more slowly.\" Using your Power Tools bubble pictures, the nurturer asks \"Who is saying, 'what is this?' Who is saying, 'please repeat that'?\" and so on, introducing one phrase at a time. These matter more than usual right now — you're approaching the point where you'll start actively speaking, and these phrases are exactly what you'll need to keep learning once you do."},
      {name:"Wrap up Game 6: record and log", game:"6: Power Tools", needsRecording:true, description:"Record a sample and log every power-tool phrase using the area below — these are genuinely worth having solid."},
      {name:"Play Game 7: \"Hammer, Hatchets, Etc.\"", game:"7: Hammer, Hatchets, Etc.", needsRecording:false, description:"Learn tool names with the Rough-and-Ready Dozen — hammer, screwdriver, saw, hatchet, scissors, screws, nails, hooks, nuts, wrench, pliers, string, rope or clothesline, knot, glue, tape, wire, lock, keys. Real tools or toy versions both work."},
      {name:"Wrap up Game 7: record and log", game:"7: Hammer, Hatchets, Etc.", needsRecording:true, description:"Record a sample and log the tool names using the area below."},
      {name:"Play Game 8: \"Give Tools to People Who Feel Happy, Sad...\"", game:"8: Give Tools by Feeling", needsRecording:false, description:"Combine today's tools with today's emotion words: \"Give the hammer to the sad man. Give the saw to the surprised girl.\" It's genuinely fine to reuse \"old\" vocabulary from earlier in this same meeting when combining with something new — it doesn't always need to come from a previous day. Break longer sentences into natural pieces with pauses where needed."},
      {name:"Wrap up Game 8: record", game:"8: Give Tools by Feeling", needsRecording:true, description:"Record a sample using the area below."}
    ],
    checkup:"Were you listening intensely and thinking about meaning, without commentating out loud? Was the nurturer speaking only in the target language, the whole time?"
  },
  12: {
    purpose:"As you go on, there's a real, ongoing tension between strengthening what you already know and encountering enough new material — meetings like this one deliberately lean toward strengthening, so expect a smaller-than-average amount of brand-new vocabulary here, by design. Nine games: pests and \"kill/hit,\" a genuinely rich review game deliberately mixing lots of already-known words together, more photo work, numbers for the first time (building from 1-10 all the way up through the hundreds via money), a photo-matching game, and finishing off last meeting's power-tool phrases.",
    technique:"Same Rough-and-Ready Dozen throughout. If \"kill\" doesn't sit right for your context, \"hit\" or \"touch\" work just as well as substitutes — the point is the physical action, not the specific verb. Game 2 is worth calling out specifically: it's designed to combine many actions with many objects at once (more combinations than almost anything before it), precisely so that words you've only weakly held onto so far get a real chance to resurface and stick.",
    materials:"Toys or pictures of commonly-encountered pests — mouse, fly, bee, snake, spider, cockroach, ant, mosquito (being mindful of local sensitivities around some of these); your tools from Meeting Plan 11; optionally bug spray, a flyswatter, a mousetrap, or a water gun (\"shoot with the gun\"); foods, drinks, and dolls (man, woman, boy, girl, baby) plus animals, with cue cards for eat/pour/drink/give/feed/wipe/cut (a straw is a fun optional addition — \"drink the milk with the straw\"); your accumulated photos plus simple line drawings of actions; small objects that come in large countable sets — matches, sunflower seeds, candies, beans, dried anchovies — plus dolls; real or play money for larger quantities; cue cards for action concepts alongside photos of individual group members (from Meeting Plan 1 and the \"people doing\" photos from Meeting Plan 9); your Power Tools cards from Meeting Plan 11.",
    steps:[
      {name:"Play Game 1: \"Kill the Fly with the Hammer!\"", game:"1: Kill the Fly with the Hammer", needsRecording:false, description:"Introduce pests and small creatures with the Rough-and-Ready Dozen, then introduce \"hit\" and \"kill\" the same way. Combine them with tools from Meeting Plan 11: \"Kill the fly with the hammer. Hit the mouse with the hatchet. Kill the spider with the wrench.\" If \"kill\" doesn't feel appropriate for your context, substitute \"hit\" or \"touch\" instead — a common convention is to hit the toy creature and turn it upside-down to represent it being \"killed.\""},
      {name:"Wrap up Game 1: record and log", game:"1: Kill the Fly with the Hammer", needsRecording:true, description:"Record a sample and log the pest names plus hit/kill using the area below."},
      {name:"Play Game 2: Remixing Words for Strengthening", game:"2: Remixing Words for Strengthening", needsRecording:false, description:"A genuinely rich strengthening game — the nurturer instructs GPs to eat, pour, drink, give, wipe or rub (with a cloth), and feed themselves, other GPs, the nurturer, dolls, or animals, cutting foods along the way with a knife, hatchet, scissors, fork, or saw, and eating or feeding them with a fork, spoon, or hand. This has more possible combinations than almost anything so far — a genuine opportunity to bring back words you've only weakly held onto and give them another real chance to stick."},
      {name:"Wrap up Game 2: record", game:"2: Remixing Words for Strengthening", needsRecording:true, description:"Record a sample using the area below — pure combination of known words, so nothing new to log."},
      {name:"Play Game 3: Photos of Us in Action, With Line Drawings", game:"3: Photos with Line Drawings", needsRecording:false, description:"Randomly reuse your earlier photos for new questions: \"In which picture are they eating?\" You can also combine photos of individuals with simple line drawings of actions — the nurturer says \"I am sleeping,\" and you find her photo and pair it with a sleeping line-drawing, building a new kind of \"Make It True\" using photos and drawings together."},
      {name:"Wrap up Game 3: record", game:"3: Photos with Line Drawings", needsRecording:true, description:"Record a sample using the area below."},
      {name:"Play Game 4A: Numbers to Ten", game:"4A: Numbers to Ten", needsRecording:false, description:"Numbers, for the first time. Using small objects that come in large sets (matches work well if that word is already familiar), the Rough-and-Ready Dozen as always: \"These are three matches. These are seven matches. Where are the three matches? Where are the seven matches?\" Add one new quantity at a time until you can understand numbers from one (or zero) through ten."},
      {name:"Wrap up Game 4A: record and log", game:"4A: Numbers to Ten", needsRecording:true, description:"Record a sample and log the numbers 1 through 10 using the area below."},
      {name:"Play Game 4B: Strengthening 1 to 10 — Mixing New with Old", game:"4B: Strengthening 1-10", needsRecording:false, description:"Apply your new numbers to giving: \"Give three fish to the woman. Give five matches to the baby.\" Start with just two numbers (probably one and two) and add one new number at a time, same as always."},
      {name:"Wrap up Game 4B: record", game:"4B: Strengthening 1-10", needsRecording:true, description:"Record a sample using the area below."},
      {name:"Play Game 4C: Bigger Quantities", game:"4C: Bigger Quantities", needsRecording:false, description:"Since quantities like 16 or 60 can't be recognized at a glance the way three or seven can, money makes a genuinely useful stand-in: \"This is 15 pesos. This is 13 pesos. Where are the 13 pesos?\" (substitute your local currency, of course)."},
      {name:"Wrap up Game 4C: record and log", game:"4C: Bigger Quantities", needsRecording:true, description:"Record a sample and log the new number words using the area below."},
      {name:"Play Game 4D: Bigger Quantities, Still", game:"4D: Bigger Quantities, Still", needsRecording:false, description:"Continue the same way as 4C, now with round amounts: 20, 30, 40, 50, 60, 70, 80, 90, 100."},
      {name:"Wrap up Game 4D: record and log", game:"4D: Bigger Quantities, Still", needsRecording:true, description:"Record a sample and log the round-number words using the area below."},
      {name:"Play Game 5: \"Make It True\" with Photos and Actions", game:"5: Photos and Actions", needsRecording:false, description:"Using your cue cards for action concepts alongside photos of individual group members, the nurturer names an action paired with a person — \"Bill is eating\" — and you find the matching action cue card and pair it with Bill's photo."},
      {name:"Wrap up Game 5: record", game:"5: Photos and Actions", needsRecording:true, description:"Record a sample using the area below."},
      {name:"Play Game 6: Cartoon Bubble Game — Finish the Power Tools", game:"6: Finish Power Tools", needsRecording:false, description:"If you didn't fully finish the Power Tools phrases from Meeting Plan 11 (\"What is it? Speak more slowly,\" and similar), finish them here, and strengthen every one you've covered so far."},
      {name:"Wrap up Game 6: record", game:"6: Finish Power Tools", needsRecording:true, description:"Record a sample using the area below."}
    ],
    checkup:"Were you listening intensely and thinking about meaning, without commentating out loud? Was the nurturer speaking only in the target language, the whole time?"
  },
  13: {
    purpose:"Nine games covering a genuinely wide span: a quick numbers refresh, ordinal numbers, then a real shift into geography — countries, continents, nationalities, and languages, tied together with a clever puzzle game about who lives where versus where they're from versus where they want to go. Finishes with two more numbers games, including a full Bingo round using only the numbers you actually know.",
    technique:"Same Rough-and-Ready Dozen throughout. Game 7 is worth understanding ahead of time — it deliberately places nationality drawings in countries other than their own (an Indian person living in Russia, for instance), so that \"who lives here,\" \"who speaks this language,\" \"who is from there,\" and \"who wants to go there\" can each have a genuinely different correct answer, forcing you to track several attributes about the same person independently rather than treating them as automatically linked.",
    materials:"Toy mice or drawings of mice (or any animal you happen to have about ten of); a selection of tools whose names aren't yet strongly known, for reinforcement; a world map; male and female drawings representing a range of nationalities (the Resource Packet has a set) including the nurturer's own nationality, placed on the map deliberately displaced from their home countries for Game 7's puzzle; beans or other small counters plus bingo boards built only from numbers you've already learned.",
    steps:[

function drawGenderLabel(canvas, gender){
  if(!gender) return;
  const ctx = canvas.getContext('2d');
  const text = gender==='M' ? 'Male' : 'Female';
  const barH = Math.max(20, canvas.height*0.13);
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(0, canvas.height-barH, canvas.width, barH);
  ctx.fillStyle = '#fff';
  ctx.font = `bold ${Math.round(barH*0.6)}px sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, canvas.width/2, canvas.height-barH/2);
}
function applyGenderLabelToPhoto(src, gender){
  return new Promise((resolve)=>{
    if(!gender || !src){ resolve(src); return; }
    const img = new Image();
    img.onerror = ()=> resolve(src);
    img.onload = ()=>{
      const canvas = document.createElement('canvas');
      canvas.width = img.width; canvas.height = img.height;
      canvas.getContext('2d').drawImage(img,0,0);
      drawGenderLabel(canvas, gender);
      resolve(canvas.toDataURL('image/jpeg', 0.85));
    };
    img.src = src;
  });
}

async function loadData(){
  try{
    const res = await window.storage.get(STORE_KEY, false);
    if(res && res.value){
      state = JSON.parse(res.value);
    }
  }catch(e){}
  state.profile = state.profile || {};
  state.sessions = state.sessions || [];
  state.words = state.words || [];
  state.orientationDone = state.orientationDone || {};
  state.audioIndex = state.audioIndex || [];
  state.meetingComplete = state.meetingComplete || {};
  state.stepProgress = state.stepProgress || {};
  state.stepDurations = state.stepDurations || {};
  state.activityMaterials = state.activityMaterials || {};
  state.photoLibrary = state.photoLibrary || [];
  state.busyPictures = state.busyPictures || [];
  state.lexicarryPictures = state.lexicarryPictures || [];
  state.alphabet = state.alphabet || [];
  state.answerSounds = state.answerSounds || {know:[], dontknow:[], next:[], finish:[], yes:[], no:[]};
  state.materialsDismissed = state.materialsDismissed || {};
  state.revisionMinutes = state.revisionMinutes || 0;
  state.words.forEach(w=>{
    if(w.iceberg==null){
      if(w.level===2) w.iceberg = 1;
      else if(w.level===1) w.iceberg = 5;
      else w.iceberg = 9;
    }
    // Solo Practice words created before entryType was wired up correctly were tagged 'picture'
    // instead of 'word' — that value never matched any category option, so the dropdown looked
    // right (browsers default to the first <option> when nothing matches) while the underlying
    // data, and the dashboard count reading it, stayed wrong until someone manually touched it.
    if(w.entryType==='picture') w.entryType = 'word';
    // Solo Practice recordings made before articles were split into definite/indefinite are kept
    // as the definite form, so nothing already recorded becomes invisible or needs re-recording.
    if(w.wordSlot==='article') w.wordSlot = 'article_definite';
  });
  state.activityNurturerAudio = state.activityNurturerAudio || {};
  state.activityQuestions = state.activityQuestions || {};
  state.positionActivities = state.positionActivities || {};
  state.actionCombos = state.actionCombos || {};
  state.describedObjects = state.describedObjects || [];
  // Recompute composite labels using the fallback rule (a text descriptor's category is used
  // when its value was left empty) — this fixes existing described objects whose descriptors
  // silently displayed nothing because only the category field had been filled in.
  state.describedObjects.forEach(d=>{
    const recomputed = [d.baseCode, ...(d.descriptors||[]).map(desc=>desc.isPicture?'':descriptorDisplayText(desc)).filter(Boolean)].filter(Boolean).join(' ');
    if(recomputed) d.compositeLabel = recomputed;
  });
  loaded = true;
  render();
}
async function saveData(){
  try{ await window.storage.set(STORE_KEY, JSON.stringify(state), false); }
  catch(e){ console.error('Storage error', e); }
}

function totalHours(){ return state.sessions.reduce((a,s)=>a+(Number(s.duration)||0),0)/60; }
function currentPhaseInfo(){
  const h = totalHours();
  let phase = 1;
  for(let i=1;i<CUM_HOURS.length;i++){ if(h >= CUM_HOURS[i]) phase = i+1; }
  if(phase>6) phase=6;
  const info = PHASE_TARGETS[phase-1];
  const startH = CUM_HOURS[phase-1];
  const endH = phase<6 ? CUM_HOURS[phase] : null;
  return {phase, info, startH, endH, hoursIntoPhase: h-startH};
}

function activeSessionBlockReason(){
  if(liveActivity) return "the activity you're doing";
  if(soloPractice) return 'your solo practice session';
  if(positionPractice) return 'your solo practice session';
  if(actionComboPractice) return 'your solo practice session';
  if(reviewActive) return 'your review session';
  if(gridReviewActive) return 'your grid review session';
  if(alphaReviewActive) return 'your alphabet review session';
  if(alphaGridActive) return 'your alphabet grid review session';

function setTab(id){

function escapeHtml(s){ const d=document.createElement('div'); d.textContent=s||''; return d.innerHTML; }
function entryTypeTag(w){
  const t = effectiveEntryType(w);
  if(t==='word') return '';
  const labels = {phrase:'phrase', description:'description', story:'story', combination:'combination'};
  return `<span class="tag">${labels[t]||t}</span>`;
}
function effectiveEntryType(w){
  const t = w.entryType || 'word';
  const known = ['word','phrase','description','story','combination'];
  return known.includes(t) ? t : 'word';
}
function entryTypeBreakdown(){
  const counts = {word:0, phrase:0, description:0, story:0};
  state.words.forEach(w=>{ const t = effectiveEntryType(w); if(counts[t]!==undefined) counts[t]++; });
  return `Words: ${counts.word} · Phrases: ${counts.phrase} · Descriptions: ${counts.description} · Stories: ${counts.story}`;
}
function totalRecordingsLogged(){
  // Every recording that exists anywhere in the app: words/phrases/descriptions/stories,
  // combination recordings from Solo Practice activities, and every recorded question/command
  // — the full picture of how much has actually been spoken into the app, not just Word Log.
  let total = state.words.filter(w=>w.hasAudio).length;
  Object.values(state.activityQuestions||{}).forEach(list=>{ total += (list||[]).length; });
  Object.values(state.positionActivities||{}).forEach(pa=>{ total += (pa.questions||[]).length; });
  Object.values(state.actionCombos||{}).forEach(ac=>{ total += (ac.questions||[]).length; });
  return total;
}

// ---------- Dashboard ----------
function renderDashboard(c){
  const h = totalHours();
  const {phase, info, startH, endH, hoursIntoPhase} = currentPhaseInfo();
  const meetingsTouched = Object.values(state.meetingComplete).filter(s=>s==='done').length;

  const sessDates = state.sessions.map(s=>s.date).filter(Boolean).sort();
  let weeksElapsed = null;
  if(sessDates.length>=2){
    const first = new Date(sessDates[0]), last = new Date();
    weeksElapsed = Math.max((last-first)/(7*86400000), 1/7);
  }
  const actualPace = weeksElapsed!=null ? h/weeksElapsed : null;
  const statedPace = Number(state.profile.hoursPerWeek)||0;

  let forecastLine = 'Log a couple of sessions (or add your weekly hours in Profile) to see a forecast.';
  let hoursCompareLine = '';
  if(phase===1){
    // Phase 1 has a fixed, known set of 40 meeting plans — completing all of them is the real
    // finish line, regardless of whether that happens to take under or over 100 hours. Each
    // meeting plan's "worth" is weighted by its own estimated length (a longer meeting plan
    // counts for more of the 100-hour budget than a short one), rather than treating all 40
    // as equal. Hours are shown separately below purely as a comparison against that estimate.
    const totalMeetings = 40;
    const weights = meetingPlanHourWeights();
    const doneNs = Object.keys(state.meetingComplete).filter(k=>state.meetingComplete[k]==='done').map(Number);
    const weightedHoursDone = doneNs.reduce((sum,n)=> sum + (weights[n]||0), 0);
    const remainingWeightedHours = Math.max(100-weightedHoursDone,0);

    let currentFinishDateIso = null;
    if(remainingWeightedHours<=0){
      forecastLine = `All ${totalMeetings} of Phase 1's meeting plans are complete!`;
    } else if(weeksElapsed!=null && weightedHoursDone>0){
      const weightedPace = weightedHoursDone/weeksElapsed;
      const weeksNeeded = remainingWeightedHours/weightedPace;
      const finishDate = new Date(Date.now() + weeksNeeded*7*86400000);
      currentFinishDateIso = finishDate.toISOString().slice(0,10);
      const dateStr = finishDate.toLocaleDateString(undefined, {year:'numeric', month:'long', day:'numeric'});
      forecastLine = `Based on the meeting plans you've actually completed so far (${meetingsTouched}/${totalMeetings}), you're on track to finish Phase 1 around <strong>${dateStr}</strong>.`;
    } else if(statedPace>0){
      const weeksNeeded = remainingWeightedHours/statedPace;
      const finishDate = new Date(Date.now() + weeksNeeded*7*86400000);
      currentFinishDateIso = finishDate.toISOString().slice(0,10);
      const dateStr = finishDate.toLocaleDateString(undefined, {year:'numeric', month:'long', day:'numeric'});
      forecastLine = `Based on the ${statedPace} hrs/week you set in Profile — no meeting plans completed yet to measure a real pace from — you're on track to finish Phase 1 around <strong>${dateStr}</strong>.`;
    }
    if(state.originalFinishDate){
      const origDate = new Date(state.originalFinishDate+'T00:00:00');
      const origDateStr = origDate.toLocaleDateString(undefined, {year:'numeric', month:'long', day:'numeric'});
      if(currentFinishDateIso && currentFinishDateIso!==state.originalFinishDate){
        const diffDays = Math.round((new Date(currentFinishDateIso+'T00:00:00')-origDate)/86400000);
        forecastLine += ` Your original estimate, from when you first set your weekly hours, was <strong>${origDateStr}</strong> — you're now tracking about ${Math.abs(diffDays)} day${Math.abs(diffDays)===1?'':'s'} ${diffDays>0?'later':'earlier'} than that.`;
      } else if(!currentFinishDateIso){
        forecastLine += ` Your original estimate, from when you first set your weekly hours, was <strong>${origDateStr}</strong>.`;
      }
    }
    const diff = h - weightedHoursDone;
    if(meetingsTouched>0){
      hoursCompareLine = `You're at ${h.toFixed(1)} hours logged, having completed ${meetingsTouched}/${totalMeetings} meeting plans — weighted by each one's length, that's about ${weightedHoursDone.toFixed(1)} of the 100 hours' worth of Phase 1 content. So you're currently running ${Math.abs(diff).toFixed(1)} hours ${diff>=0?'over':'under'} the original estimate for how far you'd expect to be at this point. That's just informational — finishing the activities is what actually completes Phase 1, not hitting a particular hour count.`;
    } else {
      hoursCompareLine = `You're at ${h.toFixed(1)} hours logged so far. Once you complete a meeting plan, this will start comparing your actual hours against the original ~100-hour estimate for Phase 1.`;
    }
  } else if(endH && actualPace!=null || (phase!==1 && statedPace>0 && endH)){
    const pace = actualPace || statedPace;
    const remaining = Math.max(endH-h,0);
    if(remaining<=0){
      forecastLine = `Phase ${phase}'s ${endH-startH}-hour target is reached!`;
    } else {
      const weeksNeeded = remaining/pace;
      const finishDate = new Date(Date.now() + weeksNeeded*7*86400000);
      const dateStr = finishDate.toLocaleDateString(undefined, {year:'numeric', month:'long', day:'numeric'});
      const paceSource = actualPace ? `your actual pace so far (~${actualPace.toFixed(1)} hrs/week)` : `the ${statedPace} hrs/week you set in Profile`;
      forecastLine = `At ${paceSource}, you're on track to finish Phase ${phase} around <strong>${dateStr}</strong>.`;
    }
  } else if(!endH){
    forecastLine = 'Phase 6 has no fixed hour target — this is the open-ended final stretch.';
  }

  const p = state.profile;
  let title;
  if(p.name && p.language) title = `${escapeHtml(p.name)}'s ${escapeHtml(p.language)} learning companion`;
  else if(p.language) title = `Your ${escapeHtml(p.language)} learning companion`;
  else if(p.name) title = `${escapeHtml(p.name)}'s learning companion`;
  else title = 'Your learning companion';

  c.innerHTML = `
    <div style="margin-bottom:18px;">
      <h2 style="font-size:1.25rem;margin-bottom:8px;">${title}</h2>
      ${p.why ? `<div style="margin-bottom:4px;"><strong>Why?</strong> ${escapeHtml(p.why)}</div>` : ''}
      ${p.remember ? `<div><strong>Remember:</strong> <em>${escapeHtml(p.remember)}</em></div>` : ''}
      ${(!p.why && !p.remember) ? `<div class="empty">Add "why" and "what to remember" in Profile to see them here.</div>` : ''}
    </div>
    <div class="stat-row">
      <div class="stat"><div class="num">${h.toFixed(1)}${endH?'/'+endH:''}</div><div class="label">hours logged</div></div>
      <div class="stat"><div class="num">${meetingsTouched}/40</div><div class="label">meeting plans completed</div></div>
      <div class="stat"><div class="num">${totalRecordingsLogged()}</div><div class="label">recordings logged</div></div>
      <div class="stat"><div class="num">${state.words.filter(w=>w.iceberg===1).length}</div><div class="label">top of your iceberg</div></div>
      <div class="stat"><div class="num">${((state.revisionMinutes||0)/60).toFixed(1)}/${(MEETING_PLANS.length*1.5).toFixed(0)}</div><div class="label">revision hours</div></div>
    </div>
    <div class="empty" style="margin-bottom:16px;">${entryTypeBreakdown()}</div>
    <h3>Phase ${phase}</h3>
    <div class="meta" style="margin-bottom:4px;"><strong>Understanding:</strong> ${info.understand}</div>
    <div class="meta" style="margin-bottom:10px;"><strong>Talking:</strong> ${info.talk}</div>
    <div class="empty" style="margin-bottom:16px;">${forecastLine}</div>
    ${hoursCompareLine ? `<div class="empty" style="margin-bottom:16px;">${hoursCompareLine}</div>` : ''}
    <div class="empty" style="margin-bottom:16px;">Revision hours (~1.5 hrs planned per meeting plan across all ${MEETING_PLANS.length} of Phase 1) come from the Review section at the top of Meeting Plans and time spent in the Review tab — kept separate from the hours above, since revision isn't progress through the curriculum.</div>
  `;
}

// ---------- Per-activity timer ----------
let activeTimer = {planN:null, stepIdx:null, ms:0, running:false, startedAt:null};
let revisionTimer = {ms:0, running:false, startedAt:null};
function formatTimer(ms){
  const totalSec=Math.floor(ms/1000);
  const m=Math.floor(totalSec/60), s=totalSec%60;
  return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}
function startRevisionTimer(){
  revisionTimer.running = true;
  revisionTimer.startedAt = Date.now();
  renderMeetings(document.getElementById('content'));
}
function pauseRevisionTimer(){
  if(revisionTimer.running){ revisionTimer.ms += Date.now()-revisionTimer.startedAt; revisionTimer.running=false; }
  renderMeetings(document.getElementById('content'));
}
async function stopRevisionTimer(){
  if(revisionTimer.running){ revisionTimer.ms += Date.now()-revisionTimer.startedAt; revisionTimer.running=false; }
  const minutes = revisionTimer.ms/60000;
  if(minutes>0.1){
    state.revisionMinutes = (state.revisionMinutes||0) + minutes;
    await saveData();
  }
  revisionTimer = {ms:0, running:false, startedAt:null};
  renderMeetings(document.getElementById('content'));
}
function computeStepEstimates(detail){
  const WRAP_MIN = 8;
  const TOTAL_BUDGET = 150;
  const wrapCount = detail.steps.filter(s=>s.needsRecording).length;
  const playCount = detail.steps.length - wrapCount;
  const playBudget = Math.max(TOTAL_BUDGET - wrapCount*WRAP_MIN, playCount*5);
  const playEach = playCount>0 ? Math.round(playBudget/playCount) : 0;
  return detail.steps.map(s => s.needsRecording ? WRAP_MIN : playEach);
}
function estimateForKey(key){
  const parts = key.split('-');
  const mpN = Number(parts[0]);
  const stepIdx = Number(parts[1]);
  const detail = MEETING_DETAILS[mpN];
  if(!detail) return null;
  const estimates = computeStepEstimates(detail);
  return estimates[stepIdx] != null ? estimates[stepIdx] : null;
}
function estimateMeetingPlanMinutes(n){
  const detail = MEETING_DETAILS[n];
  if(!detail) return null;
  return computeStepEstimates(detail).reduce((a,b)=>a+b,0);
}
function meetingPlanHourWeights(){
  // Splits the 100-hour Phase 1 budget across all 40 meeting plans proportionally to each one's
  // estimated length, so a longer meeting plan gets a bigger share and a shorter one gets less —
  // rather than dividing evenly. Meeting plans not yet built out in full detail use the average
  // of the ones that are, as the best available estimate until they're detailed too.
  const knownMinutes = {};
  let sumKnown = 0, knownCount = 0;
  for(let n=1;n<=40;n++){
    const mins = estimateMeetingPlanMinutes(n);
    if(mins!=null){ knownMinutes[n]=mins; sumKnown+=mins; knownCount++; }
  }
  const avgMinutes = knownCount>0 ? sumKnown/knownCount : 150;
  const allMinutes = {};
  let totalMinutes = 0;
  for(let n=1;n<=40;n++){
    const m = knownMinutes[n]!=null ? knownMinutes[n] : avgMinutes;
    allMinutes[n] = m;
    totalMinutes += m;
  }
  const weights = {};
  for(let n=1;n<=40;n++){ weights[n] = totalMinutes>0 ? (allMinutes[n]/totalMinutes)*100 : 2.5; }

}
function paceComment(actualMin, estMin){
  const diff = actualMin-estMin;
  if(Math.abs(diff)<=2) return `logged ${actualMin} min — right on pace`;
  if(diff>0) return `logged ${actualMin} min — ${diff} min over the estimate`;
  return `logged ${actualMin} min — ${Math.abs(diff)} min under the estimate`;
}
function tickActiveTimer(){
  if(activeTimer.running){
    const key = activeTimer.planN+'-'+activeTimer.stepIdx;
    const el = document.getElementById('stepTimerDisp-'+key);
    if(el){
      const elapsedMs = activeTimer.ms + (Date.now()-activeTimer.startedAt);
      el.textContent = formatTimer(elapsedMs);
      const paceEl = document.getElementById('stepTimerPace-'+key);
      if(paceEl && paceEl.dataset.est){
        const est = Number(paceEl.dataset.est);
        const diff = (elapsedMs/60000)-est;
        if(Math.abs(diff)<1){ paceEl.textContent='on pace so far'; paceEl.style.color='var(--ink-soft)'; }
        else if(diff>0){ paceEl.textContent=`${diff.toFixed(1)} min over so far`; paceEl.style.color='var(--red)'; }
        else { paceEl.textContent=`${Math.abs(diff).toFixed(1)} min under so far`; paceEl.style.color='var(--teal)'; }
      }
    }
  }
  if(revisionTimer.running){
    const el = document.getElementById('revisionTimerDisp');
    if(el){
      const elapsedMs = revisionTimer.ms + (Date.now()-revisionTimer.startedAt);
      el.textContent = formatTimer(elapsedMs);
    }
  }
  if(reviewSessionStart){
    const el = document.getElementById('reviewSessionTimerDisp');
    if(el) el.textContent = formatTimer(Date.now()-reviewSessionStart);
  }
}
setInterval(tickActiveTimer, 1000);
function commitTimerToStorage(){
  if(activeTimer.planN==null || activeTimer.stepIdx==null || activeTimer.stepIdx==='whole') return;
  const minutes = Math.round(activeTimer.ms/60000);
  state.stepDurations = state.stepDurations || {};
  state.stepDurations[activeTimer.planN] = state.stepDurations[activeTimer.planN] || {};
  state.stepDurations[activeTimer.planN][activeTimer.stepIdx] = minutes;
  saveData();
}
function startStepTimer(planN, stepIdx){
  if(activeTimer.planN!==planN || activeTimer.stepIdx!==stepIdx){
    if(activeTimer.running){ activeTimer.ms += Date.now()-activeTimer.startedAt; activeTimer.running=false; }
    if(activeTimer.planN!=null) commitTimerToStorage();
    const existingMinutes = (stepIdx!=='whole' && state.stepDurations && state.stepDurations[planN] && state.stepDurations[planN][stepIdx]) || 0;
    activeTimer = {planN, stepIdx, ms: existingMinutes*60000, running:false, startedAt:null};
  }
  activeTimer.running = true; activeTimer.startedAt = Date.now();
  renderMeetings(document.getElementById('content'));
}
function pauseStepTimer(planN, stepIdx){
  if(activeTimer.planN===planN && activeTimer.stepIdx===stepIdx && activeTimer.running){
    activeTimer.ms += Date.now()-activeTimer.startedAt; activeTimer.running=false;
  }
  renderMeetings(document.getElementById('content'));
}
function stopStepTimer(planN, stepIdx){
  if(activeTimer.planN===planN && activeTimer.stepIdx===stepIdx){
    if(activeTimer.running){ activeTimer.ms += Date.now()-activeTimer.startedAt; activeTimer.running=false; }
    const minutes = Math.round(activeTimer.ms/60000);
    if(stepIdx==='whole'){
      const durEl=document.getElementById('mpDuration'); if(durEl) durEl.value=minutes;
    } else {
      state.stepDurations = state.stepDurations || {};
      state.stepDurations[planN] = state.stepDurations[planN] || {};
      state.stepDurations[planN][stepIdx] = minutes;
      saveData();
    }
    activeTimer = {planN:null, stepIdx:null, ms:0, running:false, startedAt:null};
  }
  renderMeetings(document.getElementById('content'));
}
function useStepTotal(planN){
  const durs = (state.stepDurations && state.stepDurations[planN]) || {};
  const total = Object.values(durs).reduce((a,b)=>a+(Number(b)||0),0);

  if(durEl) durEl.value = total;
}

  const mpN = meta.meetingPlan;
  if(mpN==null) return [];
  const mp = MEETING_PLANS.find(m=>Number(m.n)===Number(mpN));

  const baseKey = mp.detailed ? (mp.n+'-'+meta.stepIndex) : (mp.n+'-whole');

const STOPWORDS = new Set(['the','and','or','of','to','in','on','at','for','with','a','an','is','are','etc','more','other','words','word','some','words,','around','into','from','words.']);
function keywordsFrom(str){
  return (str||'').toLowerCase().split(/[^a-z0-9]+/).filter(w=>w.length>=3 && !STOPWORDS.has(w));
}
function autoMatchedLibraryPhotos(key, contextText){
  const actWords = new Set(keywordsFrom(contextText));
  if(actWords.size===0) return [];
  const dismissed = (state.materialsDismissed && state.materialsDismissed[key]) || [];
  const gameKeys = gameKeysFor(key);
  const attachedIds = [];
  gameKeys.forEach(k=>{
    ((state.activityMaterials && state.activityMaterials[k]) || []).forEach(a=>{ if(a.libId) attachedIds.push(a.libId); });
  });
  return state.photoLibrary.filter(p=>{
    if(dismissed.includes(p.id) || attachedIds.includes(p.id)) return false;
    const libWords = keywordsFrom((p.category||'')+' '+(p.label||''));
    return libWords.some(w=>actWords.has(w));
  });
}
function dismissAutoMatch(key, libId){
  state.materialsDismissed = state.materialsDismissed || {};
  state.materialsDismissed[key] = state.materialsDismissed[key] || [];
  state.materialsDismissed[key].push(libId);
  saveData();
  renderMeetings(document.getElementById('content'));
}
function gameKeysFor(key){
  const parts = key.split('-');
  const mpN = Number(parts[0]);
  const mp = MEETING_PLANS.find(m=>m.n===mpN);
  if(!mp || !mp.detailed) return [key];
  const detail = MEETING_DETAILS[mpN];
  if(!detail) return [key];
  const stepIdx = Number(parts[1]);
  const step = detail.steps[stepIdx];
  if(!step) return [key];
  const keys = [];
  detail.steps.forEach((s,i)=>{ if(s.game===step.game) keys.push(mpN+'-'+i); });
  return keys.length ? keys : [key];
}
function soloKeyFor(key){
  const parts = key.split('-');
  const mpN = Number(parts[0]);
  const detail = MEETING_DETAILS[mpN];
  const stepIdx = Number(parts[1]);
  const step = detail && detail.steps[stepIdx];
  return mpN+'::'+(step ? step.game : parts[1]);
}
function wordsForGame(key){
  const parts = key.split('-');
  const mpN = Number(parts[0]);
  const gameKeys = gameKeysFor(key);
  const stepIdxs = gameKeys.map(k=>Number(k.split('-')[1]));
  const words = state.words.filter(w=>w.meetingPlan===mpN && stepIdxs.includes(w.stepIndex));
  // Order to match the current attachment order where a link exists, so removing/reordering
  // reference pictures is reflected in solo practice rather than following raw creation order.
  const orderedLibIds = [];
  gameKeys.forEach(k=>{
    ((state.activityMaterials && state.activityMaterials[k]) || []).forEach(a=>{ if(a.libId) orderedLibIds.push(a.libId); });
  });
  return words.slice().sort((a,b)=>{
    const ai = a.sourceLibId ? orderedLibIds.indexOf(a.sourceLibId) : -1;
    const bi = b.sourceLibId ? orderedLibIds.indexOf(b.sourceLibId) : -1;
    if(ai===-1 && bi===-1) return 0;
    if(ai===-1) return 1;
    if(bi===-1) return -1;
    return ai-bi;
  });
}
const SOLO_WORD_SLOTS = ['sentence','article_definite','article_indefinite','bare'];
function picturesForGame(key){
  // Always derived fresh from the current attachments — this is what makes Assign Pictures,
  // the meeting-plan reference area, and Solo Setup/Practice all stay in sync automatically,
  // no matter which of the two places a picture was added, removed, or edited from.
  const gameKeys = gameKeysFor(key);
  const pics = [];
  const seen = new Set();
  gameKeys.forEach(k=>{
    ((state.activityMaterials && state.activityMaterials[k]) || []).forEach(a=>{
      if(!a.libId || seen.has(a.libId)) return;
      seen.add(a.libId);
      pics.push({libId:a.libId, source:a.source, code:a.code, gender:a.gender||null, noArticle:!!a.noArticle, src:resolveAttachedSrc(a)});
    });
  });
  return pics;
}
function wordsForPicture(libId){
  return SOLO_WORD_SLOTS.map(slot => state.words.find(w=>w.sourceLibId===libId && w.wordSlot===slot) || null);
}

}

// ---------- Live Activity Mode ----------
let liveActivity = null;
const LIVE_GRID_MAX = 15;
function weightedSampleWithoutReplacement(items, weights, k){
  const keyed = items.map((it,i)=>({it, key: Math.pow(Math.random(), 1/Math.max(weights[i], 0.0001))}));
  keyed.sort((a,b)=>b.key-a.key);
  return keyed.slice(0, k).map(x=>x.it);
}
function shuffleArray(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
function startLiveActivity(key){
  const gameKeys = gameKeysFor(key);
  const pool = [];
  gameKeys.forEach(k=>{
    ((state.activityMaterials && state.activityMaterials[k]) || []).forEach((a,idx)=>{
      const src = resolveAttachedSrc(a);
      if(src) pool.push({id: k+'|'+idx, src});
    });
  });
  if(pool.length===0) return;
  liveActivity = {
    pool,
    introduced: [],
    remaining: shuffleArray(pool.map(p=>p.id)),
    roundsSince: {},
    currentGrid: [],
    mode: null,
    startKey: key
  };
  const parts = key.split('-');
  startStepTimer(Number(parts[0]), Number(parts[1]));
  render();
}
function rebuildLiveGrid(forceIncludeId){
  const la = liveActivity;
  if(!la) return;
  la.introduced.forEach(id=>{
    if(la.currentGrid.includes(id)) la.roundsSince[id] = 0;
    else la.roundsSince[id] = (la.roundsSince[id]||0) + 1;
  });
  let gridIds = [];
  let pool = la.introduced.slice();
  if(forceIncludeId){
    gridIds.push(forceIncludeId);
    pool = pool.filter(id=>id!==forceIncludeId);
  }
  const slotsLeft = Math.min(LIVE_GRID_MAX, la.introduced.length) - gridIds.length;
  if(slotsLeft>0 && pool.length>0){
    const weights = pool.map(id=>(la.roundsSince[id]||0)+1);
    gridIds = gridIds.concat(weightedSampleWithoutReplacement(pool, weights, Math.min(slotsLeft, pool.length)));
  }
  la.currentGrid = shuffleArray(gridIds);
}
function liveIntroduceNext(){
  const la = liveActivity;
  if(!la || la.remaining.length===0) return;
  const idx = Math.floor(Math.random()*la.remaining.length);
  const nextId = la.remaining.splice(idx,1)[0];
  la.introduced.push(nextId);
  la.mode = 'new';
  rebuildLiveGrid(nextId);
  render();
}
function liveQuiz(){
  const la = liveActivity;
  if(!la || la.introduced.length===0) return;
  la.mode = 'quiz';
  rebuildLiveGrid(null);
  render();
}
function endLiveActivity(){
  if(liveActivity && liveActivity.startKey){
    const parts = liveActivity.startKey.split('-');
    stopStepTimer(Number(parts[0]), Number(parts[1]));
  }
  liveActivity = null;
  render();
}

function soloReadiness(key){

  const questions = state.activityQuestions[soloKeyStr] || [];
  const picsReady = pics.length>0 && pics.every(p=>{
    const [sentW, artDefW, artIndefW, bareW] = wordsForPicture(p.libId);
    const coreReady = sentW && sentW.hasAudio && bareW && bareW.hasAudio;
    const articlesReady = p.noArticle || (artDefW && artDefW.hasAudio && artIndefW && artIndefW.hasAudio);
    return coreReady && articlesReady;

function playStoredAudio(key){

      if(res && res.value){
        const audio = new Audio(JSON.parse(res.value).dataUrl);
        audio.onended = ()=>resolve();
        audio.onerror = ()=>resolve();
        audio.play().catch(()=>resolve());
      } else resolve();
    }catch(e){ resolve(); }
  });
}

async function toggleSoloNoArticle(key, libId){
  const gameKeys = gameKeysFor(key);
  for(const k of gameKeys){
    const found = ((state.activityMaterials&&state.activityMaterials[k])||[]).find(a=>a.libId===libId);
    if(found){
      found.noArticle = !found.noArticle;
      break;
    }
  }
  await saveData();
  renderSoloSetup(document.getElementById('content'));
}
function recordActivitySlot(key, libId, slot){
  if(activeRecorder && activeRecorder.state==='recording') return;
  const existing = state.words.find(w=>w.sourceLibId===libId && w.wordSlot===slot);
  const wordId = existing ? existing.id : uid();
  const elId = 'soloSlotStatus-'+libId+'-'+slot;
  startWordRecording(wordId, elId, ()=>{
    let w = state.words.find(x=>x.id===wordId);
    if(!w){
      const gameKeys = gameKeysFor(key);
      let attachment = null, ownerKey = key;
      for(const k of gameKeys){
        const found = ((state.activityMaterials&&state.activityMaterials[k])||[]).find(a=>a.libId===libId);
        if(found){ attachment = found; ownerKey = k; break; }
      }
      const parts = ownerKey.split('-');
      const libEntry = state.photoLibrary.find(p=>p.id===libId);
      w = {
        id: wordId, text: (attachment&&attachment.code) || (libEntry&&libEntry.label) || '',
        meetingPlan: Number(parts[0]), stepIndex: Number(parts[1]),
        photo: libEntry ? libEntry.dataUrl : '', gender: (attachment&&attachment.gender)||null,
        entryType:'word', sourceLibId: libId, wordSlot: slot,
        hasAudio:false, iceberg:9, dateAdded: new Date().toISOString().slice(0,10), reviewCount:0
      };
      state.words.push(w);
    }
    w.hasAudio = true;
    saveData();
    renderSoloSetup(document.getElementById('content'));
  });
}
function recordSoloQuestion(key){
  if(activeRecorder && activeRecorder.state==='recording') return;
  if(!soloQuestionSelectedWordId) return;
  const id = uid();
  const soloKeyStr = soloKeyFor(key);

    state.activityQuestions[soloKeyStr] = state.activityQuestions[soloKeyStr] || [];
    state.activityQuestions[soloKeyStr].push({id, libId});
    saveData();
    const statusEl = document.getElementById('soloQuestionRecordStatus');
    if(statusEl) statusEl.innerHTML = '';

  }, 'wordaudio:'+id);
}

    introduced: [],

    phase: 'intro',
    introducingLibId: null,
    introSlot: SOLO_INTRO_SLOTS[0],
    introRepeatsLeft: 2,

    currentQuestion: null,
    stats: {seen:0, known:0},

  };

const SOLO_INTRO_SLOTS = ['sentence','article_definite','article_indefinite','bare'];
function nextIntroSlot(currentSlot, noArticle){
  let idx = SOLO_INTRO_SLOTS.indexOf(currentSlot);
  while(idx < SOLO_INTRO_SLOTS.length-1){
    idx++;
    const candidate = SOLO_INTRO_SLOTS[idx];
    if(noArticle && (candidate==='article_definite' || candidate==='article_indefinite')) continue;
    return candidate;
  }
  return null;
}
function introduceSoloPicture(){
  const sp = soloPractice;
  if(!sp || sp.remaining.length===0) return;
  const libId = sp.remaining.shift();
  sp.introduced.push(libId);
  sp.phase = 'intro';
  sp.introducingLibId = libId;
  const pic = sp.pics.find(p=>p.libId===libId);
  sp.introSlot = (pic && pic.noArticle) ? 'sentence' : SOLO_INTRO_SLOTS[0];
  sp.introRepeatsLeft = 2;
  runSoloIntroStep();
}
async function runSoloIntroStep(){
  const sp = soloPractice;
  if(!sp || sp.phase!=='intro') return;
  const words = wordsForPicture(sp.introducingLibId);
  const slotWord = words[SOLO_WORD_SLOTS.indexOf(sp.introSlot)];
  render();
  if(slotWord) await playStoredAudio('wordaudio:'+slotWord.id);
  if(!soloPractice || soloPractice.phase!=='intro') return;
  sp.introRepeatsLeft--;
  if(sp.introRepeatsLeft<=0){
    const pic = sp.pics.find(p=>p.libId===sp.introducingLibId);
    const next = nextIntroSlot(sp.introSlot, pic && pic.noArticle);
    if(next){
      sp.introSlot = next;
      sp.introRepeatsLeft = 2;
      runSoloIntroStep();
      return;
    }
    // finished introducing this picture — bootstrap needs at least 2 before quizzing starts
    if(sp.introduced.length < 2 && sp.remaining.length > 0){
      introduceSoloPicture();
      return;
    }
    startSoloQuizPhase();
    return;
  }
  runSoloIntroStep();
}
function startSoloQuizPhase(){
  const sp = soloPractice;
  if(!sp) return;
  sp.phase = 'quiz';
  pickSoloQuestion();
}
function pickSoloQuestion(){
  const sp = soloPractice;
  if(!sp) return;
  const eligible = sp.questions.filter(q=>sp.introduced.includes(q.libId));
  if(eligible.length===0) return;
  sp.currentQuestion = eligible[Math.floor(Math.random()*eligible.length)];
  sp.currentGrid = shuffleArray(sp.introduced.slice());
  sp.wrongAttempt = false;
  sp.feedback = null;
  render();
  playStoredAudio('wordaudio:'+sp.currentQuestion.id);
}
function soloIntroduceNext(){
  const sp = soloPractice;
  if(!sp || sp.remaining.length===0) return;
  introduceSoloPicture();
}
function handleSoloPick(libId){
  const sp = soloPractice;
  if(!sp || sp.phase!=='quiz' || !sp.currentQuestion) return;
  const correct = sp.currentQuestion.libId;
  if(libId===correct){
    sp.stats.seen++;
    const knewIt = !sp.wrongAttempt;
    if(knewIt) sp.stats.known++;
    // Answering the picture correctly reinforces every phrase-form recorded for it.
    state.words.filter(w=>w.sourceLibId===libId).forEach(w=>{
      w.iceberg = knewIt ? Math.max(w.iceberg-1,1) : Math.min(w.iceberg+1,9);
      w.lastReview = new Date().toISOString().slice(0,10);
      w.reviewCount = (w.reviewCount||0)+1;
    });
    saveData();
    sp.feedback = 'correct';
    render();
    playRandomAnswerSound('yes').then(()=>{
      if(soloPractice) pickSoloQuestion();
    });
  } else {
    sp.wrongAttempt = true;
    render();
    playRandomAnswerSound('no').then(()=>{
      if(soloPractice && soloPractice.currentQuestion) playStoredAudio('wordaudio:'+soloPractice.currentQuestion.id);
    });
  }
}
function endSoloPractice(){
  if(soloPractice && soloPractice.key){
    const parts = soloPractice.key.split('-');
    stopStepTimer(Number(parts[0]), Number(parts[1]));
  }
  soloPractice = null;
  render();
}
function renderSoloPractice(c){

  const timerId = 'stepTimerDisp-'+sp.key;
  const est = estimateForKey(sp.key);
  const estHtml = est!=null ? `<span class="tm">~${est} min estimated</span>` : '';
  if(sp.phase==='intro'){

    c.innerHTML = `

        ${estHtml}
      </div>

function compositeDescribedObjectImage(describedObjId){
  // Draws the base object plus each picture-descriptor onto one canvas, stacked with one badge
  // above and one below the object (rather than cascaded in a corner), so the whole "big red
  // broom" reads as a single combined image during practice. The canvas is taller than it is
  // wide to make room for this without shrinking the object itself — object-fit:contain wherever
  // this gets displayed scales the result correctly regardless of that taller aspect ratio.
  // Badges are sized large relative to the object on purpose: objects get displayed quite small
  // once placed on a scene, so a badge that reads clearly at full size would otherwise shrink to
  // the point of being unreadable. Text descriptors are deliberately not drawn here, since the
  // app avoids showing text during practice; a described object meant to be visually
  // distinguishable should use picture descriptors instead.
  return new Promise((resolve)=>{
    const d = state.describedObjects.find(x=>x.id===describedObjId);
    if(!d){ resolve(''); return; }
    const pictureDescs = (d.descriptors||[]).filter(desc=>desc.isPicture && desc.src);
    if(pictureDescs.length===0){ resolve(d.baseObjSrc); return; }
    const baseImg = new Image();
    baseImg.onerror = ()=> resolve(d.baseObjSrc);
    baseImg.onload = ()=>{
      const baseSize = Math.max(baseImg.width, baseImg.height, 200);
      const badgeSize = baseSize * 0.55;
      const topDesc = pictureDescs[0] || null;
      const bottomDesc = pictureDescs[1] || null;
      const extraDescs = pictureDescs.slice(2);
      const bandGap = baseSize * 0.06;
      const topBand = topDesc ? badgeSize + bandGap : 0;
      const bottomBand = bottomDesc ? badgeSize + bandGap : 0;
      const canvasW = baseSize;
      const canvasH = topBand + baseSize + bottomBand;
      const canvas = document.createElement('canvas');
      canvas.width = canvasW; canvas.height = canvasH;
      const ctx = canvas.getContext('2d');
      const drawBadge = (im, y) => {
        if(!im) return;
        const bx = (canvasW-badgeSize)/2;
        ctx.fillStyle = '#fff';
        ctx.fillRect(bx-2, y-2, badgeSize+4, badgeSize+4);
        ctx.strokeStyle = '#ccc';
        ctx.strokeRect(bx-2, y-2, badgeSize+4, badgeSize+4);
        ctx.drawImage(im, bx, y, badgeSize, badgeSize);
      };
      Promise.all([topDesc, bottomDesc, ...extraDescs].map(desc=>desc ? new Promise((res)=>{
        const im = new Image();
        im.onerror = ()=>res(null);
        im.onload = ()=>res(im);
        im.src = desc.src;
      }) : Promise.resolve(null))).then(loaded=>{
        const [topImg, bottomImg, ...extraImgs] = loaded;
        drawBadge(topImg, 0);
        const bw = baseSize*0.8, bh = baseSize*0.8;
        ctx.drawImage(baseImg, (canvasW-bw)/2, topBand+(baseSize-bh)/2, bw, bh);
        drawBadge(bottomImg, topBand+baseSize+bandGap);
        // Any extra picture-descriptors beyond the top/bottom pair get a small row along the side
        extraImgs.filter(Boolean).forEach((im,i)=>{
          const s = badgeSize*0.5;
          ctx.drawImage(im, canvasW-s-4, topBand+4+(i*(s+4)), s, s);
        });
        resolve(canvas.toDataURL('image/jpeg', 0.85));
      });
    };
    baseImg.src = d.baseObjSrc;
  });
}

async function posPickDescribedObject(mode, describedObjId){
  const data = posData();
  if(!data) return;
  const d = state.describedObjects.find(x=>x.id===describedObjId);
  if(!d) return;
  const src = await compositeDescribedObjectImage(describedObjId);
  if(mode==='base'){
    data.baseImage = {source:'described', libId:describedObjId, src, code:d.compositeLabel||d.baseCode};
  } else if(mode==='action'){
    if(!data.actions.some(o=>o.libId===describedObjId && o.source==='described')){
      data.actions.push({source:'described', libId:describedObjId, src, code:d.compositeLabel||d.baseCode});
    }
  } else {
    if(!data.objects.some(o=>o.libId===describedObjId && o.source==='described')){
      data.objects.push({source:'described', libId:describedObjId, src, code:d.compositeLabel||d.baseCode});
    }
  }
  saveData();
  renderPositionSetup(document.getElementById('content'));
}

function posRandomizeCombinations(key){
  const data = posData(key);
  if(!data || data.zones.length===0 || data.objects.length===0) return;
  const countEl = document.getElementById('posRandomCount');
  const count = Math.max(1, Math.min(data.objects.length, Number(countEl ? countEl.value : 1) || 1));
  data.zones.forEach(zone=>{
    const shuffled = shuffleArray(data.objects.slice());
    const chosen = shuffled.slice(0, count);
    chosen.forEach(obj=>{
      const exists = data.combinations.some(c=>c.zoneId===zone.id && c.objLibId===obj.libId && !c.actionLibId);
      if(!exists){
        data.combinations.push({id:uid(), zoneId:zone.id, objLibId:obj.libId, actionLibId:null, wordId:uid()});
      }
    });
  });
  saveData();
  renderPositionSetup(document.getElementById('content'));

let positionPractice = null;
async function startPositionPractice(key){
  await preloadAnswerSounds();
  const data = posData(key);
  const r = posReadiness(key);
  positionSetup = null;
  positionPractice = {
    key, data,
    introduced: [],
    remaining: r.recordedCombos.map(c=>c.id),
    phase:'intro',
    introducingComboId:null,
    currentQuestion:null,
    selectedObjLibId:null,
    selectedActionLibId:null,
    stats:{seen:0, known:0},
    wrongAttempt:false,
    feedback:null
  };
  const parts = key.split('-');
  startStepTimer(Number(parts[0]), Number(parts[1]));
  render();
  posIntroduceCombo();
}
function posIntroduceCombo(){
  const pp = positionPractice;
  if(!pp || pp.remaining.length===0) return;
  const comboId = pp.remaining.shift();
  pp.introduced.push(comboId);
  pp.phase = 'intro';
  pp.introducingComboId = comboId;
  runPosIntroStep();
}
async function runPosIntroStep(){
  const pp = positionPractice;
  if(!pp || pp.phase!=='intro') return;
  const combo = pp.data.combinations.find(c=>c.id===pp.introducingComboId);
  render();
  if(combo) await playStoredAudio('wordaudio:'+combo.wordId);
  if(!positionPractice || positionPractice.phase!=='intro') return;
  if(pp.introduced.length < 2 && pp.remaining.length > 0){
    posIntroduceCombo();
    return;
  }
  startPosQuizPhase();
}
function startPosQuizPhase(){
  const pp = positionPractice;
  if(!pp) return;
  pp.phase = 'quiz';
  pickPosQuestion();
}
function pickPosQuestion(){
  const pp = positionPractice;
  if(!pp) return;
  const eligible = pp.data.questions.filter(q=>pp.introduced.includes(q.comboId));
  if(eligible.length===0) return;
  pp.currentQuestion = eligible[Math.floor(Math.random()*eligible.length)];
  pp.wrongAttempt = false;
  pp.feedback = null;
  pp.selectedObjLibId = null;
  pp.selectedActionLibId = null;
  render();
  playStoredAudio('wordaudio:'+pp.currentQuestion.id);
}
function posIntroduceNext(){
  const pp = positionPractice;
  if(!pp || pp.remaining.length===0) return;
  posIntroduceCombo();
}
function posSelectQuizAction(libId){
  const pp = positionPractice;
  if(!pp || pp.phase!=='quiz' || !pp.currentQuestion) return;
  pp.selectedActionLibId = libId;
  render();
}
function comboNeedsAction(pp){
  const combo = pp.data.combinations.find(c=>c.id===pp.currentQuestion.comboId);
  return combo && !!combo.actionLibId;
}
function posSelectPlaceObject(libId){
  const pp = positionPractice;
  if(!pp || pp.phase!=='quiz' || !pp.currentQuestion || pp.currentQuestion.mode!=='place') return;
  pp.selectedObjLibId = libId;
  render();
}
function posAttemptPlace(ev){
  const pp = positionPractice;
  if(!pp || pp.phase!=='quiz' || !pp.currentQuestion || pp.currentQuestion.mode!=='place') return;
  if(!pp.selectedObjLibId) return;
  if(comboNeedsAction(pp) && !pp.selectedActionLibId) return;
  const rect = ev.target.getBoundingClientRect();
  const x = ((ev.clientX-rect.left)/rect.width)*100;
  const y = ((ev.clientY-rect.top)/rect.height)*100;
  const data = pp.data;
  let nearest = null, nearestDist = Infinity;
  data.zones.forEach(z=>{
    const d = Math.hypot(z.x-x, z.y-y);
    if(d<nearestDist){ nearestDist=d; nearest=z; }
  });
  if(!nearest) return;
  const combo = data.combinations.find(c=>c.id===pp.currentQuestion.comboId);
  const actionOk = combo && ((combo.actionLibId||null) === (pp.selectedActionLibId||null));
  const correct = combo && combo.objLibId===pp.selectedObjLibId && combo.zoneId===nearest.id && actionOk;
  if(correct){
    pp.stats.seen++;
    const knewIt = !pp.wrongAttempt;
    if(knewIt) pp.stats.known++;
    const w = state.words.find(x=>x.id===combo.wordId);
    if(w){
      w.iceberg = knewIt ? Math.max(w.iceberg-1,1) : Math.min(w.iceberg+1,9);
      w.lastReview = new Date().toISOString().slice(0,10);
      w.reviewCount = (w.reviewCount||0)+1;
    }
    saveData();
    pp.feedback = 'correct';
    pp.selectedObjLibId = null;
    pp.selectedActionLibId = null;
    render();
    playRandomAnswerSound('yes').then(()=>{ if(positionPractice) pickPosQuestion(); });
  } else {
    pp.wrongAttempt = true;
    pp.selectedObjLibId = null;
    pp.selectedActionLibId = null;
    render();
    playRandomAnswerSound('no').then(()=>{
      if(positionPractice && positionPractice.currentQuestion) playStoredAudio('wordaudio:'+positionPractice.currentQuestion.id);
    });
  }
}
function handlePosPick(comboId){
  const pp = positionPractice;
  if(!pp || pp.phase!=='quiz' || !pp.currentQuestion) return;
  if(comboNeedsAction(pp) && !pp.selectedActionLibId) return;
  const correctCombo = pp.data.combinations.find(c=>c.id===pp.currentQuestion.comboId);
  const actionOk = correctCombo && ((correctCombo.actionLibId||null) === (pp.selectedActionLibId||null));
  const correct = comboId===pp.currentQuestion.comboId && actionOk;
  if(correct){
    pp.stats.seen++;
    const knewIt = !pp.wrongAttempt;
    if(knewIt) pp.stats.known++;
    const combo = pp.data.combinations.find(c=>c.id===comboId);
    if(combo){
      const w = state.words.find(x=>x.id===combo.wordId);
      if(w){
        w.iceberg = knewIt ? Math.max(w.iceberg-1,1) : Math.min(w.iceberg+1,9);
        w.lastReview = new Date().toISOString().slice(0,10);
        w.reviewCount = (w.reviewCount||0)+1;
      }
    }
    saveData();
    pp.feedback = 'correct';
    pp.selectedActionLibId = null;
    render();
    playRandomAnswerSound('yes').then(()=>{ if(positionPractice) pickPosQuestion(); });
  } else {
    pp.wrongAttempt = true;
    pp.selectedActionLibId = null;
    render();
    playRandomAnswerSound('no').then(()=>{
      if(positionPractice && positionPractice.currentQuestion) playStoredAudio('wordaudio:'+positionPractice.currentQuestion.id);
    });
  }
}
function endPositionPractice(){
  if(positionPractice && positionPractice.key){
    const parts = positionPractice.key.split('-');
    stopStepTimer(Number(parts[0]), Number(parts[1]));
  }
  positionPractice = null;
  render();
}
function computeFannedPositions(items){
  // items: [{key, x, y}]. When multiple objects land close enough together to visually collide,
  // arrange them evenly around a small circle centered on the true position, rather than letting
  // them stack exactly on top of each other or scatter unpredictably far from where they belong.
  const THRESHOLD = 11;
  const RADIUS = 7;
  const result = items.map(it=>({...it}));
  const assigned = new Array(result.length).fill(-1);
  const clusters = [];
  for(let i=0;i<result.length;i++){
    if(assigned[i]!==-1) continue;
    const cluster = [i];
    assigned[i] = clusters.length;
    for(let j=i+1;j<result.length;j++){
      if(assigned[j]!==-1) continue;
      const dx = result[i].x-result[j].x, dy = result[i].y-result[j].y;
      if(Math.sqrt(dx*dx+dy*dy) < THRESHOLD){ cluster.push(j); assigned[j]=clusters.length; }
    }
    clusters.push(cluster);
  }
  clusters.forEach(cluster=>{
    if(cluster.length<=1) return;
    const n = cluster.length;
    const cx = cluster.reduce((s,idx)=>s+result[idx].x,0)/n;
    const cy = cluster.reduce((s,idx)=>s+result[idx].y,0)/n;
    cluster.forEach((idx,ci)=>{
      const angle = (2*Math.PI*ci)/n;
      result[idx].x = Math.max(6, Math.min(94, cx + RADIUS*Math.cos(angle)));
      result[idx].y = Math.max(6, Math.min(94, cy + RADIUS*Math.sin(angle)));
    });
  });
  return result;
}

function acRandomizeCombinations(key){
  const data = acData(key);
  if(!data || data.actions.length===0 || data.objects.length===0) return;
  const countEl = document.getElementById('acRandomCount');
  const count = Math.max(1, Math.min(data.objects.length, Number(countEl ? countEl.value : 1) || 1));
  data.actions.forEach(action=>{
    const shuffled = shuffleArray(data.objects.slice());
    const chosen = shuffled.slice(0, count);
    chosen.forEach(obj=>{
      const exists = data.combinations.some(c=>c.actionLibId===action.libId && c.objLibId===obj.libId);
      if(!exists){
        data.combinations.push({id:uid(), actionLibId:action.libId, objLibId:obj.libId, wordId:uid()});
      }
    });
  });
  saveData();
  renderActionComboSetup(document.getElementById('content'));
}

function acReadiness(key){
  const data = acData(key);
  if(!data) return {ready:false};
  const hasActions = data.actions.length>=1;
  const hasObjects = data.objects.length>=1;

  const questionsReady = data.questions.length>=1 && data.questions.every(q=>recordedCombos.some(c=>c.id===q.comboId));

let actionComboPractice = null;
async function startActionComboPractice(key){
  await preloadAnswerSounds();
  const data = acData(key);
  const r = acReadiness(key);
  actionComboSetup = null;
  actionComboPractice = {
    key, data,
    introduced: [],
    remaining: r.recordedCombos.map(c=>c.id),
    phase:'intro',
    introducingComboId:null,
    currentQuestion:null,
    selectedActionLibId:null,
    selectedObjLibId:null,
    stats:{seen:0, known:0},
    wrongAttempt:false,
    feedback:null
  };
  const parts = key.split('-');
  startStepTimer(Number(parts[0]), Number(parts[1]));
  render();
  acIntroduceCombo();

function acIntroduceCombo(){
  const acp = actionComboPractice;
  if(!acp || acp.remaining.length===0) return;
  const comboId = acp.remaining.shift();
  acp.introduced.push(comboId);
  acp.phase = 'intro';
  acp.introducingComboId = comboId;
  runACIntroStep();
}
async function runACIntroStep(){
  const acp = actionComboPractice;
  if(!acp || acp.phase!=='intro') return;
  const combo = acp.data.combinations.find(c=>c.id===acp.introducingComboId);
  render();
  if(combo) await playStoredAudio('wordaudio:'+combo.wordId);
  if(!actionComboPractice || actionComboPractice.phase!=='intro') return;
  if(acp.introduced.length < 2 && acp.remaining.length > 0){
    acIntroduceCombo();
    return;
  }
  startACQuizPhase();

function startACQuizPhase(){

function pickACQuestion(){
  const acp = actionComboPractice;
  if(!acp) return;
  const eligible = acp.data.questions.filter(q=>acp.introduced.includes(q.comboId));
  if(eligible.length===0) return;
  acp.currentQuestion = eligible[Math.floor(Math.random()*eligible.length)];
  acp.selectedActionLibId = null;
  acp.selectedObjLibId = null;
  acp.wrongAttempt = false;
  acp.feedback = null;
  // Reshuffle the grid order on every new question, so the correct answer is never predictable
  // by position alone — the person has to actually recognize the picture and sound each time.
  const introducedCombos = acp.introduced.map(id=>acp.data.combinations.find(c=>c.id===id)).filter(Boolean);
  acp.actionOrder = shuffleArray([...new Set(introducedCombos.map(c=>c.actionLibId))]);
  acp.objOrder = shuffleArray([...new Set(introducedCombos.map(c=>c.objLibId))]);
  render();
  playStoredAudio('wordaudio:'+acp.currentQuestion.id);
}

function handleACCheck(){
  const acp = actionComboPractice;
  if(!acp || !acp.currentQuestion) return;
  const combo = acp.data.combinations.find(c=>c.id===acp.currentQuestion.comboId);
  if(!combo) return;
  const correct = acp.selectedActionLibId===combo.actionLibId && acp.selectedObjLibId===combo.objLibId;
  if(correct){
    acp.stats.seen++;
    const knewIt = !acp.wrongAttempt;
    if(knewIt) acp.stats.known++;
    const w = state.words.find(x=>x.id===combo.wordId);
    if(w){
      w.iceberg = knewIt ? Math.max(w.iceberg-1,1) : Math.min(w.iceberg+1,9);
      w.lastReview = new Date().toISOString().slice(0,10);
      w.reviewCount = (w.reviewCount||0)+1;
    }
    saveData();
    acp.feedback = 'correct';
    render();
    playRandomAnswerSound('yes').then(()=>{ if(actionComboPractice) pickACQuestion(); });
  } else {
    acp.wrongAttempt = true;
    acp.selectedActionLibId = null;
    acp.selectedObjLibId = null;
    render();
    playRandomAnswerSound('no').then(()=>{
      if(actionComboPractice && actionComboPractice.currentQuestion) playStoredAudio('wordaudio:'+actionComboPractice.currentQuestion.id);
    });
  }
}

  const mpN = Number(parts[0]);
  const mp = MEETING_PLANS.find(m=>m.n===mpN);

  if(!mp.detailed) return true;

  return step ? !!step.needsRecording : true;

async function resetMeetingPlanTime(){
  const el = document.getElementById('resetMPNumber');
  const n = Number(el ? el.value : 0);
  if(!n || n<1 || n>40) return;
  if(!confirm(`This will reset logged hours, revision-related step timers, checked-off steps, and completion status for Meeting Plan ${n} only — every other meeting plan is untouched. Pictures, recordings, and words for Meeting Plan ${n} are never touched either. This can't be undone. Continue?`)) return;
  state.sessions = state.sessions.filter(s=>s.meetingPlan!==n);
  if(state.stepDurations) delete state.stepDurations[n];
